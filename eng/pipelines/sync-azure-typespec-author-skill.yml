# Mirror the azure-typespec-author skill to azure-rest-api-specs.
#
# For more information on this file, please see:
# doc/engsys_workflows_and_skills.md
parameters:
- name: DirectoryToSync
  type: string
  default: .github/skills/azure-typespec-author
- name: FilePatterns
  type: object
  default:
    # Sync only runtime skill content. Evaluation and refinement assets remain
    # local to azure-sdk-tools.
    - 'SKILL.md'
    - 'references'
- name: Repos
  type: object
  default:
    - RepoOwner: Azure
      RepoName: azure-rest-api-specs

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - .github/skills/azure-typespec-author/SKILL.md
      - .github/skills/azure-typespec-author/references/**

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-tool-repo-sync.yml
  parameters:
    DirectoryToSync: ${{ parameters.DirectoryToSync }}
    FilePatterns: ${{ parameters.FilePatterns }}
    AdditionalCheckoutPaths:
      - .github/package.json
      - .github/package-lock.json
    PreSyncValidationSteps:
      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
        displayName: Use Node 22

      - script: npm ci
        workingDirectory: .github
        displayName: Install Prettier

      - script: npm exec -- prettier --check "skills/azure-typespec-author/SKILL.md" "skills/azure-typespec-author/references/**"
        workingDirectory: .github
        displayName: Check azure-typespec-author formatting with Prettier
    Repos: ${{ parameters.Repos }}