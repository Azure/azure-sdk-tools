trigger: none
pr: none

parameters:
  - name: publishDevFeed
    displayName: Publish to the Java dev feed
    type: boolean
    default: false

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: Build
        displayName: Build and test
        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml

        jobs:
          - job: Build
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux

            steps:
              - template: /eng/common/pipelines/templates/steps/maven-authenticate.yml

              - task: Maven@4
                displayName: Build and test
                inputs:
                  mavenPomFile: src/java/apiview-java-processor/pom.xml
                  goals: clean verify
                  options: --batch-mode --no-transfer-progress -Prelease
                  javaHomeOption: JDKVersion
                  jdkVersionOption: '1.8'
                  jdkArchitectureOption: x64
                  publishJUnitResults: true
                  testResultsFiles: src/java/apiview-java-processor/target/surefire-reports/TEST-*.xml

              - pwsh: |
                  $projectDirectory = Join-Path "$(Build.SourcesDirectory)" "src/java/apiview-java-processor"
                  [xml]$pom = Get-Content -Path (Join-Path $projectDirectory "pom.xml")
                  $version = $pom.project.version
                  $stagingDirectory = Join-Path "$(Build.ArtifactStagingDirectory)" "apiview-java-processor"

                  New-Item -ItemType Directory -Force -Path $stagingDirectory | Out-Null
                  foreach ($suffix in @("", "-sources", "-javadoc")) {
                    $jarPath = Join-Path $projectDirectory "target/apiview-java-processor-$version$suffix.jar"
                    if (-not (Test-Path -Path $jarPath -PathType Leaf)) {
                      throw "Expected package was not produced: $jarPath"
                    }
                    Copy-Item -Path $jarPath -Destination $stagingDirectory
                  }
                  Copy-Item -Path (Join-Path $projectDirectory "pom.xml") `
                    -Destination (Join-Path $stagingDirectory "apiview-java-processor-$version.pom")
                displayName: Stage Maven package

              - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
                parameters:
                  ArtifactName: apiview-java-processor
                  ArtifactPath: $(Build.ArtifactStagingDirectory)/apiview-java-processor

      - stage: PublishDevFeed
        displayName: Sign and publish to Java dev feed
        dependsOn: Build
        condition: |
          and(
            succeeded(),
            eq(${{ parameters.publishDevFeed }}, true),
            eq(variables['Build.Reason'], 'Manual'),
            eq(variables['Build.SourceBranch'], 'refs/heads/main'),
            eq(variables['System.TeamProject'], 'internal')
          )
        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml

        jobs:
          - job: PublishDevFeed
            displayName: Sign and publish Maven package
            pool:
              name: $(WINDOWSPOOL)
              image: $(WINDOWSVMIMAGE)
              os: windows

            steps:
              - checkout: self
                path: s

              - checkout: azure-sdk-build-tools
                path: azure-sdk-build-tools

              - download: current
                displayName: Download Maven package
                artifact: apiview-java-processor

              - template: /eng/common/pipelines/templates/steps/maven-authenticate.yml

              - pwsh: |
                  $packageDirectory = "$(Pipeline.Workspace)\apiview-java-processor"
                  $pomFiles = @(Get-ChildItem -Path $packageDirectory -Filter *.pom -File -ErrorAction Stop)
                  if ($pomFiles.Count -ne 1) {
                    throw "Expected one POM file in $packageDirectory, found $($pomFiles.Count)."
                  }
                  $pomFile = $pomFiles[0]
                  [xml]$pom = Get-Content -Path $pomFile.FullName
                  $version = $pom.project.version
                  $jarPath = "$packageDirectory\apiview-java-processor-$version.jar"
                  $sourcesPath = "$packageDirectory\apiview-java-processor-$version-sources.jar"
                  $javadocPath = "$packageDirectory\apiview-java-processor-$version-javadoc.jar"

                  foreach ($artifactPath in @($jarPath, $sourcesPath, $javadocPath)) {
                    if (-not (Test-Path -Path $artifactPath -PathType Leaf)) {
                      throw "Expected package artifact was not downloaded: $artifactPath"
                    }
                  }

                  $packageUrl = "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-java/maven/v1/com/azure/apiview-java-processor/$version/apiview-java-processor-$version.pom"
                  $headers = @{ Authorization = "BEARER $env:SYSTEM_ACCESSTOKEN" }
                  $response = Invoke-WebRequest -Method Get -Uri $packageUrl -Headers $headers -SkipHttpErrorCheck

                  if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                    throw "com.azure:apiview-java-processor:$version already exists in the Java dev feed."
                  }
                  if ($response.StatusCode -ne 404) {
                    throw "Unable to check the Java dev feed. HTTP status: $($response.StatusCode)"
                  }

                  Write-Host "##vso[task.setvariable variable=PackageVersion]$version"
                  Write-Host "##vso[task.setvariable variable=PackageJarPath]$jarPath"
                  Write-Host "##vso[task.setvariable variable=PackagePomPath]$($pomFile.FullName)"
                  Write-Host "##vso[task.setvariable variable=PackageSourcesPath]$sourcesPath"
                  Write-Host "##vso[task.setvariable variable=PackageJavadocPath]$javadocPath"
                displayName: Validate package version
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)

              - task: EsrpCodeSigning@6
                displayName: Sign and verify JAR via ESRP
                inputs:
                  ConnectedServiceName: Azure SDK PME Managed Identity
                  UseMSIAuthentication: true
                  AppRegistrationClientId: 4fa2001b-ad7a-4a1e-9185-d6ea881f8712
                  AppRegistrationTenantId: 975f013f-7f24-47e8-a7d3-abc4752bf346
                  EsrpClientId: 5e796b8d-3c4d-4e28-93f6-12a44f4368a0
                  AuthAKVName: kv-azuresdk-codesign
                  AuthSignCertName: azure-sdk-esrp-signing-certificate
                  FolderPath: $(Pipeline.Workspace)/apiview-java-processor
                  Pattern: '*.jar'
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "KeyCode": "CP-447347-Java",
                        "OperationCode": "JavaSign",
                        "Parameters": {
                          "SigAlg": "SHA256withRSA",
                          "Timestamp": "-tsa http://sha256timestamp.ws.digicert.com/sha256/timestamp"
                        },
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      },
                      {
                        "KeyCode": "CP-447347-Java",
                        "OperationCode": "JavaVerify",
                        "Parameters": {},
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      }
                    ]

              - template: tools/gpg/gpg.yml@azure-sdk-build-tools

              - task: Maven@4
                displayName: GPG sign and publish package
                inputs:
                  mavenPomFile: src/java/apiview-java-processor/pom.xml
                  goals: org.apache.maven.plugins:maven-gpg-plugin:3.2.8:sign-and-deploy-file
                  options: >-
                    --batch-mode
                    --no-transfer-progress
                    -DrepositoryId=azure-sdk-for-java
                    -Durl=https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-java/maven/v1
                    -DgroupId=com.azure
                    -DartifactId=apiview-java-processor
                    -Dversion=$(PackageVersion)
                    -Dpackaging=jar
                    -Dfile="$(PackageJarPath)"
                    -DpomFile="$(PackagePomPath)"
                    -Dsources="$(PackageSourcesPath)"
                    -Djavadoc="$(PackageJavadocPath)"
                    -Dgpg.executable="$(Pipeline.Workspace)/azure-sdk-build-tools/tools/gpg/bin/gpg.exe"
                    -DgeneratePom=false
                  javaHomeOption: JDKVersion
                  jdkVersionOption: '1.8'
                  jdkArchitectureOption: x64
                  publishJUnitResults: false

              - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
                parameters:
                  ArtifactName: apiview-java-processor-signed
                  ArtifactPath: $(Pipeline.Workspace)/apiview-java-processor
                  CustomCondition: succeeded()
