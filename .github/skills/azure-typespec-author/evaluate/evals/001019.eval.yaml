# Source discussion 105086: typespec_2026_06_26.md
# Expected fixture overlays are reference-only and are never mounted in a trial.

name: azure-typespec-author-eval
description: Version client-model accessibility without versioning the decorator. Source discussion
  case 105086; ready.
version: "1.0"
type: capability
area: versioning
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 001019-version-client-model-access-trigger
    tags:
      suite: versioning
      mode: trigger
    prompt: >-
      EmployeeClientDetails was internal in the stable SDK but becomes public in preview. Version
      the decorated client model instead of trying to version access directly.

      Keep the stable public model name EmployeeClientDetails using an internal
      EmployeeClientDetailsBeforePreview declaration renamed for the old projection, and a public
      EmployeeClientDetails declaration added in preview. Preserve the value property. Check version
      and TCGC metadata; do not claim constructor visibility or language-SDK generation was
      verified.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: &a1
      files:
        - src: ../fixtures/001019-version-client-model-access/input/main.tsp
          dest: main.tsp
        - src: ../fixtures/discussion-widget/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/001019-version-client-model-access/input/client.tsp
          dest: client.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.cjs
          dest: check-node-dependencies.cjs
        - src: ../scripts/check-discussion-case.mjs
          dest: check-discussion-case.mjs
        - src: ../fixtures/001019-version-client-model-access/contract.json
          dest: discussion-contract.json
      commands:
        - node -e "const fs=require('fs');const
          t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    rubric: &a2
      - The edited files define a complete widget project when overlaid on the unchanged widget
        baseline.
      - The target implements the requested version delta rather than accidentally changing unrelated
        historical API contracts.
      - Compile the target and inspect both stable and preview OpenAPI projections using the pinned
        toolchain.
      - EmployeeClientDetails was internal in the stable SDK but becomes public in preview. Version the
        decorated client model instead of trying to version access directly. The target adapts the
        source answer to Microsoft.Widget and its Employee resource.
      - Compilation validates decorator applicability and versioning. Visibility in each language SDK
        still needs client-generator assertions, not Swagger-only certification.
      - Do not claim unexecuted SDK, external lint, or ARM review validation.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - &a3
        type: run-command
        name: fixture-dependencies
        config:
          command: node check-node-dependencies.cjs packages
          expected_exit_code: 0
      - &a4
        type: run-command
        name: compile-typespec
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &a5
        type: run-command
        name: fresh-compiled-contract
        config:
          command: node check-discussion-case.mjs
          expected_exit_code: 0
      - &a6
        type: prompt
        name: semantic-answer-and-limitations
        config:
          prompt: >-
            Evaluate the completed task against the stimulus rubric. Accept semantically equivalent
            valid TypeSpec, not just matching text or comments. Require the actual requested
            wire/version/client-metadata behavior, preservation of unrelated contracts, and the
            scenario's stated qualifications. Reject unsupported claims that compiling TypeSpec or
            AutoRest proves generated SDK behavior, external LintDiff success, or management-plane
            approval.


            Scenario-specific expectations:

            - The edited files define a complete widget project when overlaid on the unchanged
            widget baseline.

            - The target implements the requested version delta rather than accidentally changing
            unrelated historical API contracts.

            - Compile the target and inspect both stable and preview OpenAPI projections using the
            pinned toolchain.

            - EmployeeClientDetails was internal in the stable SDK but becomes public in preview.
            Version the decorated client model instead of trying to version access directly. The
            target adapts the source answer to Microsoft.Widget and its Employee resource.

            - Compilation validates decorator applicability and versioning. Visibility in each
            language SDK still needs client-generator assertions, not Swagger-only certification.

            - Do not claim unexecuted SDK, external lint, or ARM review validation.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.8
    constraints:
      max_turns: 14
      max_tokens: 100000
  - name: 001019-version-client-model-access-forced
    tags:
      suite: versioning
      mode: forced
    prompt: >-
      @azure-typespec-author EmployeeClientDetails was internal in the stable SDK but becomes public
