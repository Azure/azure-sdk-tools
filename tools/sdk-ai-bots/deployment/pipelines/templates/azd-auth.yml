# Pipeline template — Azure auth for both `az` and `azd`.
#
# Installs azd and its required extensions, then uses AzureCLI@2 service
# connection metadata to establish azd's Azure Pipelines federated login.
#
# AZURE_SERVICE_CONNECTION is statically defined by service-connection.yml and
# expanded as a task-input macro before the task starts.

steps:
    - bash: |
          set -euo pipefail
          PROJECT="$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/azure.yaml"
          TOOLING="$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/deployment/scripts"
          bash "$TOOLING/install-pipeline-azd.sh" "$PROJECT" "$AZD_INSTALL_DIRECTORY"
          export PATH="$AZD_INSTALL_DIRECTORY:$PATH"
          echo "##vso[task.setvariable variable=AZD_CONFIG_DIR]$AZD_CONFIG_DIR"
          bash "$TOOLING/install-azd-extensions.sh" "$PROJECT"
      displayName: 'Install pinned azd and extensions'
      env:
          AZD_INSTALL_DIRECTORY: $(Agent.TempDirectory)/sdk-ai-bots-azd-bin
          AZD_CONFIG_DIR: $(Agent.TempDirectory)/sdk-ai-bots-azd-profile

    - task: AzureCLI@2
      displayName: 'azd / az auth (federated)'
      inputs:
          azureSubscription: $(AZURE_SERVICE_CONNECTION)
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              set -euo pipefail
              azd auth login --client-id "$servicePrincipalId" --tenant-id "$tenantId" --federated-credential-provider azure-pipelines --no-prompt
              AZD_AUTH_STATUS=$(azd auth login --check-status --output json)
              echo "$AZD_AUTH_STATUS"
              jq -e '.status == "success"' <<< "$AZD_AUTH_STATUS" >/dev/null || {
                  echo "##[error]azd federated authentication did not succeed."
                  exit 1
              }

              ARM_TOKEN=$(az account get-access-token \
                --resource https://management.azure.com/ \
                --query accessToken \
                --output tsv)
              DEPLOYMENT_PRINCIPAL_ID=$(jq -Rr 'split(".")[1] | @base64d | fromjson | .oid' <<< "$ARM_TOKEN")
              if [ -z "$DEPLOYMENT_PRINCIPAL_ID" ] || [ "$DEPLOYMENT_PRINCIPAL_ID" = "null" ]; then
                  echo "##[error]ARM access token has no deployment-principal oid claim."
                  exit 1
              fi

              echo "##vso[task.setvariable variable=AZURE_CLIENT_ID]$servicePrincipalId"
              echo "##vso[task.setvariable variable=AZURE_TENANT_ID]$tenantId"
              echo "##vso[task.setvariable variable=AZURE_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"
              echo "##vso[task.setvariable variable=DEPLOYMENT_PRINCIPAL_ID]$DEPLOYMENT_PRINCIPAL_ID"
              echo "##vso[task.setvariable variable=DEPLOYMENT_PRINCIPAL_TYPE]ServicePrincipal"
              echo "$idToken" > "$(Agent.BuildDirectory)/id_token"
              echo "##vso[task.setvariable variable=AZURE_FEDERATED_TOKEN_FILE]$(Agent.BuildDirectory)/id_token"
      env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
