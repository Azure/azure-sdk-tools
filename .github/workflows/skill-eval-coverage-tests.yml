name: Skill Eval coverage script tests

on:
  pull_request:
    paths:
      - "eng/common/scripts/skill-eval-coverage/**"
      - ".github/skill-eval-coverage.json"
      - ".github/workflows/skill-eval*.yml"
  push:
    branches: [main]
    paths:
      - "eng/common/scripts/skill-eval-coverage/**"
      - ".github/skill-eval-coverage.json"
      - ".github/workflows/skill-eval*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test coverage checker and comment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install coverage checker dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/skill-coverage-pnpm" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pnpm@12.6.0
          node "$RUNNER_TEMP/skill-coverage-pnpm/node_modules/pnpm/bin/pnpm.mjs" --dir eng/common/scripts/skill-eval-coverage --ignore-workspace install --pm-on-fail=ignore --frozen-lockfile --prod --ignore-scripts

      - name: Test scripts
        run: node --test eng/common/scripts/skill-eval-coverage/test/*.test.ts
