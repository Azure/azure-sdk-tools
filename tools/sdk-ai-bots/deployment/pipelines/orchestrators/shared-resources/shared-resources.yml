# Provisions the resource group and shared-resources layers together.
name: tools - sdk-ai-bots-shared-resources - provision

trigger: none
pr: none

parameters:
    - name: environment
      type: string
      default: dev
      values: [dev, preview, prod]

variables:
    - template: /eng/pipelines/templates/variables/globals.yml
    - template: /eng/pipelines/templates/variables/image.yml
    - template: /tools/sdk-ai-bots/deployment/pipelines/templates/service-connection.yml
      parameters:
          environment: ${{ parameters.environment }}

extends:
    template: /eng/pipelines/templates/stages/1es-redirect.yml
    parameters:
        Use1ESOfficial: true
        stages:
            - template: /tools/sdk-ai-bots/deployment/pipelines/templates/layer-provision-stage.yml
              parameters:
                  layer: shared-resources
                  dependencyLayers: resource-group
                  provisionResourceGroup: true
                  environment: ${{ parameters.environment }}
                  operation: preview
                  stageName: PreflightLayer
            - template: /tools/sdk-ai-bots/deployment/pipelines/templates/approval-stage.yml
              parameters:
                  environment: ${{ parameters.environment }}
                  stageName: ApproveLayer
                  dependsOn: PreflightLayer
                  scope: resource-group and shared-resources layers
            - template: /tools/sdk-ai-bots/deployment/pipelines/templates/layer-provision-stage.yml
              parameters:
                  layer: shared-resources
                  dependencyLayers: resource-group
                  provisionResourceGroup: true
                  environment: ${{ parameters.environment }}
                  operation: apply
                  stageName: ProvisionLayer
                  dependsOn: ApproveLayer
