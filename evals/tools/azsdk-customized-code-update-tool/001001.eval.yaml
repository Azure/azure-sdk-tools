      editScope: CustomCode
    prompt: |
      First, use the shell to resolve
      azure-sdk-for-java/sdk/widget/azure-resourcemanager-widget against your current working
      directory and obtain its absolute directory path.
      Then call azsdk_customized_code_update with parameters:
