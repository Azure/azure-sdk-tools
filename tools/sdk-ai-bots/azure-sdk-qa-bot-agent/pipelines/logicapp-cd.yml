# Deployment pipeline for the Azure SDK QA Bot Logic Apps.
# Deploys a Logic App ARM template with environment-specific parameters.
#
# The teams-collection workflow reads the backend server's identity from
# $(APP_NAME), because backfill runs there rather than in a hosted agent.
# Dev/test use the shared Azure SDK listener; production uses the selected team.

name: Deploy Azure SDK QA Bot Logic App

trigger: none
pr: none

parameters:
  - name: workflow
    displayName: 'Logic App Workflow'
    type: string
    default: chat
    values:
      - chat
      - teams-collection
  - name: team
    displayName: 'Production Teams Team (dev/test use azure_sdk)'
    type: string
    default: azure_sdk
    values:
      - azure_sdk
      - azure_mcp_server
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: dev
    values:
      - dev
      - test
      - prod

variables:
  - template: /eng/pipelines/templates/variables/globals.yml
  - template: /eng/pipelines/templates/variables/image.yml
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: 'Azure SDK QA Bot Dev Variables'
  - ${{ if eq(parameters.environment, 'test') }}:
    - group: 'Azure SDK QA Bot Preview Variables'
  - ${{ if eq(parameters.environment, 'prod') }}:
    - group: 'Azure SDK QA Bot Prod Variables'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-agent'
  - name: PythonIndexUrl
    value: 'https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/simple/'
  - name: listenerTeam
    value: ${{ iif(eq(parameters.environment, 'prod'), parameters.team, 'azure_sdk') }}

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    Use1ESOfficial: true
    stages:
      - stage: DeployLogicApp
        ${{ if eq(parameters.workflow, 'chat') }}:
          displayName: 'Deploy ${{ variables.listenerTeam }} Logic App (${{ parameters.environment }})'
        ${{ else }}:
          displayName: 'Deploy Teams Collection Logic App (${{ parameters.environment }})'
        jobs:
          - job: Deploy
            displayName: 'ARM Template Deployment'
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            steps:
              - checkout: self
                displayName: 'Checkout repository'

              - ${{ if eq(parameters.workflow, 'chat') }}:
                - task: AzureCLI@2
                  displayName: 'Deploy Logic App'
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(workingDirectory)
                    inlineScript: |
                      set -euo pipefail

                      TEMPLATE_FILE="pipelines/logicapp/template.json"
                      PARAMS_FILE="pipelines/logicapp/parameters.${{ variables.listenerTeam }}.${{ parameters.environment }}.json"

                      echo "Listener team: ${{ variables.listenerTeam }} (selected: ${{ parameters.team }})"
                      echo "Deploying Logic App to resource group: $(RESOURCE_GROUP)"
                      echo "Template: $TEMPLATE_FILE"
                      echo "Parameters: $PARAMS_FILE"

                      az deployment group create \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --template-file "$TEMPLATE_FILE" \
                        --parameters "@$PARAMS_FILE" \
                        --name "logicapp-${{ variables.listenerTeam }}-$(Build.BuildId)" \
                        --verbose

                      echo "Logic App deployment completed successfully."

              - ${{ if eq(parameters.workflow, 'teams-collection') }}:
                - task: PipAuthenticate@1
                  displayName: 'Authenticate pip to Azure Artifacts'
                  inputs:
                    artifactFeeds: 'public/azure-sdk-for-python'

                - task: AzureCLI@2
                  displayName: 'Deploy Teams Collection Logic App'
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(workingDirectory)
                    inlineScript: |
                      set -euo pipefail

                      if [ "${{ parameters.team }}" != "azure_sdk" ]; then
                        echo "The teams-collection workflow is only defined for azure_sdk."
                        exit 1
                      fi

                      # Suppress Azure CLI welcome banner on fresh CI agents.
                      export AZURE_CORE_WELCOME_MESSAGE=false
                      az version > /dev/null 2>&1 || true
                      az config set core.welcome_message=false 2>/dev/null || true

                      python -m pip install --upgrade pip
                      python -m pip install keyring artifacts-keyring --retries 5 --timeout 60
                      python -m pip config set global.index-url "$PIP_INDEX_URL"
                      pip install -r requirements.txt --retries 5 --timeout 60

                      # Backfill runs on the backend server, so the Logic App
                      # admits that App Service identity and nothing else.
                      CLIENT_ID=$(az webapp config appsettings list \
                        --name "$(APP_NAME)" --resource-group "$(RESOURCE_GROUP)" \
                        --query "[?name=='AZURE_CLIENT_ID'].value | [0]" -o tsv)
                      if [ -n "$CLIENT_ID" ]; then
                        BACKFILL_PRINCIPAL_ID=$(az webapp identity show \
                          --name "$(APP_NAME)" --resource-group "$(RESOURCE_GROUP)" \
                          --query "values(userAssignedIdentities)[?clientId=='$CLIENT_ID'].principalId | [0]" \
                          -o tsv)
                      else
                        BACKFILL_PRINCIPAL_ID=$(az webapp identity show \
                          --name "$(APP_NAME)" --resource-group "$(RESOURCE_GROUP)" \
                          --query principalId -o tsv)
                      fi
                      if [ -z "$BACKFILL_PRINCIPAL_ID" ]; then
                        echo "Could not resolve the backend server identity for $(APP_NAME)."
                        exit 1
                      fi

                      # Deploys the backfill workflow for the backend server identity.
                      python scripts/deploy_hosted_agent.py teams-collection deploy \
                        --environment "${{ parameters.environment }}" \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --appconfig-endpoint "$(AZURE_APPCONFIG_ENDPOINT)" \
                        --backfill-principal-id "$BACKFILL_PRINCIPAL_ID"
                  env:
                    AZURE_CORE_WELCOME_MESSAGE: 'false'
                    AZURE_APPCONFIG_ENDPOINT: $(AZURE_APPCONFIG_ENDPOINT)
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
