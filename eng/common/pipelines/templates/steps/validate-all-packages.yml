# Compatibility wrapper: migrate callers to update-package-work-items.yml.
# Keep this template until downstream language pipelines have migrated.
parameters:
  - name: ArtifactPath
    type: string
    default: $(Build.ArtifactStagingDirectory)
  - name: Artifacts
    type: object
    default: []
  - name: ConfigFileDir
    type: string
    default: $(Build.ArtifactStagingDirectory)/PackageInfo
  - name: PackageInfoFiles
    type: object
    default: []

steps:
  - template: update-package-work-items.yml
    parameters:
      ArtifactPath: ${{ parameters.ArtifactPath }}
      Artifacts: ${{ parameters.Artifacts }}
      ConfigFileDir: ${{ parameters.ConfigFileDir }}
      PackageInfoFiles: ${{ parameters.PackageInfoFiles }}
