      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: *a1
    rubric: *a2
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - *a3
      - *a4
      - *a5
      - *a6
    constraints:
      max_turns: 14
      max_tokens: 100000
  - name: 002012-ARM-legacy-custom-resource-no-skill
    tags:
      suite: armtemplate
      mode: no-skill
    prompt: >-
      Employee is a legacy resource whose JSON contains only optional someId and someOtherProperty,
      with no standard id/name/type envelope. The input applies Legacy.customAzureResource directly
      and cannot use the standard read/list templates without a resource key. Use
      Legacy.CustomAzureResource and add ResourceNameParameter<Employee> for routing only. Do not
      make the legacy JSON fields required or add a name field to the emitted payload.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: *a1
    rubric: *a2
    graders:
      - *a3
      - *a4
      - *a5
      - *a6
    constraints:
      max_turns: 14
      max_tokens: 100000
scoring:
  weights:
    run-command: 0.85
    prompt: 0.1
    skill-invocation: 0.05
  threshold: 0.97
