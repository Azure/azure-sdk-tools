# One user-approved cleanup of synthetic smoke build 6865368 only. No evaluations.
trigger: none
pr: none

parameters:
  - name: removeSyntheticSmokeArchive
    type: boolean
    default: false

variables:
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    ${{ if and(parameters.removeSyntheticSmokeArchive, eq(variables['System.CollectionUri'], 'https://dev.azure.com/azure-sdk/'), eq(variables['System.TeamProject'], 'internal'), eq(variables['System.DefinitionId'], '8424'), eq(variables['Build.Repository.Name'], 'Azure/azure-sdk-tools'), eq(variables['Build.SourceBranch'], 'refs/heads/test/eval-cli-linux-probe'), eq(variables['Build.Reason'], 'Manual')) }}:
      AllowAzureStorage: true
    stages:
      - ${{ if and(parameters.removeSyntheticSmokeArchive, eq(variables['System.CollectionUri'], 'https://dev.azure.com/azure-sdk/'), eq(variables['System.TeamProject'], 'internal'), eq(variables['System.DefinitionId'], '8424'), eq(variables['Build.Repository.Name'], 'Azure/azure-sdk-tools'), eq(variables['Build.SourceBranch'], 'refs/heads/test/eval-cli-linux-probe'), eq(variables['Build.Reason'], 'Manual')) }}:
        - stage: RemoveSyntheticSmoke
          jobs:
            - job: RemoveExactArchive
              timeoutInMinutes: 15
              pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
              workspace:
                clean: all
              steps:
                - checkout: self
                  clean: true
                  fetchDepth: 1
                - task: AzureCLI@2
                  displayName: Verify and remove only synthetic smoke archive 6865368
                  condition: and(succeeded(), eq(variables['System.DefinitionId'], '8424'), eq(variables['Build.SourceBranch'], 'refs/heads/test/eval-cli-linux-probe'), eq(variables['Build.Reason'], 'Manual'))
                  inputs:
                    azureSubscription: eval-dashboard-sc
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: eng/scripts/Remove-EvalSmokeArchive.ps1
      - ${{ else }}:
        - stage: NoCleanup
          jobs:
            - job: Explain
              pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
              steps:
                - checkout: none
                - pwsh: throw 'Smoke cleanup requires explicit manual opt-in on its exact internal test branch.'
