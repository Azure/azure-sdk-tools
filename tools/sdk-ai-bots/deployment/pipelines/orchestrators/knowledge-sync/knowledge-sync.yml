# Synchronizes knowledge and refreshes Search. Infrastructure provisioning is
# an explicit opt-in for manual runs; scheduled and restoration runs are data-only.
name: tools - sdk-ai-bots-knowledge-sync - provision-and-sync

trigger: none
pr: none

schedules:
    - cron: '0 2 * * *'
      displayName: Daily knowledge sync (02:00 UTC)
      branches:
          include: [main]
      always: true

parameters:
    - name: environment
      type: string
      default: prod
      values: [dev, preview, prod]
    - name: provisionInfrastructure
      displayName: 'Provision infrastructure before syncing'
      type: boolean
      default: false

variables:
    - template: /eng/pipelines/templates/variables/globals.yml
    - template: /eng/pipelines/templates/variables/image.yml
    - template: /tools/sdk-ai-bots/deployment/pipelines/templates/service-connection.yml@self
      parameters:
          environment: ${{ parameters.environment }}
    - name: workingDirectory
      value: '$(Agent.BuildDirectory)/s/azure-sdk-tools/tools/sdk-ai-bots/azure-sdk-qa-bot-knowledge-sync'

resources:
    repositories:
        - repository: 1ESPipelineTemplates
          type: git
          name: 1ESPipelineTemplates/1ESPipelineTemplates
          ref: refs/tags/release
        - repository: azure-sdk-docs-eng.ms
          type: git
          name: internal/azure-sdk-docs-eng.ms
          ref: main
        - repository: internal-wiki
          type: git
          name: internal/internal.wiki
          ref: wikiMaster

extends:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
    parameters:
        settings:
            skipBuildTagsForGitHubPullRequests: true
            networkIsolationPolicy: Permissive
        stages:
            - ${{ if eq(parameters.provisionInfrastructure, true) }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-with-approval.yml@self
                    parameters:
                        environment: ${{ parameters.environment }}
            - stage: SyncKnowledge
              displayName: 'Sync knowledge'
              ${{ if eq(parameters.provisionInfrastructure, true) }}:
                  dependsOn: Provision
              jobs:
                  - job: Sync
                    timeoutInMinutes: 120
                    pool:
                        name: $(LINUXPOOL)
                        image: $(LINUXVMIMAGE)
                        os: linux
                    steps:
                        - checkout: self
                        - checkout: azure-sdk-docs-eng.ms
                        - checkout: internal-wiki
                        - template: /tools/sdk-ai-bots/deployment/pipelines/templates/load-environment-suite.yml@self
                          parameters:
                              environment: '${{ parameters.environment }}'
                              suitePath: '$(Agent.BuildDirectory)/s/azure-sdk-tools/tools/sdk-ai-bots/deployment/infra/environments/environment-suite.yaml'
                        - task: NodeTool@0
                          inputs: { versionSpec: '24.x' }
                        - script: npm ci
                          workingDirectory: $(workingDirectory)
                        - task: AzureCLI@2
                          displayName: 'Run knowledge sync'
                          inputs:
                              azureSubscription: $(AZURE_SERVICE_CONNECTION)
                              addSpnToEnvironment: true
                              scriptType: bash
                              scriptLocation: inlineScript
                              workingDirectory: $(workingDirectory)
                              inlineScript: |
                                  set -euo pipefail
                                  token_file="$(Agent.TempDirectory)/knowledge-sync-id-token"
                                  printf '%s' "$idToken" > "$token_file"
                                  export AZURE_CLIENT_ID="$servicePrincipalId"
                                  export AZURE_TENANT_ID="$tenantId"
                                  export AZURE_FEDERATED_TOKEN_FILE="$token_file"
                                  npm start
                          env:
                              AZURE_APPCONFIG_ENDPOINT: $(AZURE_APPCONFIG_ENDPOINT)
                              AZURE_SDK_DOCS_PATH: $(Agent.BuildDirectory)/s/azure-sdk-docs-eng.ms
                              AZURE_SDK_WIKI_PATH: $(Agent.BuildDirectory)/s/internal.wiki
                              HOME: $(Agent.HomeDirectory)
                              TMPDIR: $(Agent.TempDirectory)
                        - task: AzureCLI@2
                          displayName: 'Run knowledge Search indexer'
                          inputs:
                              azureSubscription: $(AZURE_SERVICE_CONNECTION)
                              scriptType: bash
                              scriptLocation: inlineScript
                              inlineScript: |
                                  set -euo pipefail
                                  bash "$(Agent.BuildDirectory)/s/azure-sdk-tools/tools/sdk-ai-bots/deployment/scripts/run-search-indexer.sh" AI_SEARCH_INDEXER
                          env:
                              APP_CONFIG_NAME: $(APP_CONFIG_NAME)
