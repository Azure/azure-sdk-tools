<!-- The eng/pipelines/pipeline-fix-eval.yml pipeline deploys this dashboard unchanged alongside its generated dashboard-data.js file. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azure SDK Pipeline Analysis Dashboard</title>
      <style>
:root {
  --ink: #17242e;
  --muted: #5d6b76;
  --accent: #1267a8;
  --accent-dark: #0b4169;
  --success: #18864b;
  --danger: #c4314b;
  --surface: #fff;
  --canvas: #f4f6f8;
  --line: #d8e0e6;
  --line-strong: #b8c4ce;
  --radius: 6px;
  --shadow: 0 1px 2px rgba(23, 36, 46, 0.06);
  --font: "Segoe UI Variable", "Segoe UI", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

[hidden] {
  display: none !important;
}

body,
button,
select {
  font-family: var(--font);
}

body {
  min-width: 320px;
  background: var(--canvas);
  color: var(--ink);
}

button,
select {
  font-size: inherit;
}

a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

:where(button, select, summary, a):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app-header {
  min-height: 54px;
  padding: 0 max(24px, calc((100vw - 1320px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: #112a3b;
  border-bottom: 3px solid var(--success);
  color: #fff;
}

.brand,
.header-right,
.page-intro,
.toolbar,
.filters,
.freshness,
.section-heading,
.result-count {
  display: flex;
  align-items: center;
}

.brand {
  gap: 10px;
}

.brand-mark {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #42b97b;
}

.brand h1 {
  font-size: 1rem;
  font-weight: 650;
}

.header-right {
  gap: 12px;
  color: #d5e0e7;
  font-size: 0.78rem;
}

.data-source {
  padding-right: 12px;
  border-right: 1px solid rgba(255, 255, 255, 0.22);
}

main,
footer {
  width: min(calc(100% - 48px), 1320px);
  margin-inline: auto;
}

main {
  padding-block: 26px 48px;
}

.banner {
  margin-bottom: 16px;
  padding: 10px 12px;
  border: 1px solid var(--danger);
  border-radius: var(--radius);
  background: #fbe9ed;
  color: var(--danger);
  font-size: 0.82rem;
}

.page-intro {
  justify-content: space-between;
  gap: 32px;
  margin-bottom: 20px;
}

.metric-context {
  max-width: 720px;
}

.eyebrow,
.control-label {
  display: block;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.metric-context h2 {
  margin-top: 4px;
  font-size: clamp(1.45rem, 2.5vw, 1.9rem);
  line-height: 1.2;
}

.metric-context p {
  margin-top: 6px;
  color: var(--muted);
  font-size: 0.84rem;
  line-height: 1.45;
}

.freshness {
  flex: 0 0 auto;
  gap: 7px;
  color: var(--muted);
  font-size: 0.72rem;
}

.freshness time {
  color: var(--ink);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
}

.toolbar {
  min-height: 58px;
  justify-content: flex-end;
  gap: 24px;
  margin-bottom: 16px;
  padding: 8px 12px 8px 0;
  border-block: 1px solid var(--line);
}

.filters {
  gap: 10px;
}

.control {
  display: grid;
  gap: 3px;
}

.control select {
  width: clamp(150px, 16vw, 210px);
  height: 34px;
  padding: 0 30px 0 9px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
  font-size: 0.8rem;
}

:where(.evaluation-panel, .table-wrap) {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.evaluation-panel {
  padding: 18px;
}

.evaluation-panel .section-heading {
  margin-bottom: 18px;
}

.evaluation-panel h2 {
  margin-top: 3px;
  font-size: 1.05rem;
}

.evaluation {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 18px;
}

.evaluation-stage {
  width: 100%;
  min-width: 0;
  padding: 8px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.evaluation-stage:hover,
.evaluation-stage.selected {
  border-color: var(--line-strong);
  background: #f7f9fa;
}

.evaluation-label,
.evaluation-rate {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.evaluation-label {
  min-height: 38px;
  align-items: flex-end;
  color: var(--ink);
  font-size: 0.76rem;
  font-weight: 650;
}

.evaluation-label strong {
  font-size: 1.3rem;
  font-variant-numeric: tabular-nums;
}

.evaluation-track {
  height: 22px;
  margin-block: 8px;
  overflow: hidden;
  background: #e8edf0;
}

.evaluation-fill {
  min-width: 4px;
  height: 100%;
}

.evaluation-rate {
  color: var(--muted);
  font-size: 0.64rem;
  line-height: 1.3;
}

.evaluation-rate span {
  color: var(--accent-dark);
}

.loading-note,
.empty-state {
  padding: 48px 20px;
  color: var(--muted);
  text-align: center;
}

.table-wrap {
  margin-top: 16px;
  padding: 18px;
}

.section-heading {
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 14px;
}

.section-heading h2 {
  margin-top: 3px;
  font-size: 1.1rem;
}

.result-count {
  gap: 4px;
  color: var(--muted);
  font-size: 0.75rem;
}

.table-scroll {
  max-height: 68vh;
  overflow: auto;
  border-top: 1px solid var(--line);
}

#runs-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

#runs-table th,
#runs-table td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

#runs-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #f7f9fa;
  color: var(--muted);
  font-size: 0.67rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}

#runs-table tbody tr:hover {
  background: #f3f7fa;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  color: #fff;
  font-size: 0.68rem;
  font-weight: 650;
  white-space: nowrap;
}

.table-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 9px;
}

.table-note {
  color: var(--muted);
  font-size: 0.75rem;
}

.table-pagination {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 0.75rem;
}

.table-pagination[hidden] {
  display: none;
}

.table-pagination button {
  padding: 5px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--surface);
  color: var(--accent-dark);
  cursor: pointer;
}

.table-pagination button:hover:not(:disabled) {
  background: #eef4f8;
}

.table-pagination button:disabled {
  color: var(--muted);
  cursor: not-allowed;
  opacity: 0.55;
}

footer {
  padding: 18px 0 32px;
  display: flex;
  gap: 8px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.75rem;
}

.sep {
  color: var(--line-strong);
}

@media (max-width: 760px) {
  .app-header {
    padding-inline: 16px;
  }

  .data-source {
    display: none;
  }

  main,
  footer {
    width: min(calc(100% - 28px), 1320px);
  }

  main {
    padding-block: 20px 36px;
  }

  .page-intro {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
    gap: 8px;
    padding: 0 0 10px;
  }

  .filters,
  .control,
  .control select {
    width: 100%;
  }

  .control select {
    min-width: 0;
  }

  .evaluation {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .evaluation-label {
    min-height: 0;
  }

  .table-wrap {
    padding: 12px;
  }

  .table-footer {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (max-width: 420px) {
  .filters {
    flex-direction: column;
  }
}

  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Pipeline Analysis</h1>
      </div>
      <div class="header-right">
        <span class="data-source">Data Source: blob</span>
      </div>
    </header>

    <main>
      <div id="error-banner" class="banner error-banner" hidden></div>

      <section class="page-intro">
        <div class="metric-context">
          <span class="eyebrow">Evaluation metric</span>
          <h2 id="metric-name">Pipeline fix</h2>
          <p id="metric-description"></p>
        </div>
        <div class="freshness">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Latest data</span>
          <time id="latest-data-at">&mdash;</time>
        </div>
      </section>

      <div class="toolbar">
        <div class="filters" aria-label="Dashboard filters">
          <label class="control">
            <span class="control-label">Repository</span>
            <select id="repo-filter">
              <option value="">All repositories</option>
            </select>
          </label>

          <label class="control">
            <span class="control-label">Time range</span>
            <select id="days-filter">
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="90">Last 90 days</option>
              <option value="365">Last 365 days</option>
              <option value="">All time</option>
            </select>
          </label>

          <label id="stage-control" class="control">
            <span class="control-label">Stage</span>
            <select id="stage-filter">
              <option value="">All</option>
              <option value="merged">Merged PRs</option>
              <option value="workflow">Fix Workflow Runs</option>
              <option value="opened">Fix Branch Opened</option>
              <option value="adopted">Fix Adopted</option>
              <option value="success">Pipeline Success</option>
            </select>
          </label>
        </div>
      </div>

      <div id="overview-view">
        <section id="evaluation-panel" class="evaluation-panel" hidden>
          <div class="section-heading">
            <div>
              <span class="eyebrow">Workflow conversion</span>
              <h2>Pipeline fix evaluation</h2>
            </div>
          </div>
          <div
            id="evaluation"
            class="evaluation"
            aria-label="Pipeline fix evaluation"
          ></div>
        </section>

        <div id="loading-note" class="loading-note">Loading&hellip;</div>
        <div id="empty-state" class="empty-state" hidden>
          <p><strong>No merged pull requests in this period.</strong></p>
        </div>
        <section id="evaluations-view" class="table-wrap" hidden>
          <div class="section-heading">
            <div>
              <span class="eyebrow">Detailed results</span>
              <h2 id="details-heading">Evaluated pull requests</h2>
            </div>
            <span class="result-count">
              <strong id="result-count">0</strong> pull requests
            </span>
          </div>
          <div class="table-scroll">
            <table id="runs-table">
              <thead id="runs-thead"></thead>
              <tbody id="runs-tbody"></tbody>
            </table>
          </div>
          <div class="table-footer">
            <p class="table-note" id="table-note"></p>
            <nav
              class="table-pagination"
              id="table-pagination"
              aria-label="Evaluation results pages"
              hidden
            >
              <button id="table-page-previous" type="button">Previous</button>
              <span id="table-page-status" aria-live="polite"></span>
              <button id="table-page-next" type="button">Next</button>
            </nav>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <span>Pipeline Analysis Dashboard</span>
      <span class="sep">/</span>
      <a
        href="https://github.com/Azure/azure-sdk-tools/blob/main/eng/templates/pipeline-evaluation.template.html"
        target="_blank"
        rel="noopener"
        >Source</a
      >
    </footer>

      <script>
// core.js
(function (dashboard) {
  "use strict";

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function fillTemplate(template, context) {
    let complete = true;
    const value = String(template).replace(/\{(\w+)\}/g, (_, key) => {
      if (context[key] == null || context[key] === "") {
        complete = false;
        return "";
      }
      return String(context[key]);
    });
    return complete ? value : null;
  }

  Object.assign(dashboard, { esc, fillTemplate });
})(window.dashboard || (window.dashboard = {}));

;
// views.js
(function (dashboard) {
  "use strict";

  const TABLE_PAGE_SIZE = 50;
  const { esc, fillTemplate } = dashboard;
  const tableState = { columns: [], rows: [], page: 0 };

  function renderEvaluation(stages, selectedStage = "") {
    const element = document.getElementById("evaluation");
    if (!element) return;
    const first = stages[0]?.value || 0;
    element.innerHTML = stages
      .map((stage, index) => {
        const previous = index ? stages[index - 1].value : stage.value;
        const conversion = previous
          ? Math.round((stage.value / previous) * 1000) / 10
          : 0;
        const overall = first
          ? Math.round((stage.value / first) * 1000) / 10
          : 0;
        const width = first ? Math.max(4, (stage.value / first) * 100) : 4;
        return `<button type="button" class="evaluation-stage${selectedStage === stage.key ? " selected" : ""}" data-stage="${esc(stage.key)}" aria-pressed="${selectedStage === stage.key}">
          <div class="evaluation-label"><span>${esc(stage.label)}</span><strong>${esc(stage.value)}</strong></div>
          <div class="evaluation-track"><div class="evaluation-fill" style="width:${width}%;background:${esc(stage.color)}"></div></div>
          <div class="evaluation-rate">${index ? `${conversion}% from previous` : "Starting cohort"}<span>${overall}% overall</span></div>
        </button>`;
      })
      .join("");
  }

  function linkCell(column, run, value) {
    if (value == null || value === "") return "<td></td>";
    const context = { ...run, value };
    const text =
      fillTemplate(column.display || "{value}", context) ?? value ?? "";
    const url = column.urlTemplate && fillTemplate(column.urlTemplate, context);
    return url
      ? `<td><a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a></td>`
      : `<td>${esc(text)}</td>`;
  }

  function cell(column, run, value) {
    if (column.type === "link") return linkCell(column, run, value);
    return `<td>${esc(value ?? "")}</td>`;
  }

  function renderTablePage() {
    const body = document.getElementById("runs-tbody");
    const note = document.getElementById("table-note");
    const pagination = document.getElementById("table-pagination");
    const pageStatus = document.getElementById("table-page-status");
    const previous = document.getElementById("table-page-previous");
    const next = document.getElementById("table-page-next");
    if (!body || !note || !pagination || !pageStatus || !previous || !next)
      return;

    const total = tableState.rows.length;
    const pageCount = Math.max(1, Math.ceil(total / TABLE_PAGE_SIZE));
    tableState.page = Math.min(tableState.page, pageCount - 1);
    const start = tableState.page * TABLE_PAGE_SIZE;
    const rows = tableState.rows.slice(start, start + TABLE_PAGE_SIZE);
    body.innerHTML = rows
      .map(({ run, result }) => {
        const cells = tableState.columns
          .map((column) => cell(column, result, result[column.key]))
          .join("");
        return `<tr><td>${esc(run.date)}</td><td>${esc(run.repo)}</td>${cells}</tr>`;
      })
      .join("");

    const end = start + rows.length;
    note.textContent = total
      ? `Showing ${start + 1}-${end} of ${total} pull requests.`
      : "No pull requests.";
    pageStatus.textContent = `Page ${tableState.page + 1} of ${pageCount}`;
    previous.disabled = tableState.page === 0;
    next.disabled = tableState.page >= pageCount - 1;
    pagination.hidden = pageCount <= 1;
  }

  function renderTable(source, runs) {
    const head = document.getElementById("runs-thead");
    if (!head) return;
    tableState.columns = source.resultColumns;
    tableState.rows = runs.flatMap((run) =>
      run.results.map((result) => ({ run, result })),
    );
    tableState.page = 0;
    head.innerHTML = `<tr><th>Date</th><th>Repo</th>${tableState.columns
      .map((column) => `<th>${esc(column.label)}</th>`)
      .join("")}</tr>`;
    renderTablePage();
  }

  function clearTable() {
    tableState.rows = [];
    tableState.page = 0;
    const body = document.getElementById("runs-tbody");
    if (body) body.innerHTML = "";
  }

  function changeTablePage(offset) {
    const pageCount = Math.max(
      1,
      Math.ceil(tableState.rows.length / TABLE_PAGE_SIZE),
    );
    const nextPage = Math.min(
      pageCount - 1,
      Math.max(0, tableState.page + offset),
    );
    if (nextPage === tableState.page) return;
    tableState.page = nextPage;
    renderTablePage();
  }

  Object.assign(dashboard, {
    renderEvaluation,
    renderTable,
    clearTable,
    changeTablePage,
  });
})(window.dashboard);

// dashboard-data-loader.js
const MAX_DAYS = 3650;
const MS_PER_DAY = 24 * 60 * 60 * 1000;
const PIPELINE_SUCCESS = "CopilotPipelineFixSuccess";

const EVALUATION_STAGES = [
  { key: "merged", label: "Merged PRs", color: "#0078d4" },
  { key: "workflow", label: "Fix Workflow Runs", color: "#168aad" },
  { key: "opened", label: "Fix Branch Opened", color: "#52b69a" },
  { key: "adopted", label: "Fix Adopted", color: "#76c893" },
  { key: "success", label: "Pipeline Success", color: "#2d6a4f" },
];

const RESULT_COLUMNS = [
  {
    key: "pr_number",
    label: "PR",
    type: "link",
    urlTemplate: "https://github.com/{owner}/{repo}/pull/{value}",
    display: "#{value}",
  },
  { key: "pr_title", label: "Title", type: "text" },
  {
    key: "fix_workflow_run",
    label: "Workflow Run",
    type: "link",
    urlTemplate: "https://github.com/{owner}/{repo}/actions/runs/{value}",
    display: "{value}",
  },
  {
    key: "fix_branch_opened",
    label: "Fix Branch",
    type: "link",
    urlTemplate: "https://github.com/{owner}/{repo}/tree/{value}",
    display: "{value}",
  },
  {
    key: "fix_pr_merged",
    label: "Adopted Commit",
    type: "link",
    urlTemplate: "https://github.com/{owner}/{repo}/commit/{value}",
    display: "{value}",
  },
  {
    key: "pipeline_outcome",
    label: "Pipeline Outcome",
    type: "link",
    urlTemplate:
      "https://github.com/{owner}/{repo}/commit/{fix_pr_merged}/checks",
    display: "{value}",
  },
  { key: "verification", label: "Verification", type: "text" },
];

const SOURCE = {
  name: "Automated Pipeline-Fix Evaluation",
  description:
    "How merged pull requests progress through the automated fix workflow to a successful pipeline.",
  resultColumns: RESULT_COLUMNS,
};

function normalizeRow(row, report) {
  if (!Number.isInteger(row?.pr_number) || !row.verification) {
    return null;
  }
  return {
    owner: report.owner,
    repo: report.repo,
    pr_number: row.pr_number,
    pr_title: row.pr_title || "",
    fix_workflow_run: row.fix_workflow_run ?? null,
    fix_branch_opened: row.fix_branch_opened ?? null,
    fix_pr_merged: row.fix_pr_merged ?? null,
    pipeline_outcome: row.pipeline_outcome || "",
    verification: row.verification,
  };
}

function parseSnapshot(snapshot) {
  if (snapshot?.schemaVersion !== 1 || !Array.isArray(snapshot.reports)) {
    throw new Error("Unsupported dashboard data format.");
  }

  let skippedRows = 0;
  const runs = snapshot.reports.flatMap((report) => {
    if (!report?.owner || !report.repo || !Array.isArray(report.dates)) {
      throw new Error("Invalid repository report.");
    }
    return report.dates.map((dateReport) => {
      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(dateReport?.date) ||
        !Array.isArray(dateReport.evaluations)
      ) {
        throw new Error(
          `Invalid dated report for ${report.owner}/${report.repo}.`,
        );
      }
      const results = dateReport.evaluations.flatMap((row) => {
        const normalized = normalizeRow(row, report);
        if (normalized) return [normalized];
        skippedRows++;
        return [];
      });
      return {
        date: dateReport.date,
        timestamp: `${dateReport.date}T23:59:59.999Z`,
        owner: report.owner,
        repo: report.repo,
        results,
      };
    });
  });
  return { runs, skippedRows };
}

function withinDays(runs, days, now = Date.now()) {
  const cutoff = now - days * MS_PER_DAY;
  return runs.filter((run) => new Date(run.timestamp).getTime() >= cutoff);
}

function aggregateEvaluations(runs) {
  const rows = runs.flatMap((run) => run.results);
  const counts = {
    merged: rows.length,
    workflow: rows.filter((row) => row.fix_workflow_run != null).length,
    opened: rows.filter((row) => row.fix_branch_opened != null).length,
    adopted: rows.filter((row) => row.fix_pr_merged != null).length,
    success: rows.filter(
      (row) =>
        row.fix_pr_merged != null && row.pipeline_outcome === PIPELINE_SUCCESS,
    ).length,
  };
  return EVALUATION_STAGES.map((stage) => ({
    ...stage,
    value: counts[stage.key],
  }));
}

function reachedStage(row, stage) {
  switch (stage) {
    case "":
    case "merged":
      return true;
    case "workflow":
      return row.fix_workflow_run != null;
    case "opened":
      return row.fix_branch_opened != null;
    case "adopted":
      return row.fix_pr_merged != null;
    case "success":
      return (
        row.fix_pr_merged != null && row.pipeline_outcome === PIPELINE_SUCCESS
      );
    default:
      throw new Error(`Unknown evaluation stage: ${stage}.`);
  }
}

function filterRunsByStage(runs, stage) {
  if (!stage) return runs;
  return runs
    .map((run) => ({
      ...run,
      results: run.results.filter((row) => reachedStage(row, stage)),
    }))
    .filter((run) => run.results.length > 0);
}

function buildDashboardView(
  snapshot,
  { repo = "", days = "", stage = "", details = false, now } = {},
) {
  const { runs: allRuns, skippedRows } = parseSnapshot(snapshot);
  const dayCount = days === "" ? null : Number(days);
  if (
    dayCount !== null &&
    (!Number.isInteger(dayCount) || dayCount < 1 || dayCount > MAX_DAYS)
  ) {
    throw new Error(`days must be an integer between 1 and ${MAX_DAYS}.`);
  }

  const windowed = dayCount ? withinDays(allRuns, dayCount, now) : allRuns;
  const scoped = repo ? windowed.filter((run) => run.repo === repo) : windowed;
  const response = {
    source: SOURCE,
    evaluation: aggregateEvaluations(scoped),
    evaluationCount: scoped.reduce(
      (total, run) => total + run.results.length,
      0,
    ),
    repos: [...new Set(allRuns.map((run) => run.repo))].sort(),
    skippedRows,
    fetchedAt: snapshot.generatedAt || "",
    latestDataAt: allRuns.reduce(
      (latest, run) => (run.timestamp > latest ? run.timestamp : latest),
      "",
    ),
  };
  if (details) {
    response.runs = filterRunsByStage(scoped, stage).sort((a, b) =>
      b.timestamp.localeCompare(a.timestamp),
    );
  }
  return response;
}


;
// dashboard.js
(function (dashboard) {
  "use strict";

  const state = {
    loading: true,
    error: "",
    skippedRows: 0,
    source: null,
    evaluation: [],
    repos: [],
    latestDataAt: "",
    evaluationCount: 0,
    resultCount: 0,
    selectedStage: "",
    filters: { repo: "", days: "90" },
  };
  function element(id) {
    return document.getElementById(id);
  }

  function setText(id, value) {
    const target = element(id);
    if (target) target.textContent = value;
  }

  function setHidden(id, hidden) {
    const target = element(id);
    if (target) target.hidden = hidden;
  }

  function hasData() {
    return (state.evaluation[0]?.value || 0) > 0;
  }

  function renderRepositories() {
    const select = element("repo-filter");
    if (!select) return;
    const current = state.filters.repo;
    select.replaceChildren(new Option("All repositories", ""));
    for (const repo of state.repos) select.add(new Option(repo, repo));
    select.value = current;
  }

  function renderShell() {
    const dataAvailable = hasData();
    const errorBanner = element("error-banner");
    if (errorBanner) {
      const message = state.error ||
        (state.skippedRows
          ? `Skipped ${state.skippedRows} malformed evaluation row${state.skippedRows === 1 ? "" : "s"}.`
          : "");
      errorBanner.textContent = message;
      errorBanner.hidden = !message;
    }
    setText("metric-name", state.source?.name || "Pipeline fix evaluation");
    setText("metric-description", state.source?.description || "");
    setText(
      "latest-data-at",
      state.latestDataAt
        ? new Date(state.latestDataAt).toLocaleString()
        : "\u2014",
    );
    setText("result-count", state.resultCount);
    const selectedStage = state.evaluation.find(
      (stage) => stage.key === state.selectedStage,
    );
    setText(
      "details-heading",
      selectedStage ? selectedStage.label : "Evaluated pull requests",
    );
    const stageFilter = element("stage-filter");
    if (stageFilter) stageFilter.value = state.selectedStage;
    const daysFilter = element("days-filter");
    if (daysFilter) daysFilter.value = state.filters.days;
    renderRepositories();

    setHidden("evaluations-view", !dataAvailable);
    setHidden("evaluation-panel", !dataAvailable);
    setHidden("loading-note", !state.loading);
    setHidden("empty-state", state.loading || dataAvailable);
  }

  async function loadMetric() {
    state.loading = true;
    state.error = "";
    renderShell();
    try {
      if (!window.pipelineAnalysisData)
        throw new Error("Dashboard data is unavailable.");
      const data = buildDashboardView(window.pipelineAnalysisData, {
        ...state.filters,
        stage: state.selectedStage,
        details: true,
      });
      Object.assign(state, data);
      state.resultCount = (data.runs || []).reduce(
        (total, run) => total + run.results.length,
        0,
      );
      dashboard.renderEvaluation(state.evaluation, state.selectedStage);
      dashboard.renderTable(state.source, data.runs || []);
    } catch (error) {
      state.error = error.message;
      state.evaluation = [];
    } finally {
      state.loading = false;
      renderShell();
    }
  }

  async function setStage(stage, scrollToResults = false) {
    state.selectedStage = stage;
    renderShell();
    await loadMetric();
    if (scrollToResults) {
      element("evaluations-view")?.scrollIntoView({
        behavior: "smooth",
        block: "start",
      });
    }
  }

  function bindControls() {
    element("evaluation")?.addEventListener("click", (event) => {
      const stage = event.target.closest("[data-stage]")?.dataset.stage;
      if (stage) setStage(stage, true);
    });
    element("stage-filter")?.addEventListener("change", (event) =>
      setStage(event.target.value),
    );
    for (const [id, key] of [
      ["repo-filter", "repo"],
      ["days-filter", "days"],
    ]) {
      element(id)?.addEventListener("change", (event) => {
        state.filters[key] = event.target.value;
        loadMetric();
      });
    }
    element("table-page-previous")?.addEventListener("click", () =>
      dashboard.changeTablePage(-1),
    );
    element("table-page-next")?.addEventListener("click", () =>
      dashboard.changeTablePage(1),
    );
  }

  async function init() {
    bindControls();
    await loadMetric();
  }

  init();
})(window.dashboard);

    </script>
