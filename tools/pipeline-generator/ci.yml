# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - tools/pipeline-generator

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - tools/pipeline-generator

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-tool-dotnet.yml
  parameters:
    ToolDirectory: tools/pipeline-generator
    # Match azsdk-cli's CFS workaround (#16609): skip the blocked nuget.org lookup.
    # Packages publish to the Azure DevOps feed; GitHub tag/SHA validation still runs.
    ForceCreate: true
