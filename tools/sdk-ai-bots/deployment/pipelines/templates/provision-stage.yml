# Reusable stage template for provision orchestrators (dev / preview / prod).
#
# Encapsulates the common shape: load env-suite → azd auth → (optional
# bicep-validate + azd preview) → (optional azd apply) → (optional readiness
# reminder). The three provision-all-*.yml orchestrators consume this
# template with different flag values instead of duplicating the stage body.
#
# Provisioning uses a normal job and does not depend on an Azure DevOps
# Environment. Authorization and checks belong to the service connection.
#
# Usage:
#   stages:
#     - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-stage.yml
#       parameters:
#         environment: preview
#         runValidateAndPreview: true
#         runProvision: true

parameters:
    - name: environment
      type: string
      values: [dev, preview, prod]
    - name: serviceConnection
      type: string
      default: '$(SERVICE_CONNECTION)'
    - name: stageName
      type: string
      default: 'Provision'
    - name: stageDisplayName
      type: string
      default: 'Provision'
    - name: runValidateAndPreview
      type: boolean
      default: false
    - name: runProvision
      type: boolean
      default: true
    - name: bootstrapLayers
      type: boolean
      default: false
    - name: showReadinessReminder
      type: boolean
      default: false
    - name: workingDirectory
      type: string
      default: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/deployment'

stages:
    - stage: ${{ parameters.stageName }}
      displayName: ${{ format('{0} ({1})', parameters.stageDisplayName, parameters.environment) }}
      jobs:
          - job: AzdProvision
            pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
            steps:
                - checkout: self
                - template: /tools/sdk-ai-bots/deployment/pipelines/templates/load-environment-suite.yml
                  parameters:
                      environment: ${{ parameters.environment }}
                - template: /tools/sdk-ai-bots/deployment/pipelines/templates/azd-auth.yml
                  parameters:
                      serviceConnection: ${{ parameters.serviceConnection }}

                - ${{ if parameters.bootstrapLayers }}:
                      - template: /tools/sdk-ai-bots/deployment/pipelines/templates/bicep-validate.yml
                      - template: /tools/sdk-ai-bots/deployment/pipelines/templates/azd-provision.yml
                        parameters:
                            operation: bootstrap
                            serviceConnection: ${{ parameters.serviceConnection }}
                            workingDirectory: ${{ parameters.workingDirectory }}

                - ${{ if and(not(parameters.bootstrapLayers), parameters.runValidateAndPreview) }}:
                      - template: /tools/sdk-ai-bots/deployment/pipelines/templates/bicep-validate.yml
                      - template: /tools/sdk-ai-bots/deployment/pipelines/templates/azd-provision.yml
                        parameters:
                            operation: preview
                            serviceConnection: ${{ parameters.serviceConnection }}
                            workingDirectory: ${{ parameters.workingDirectory }}

                - ${{ if and(not(parameters.bootstrapLayers), parameters.runProvision) }}:
                      - template: /tools/sdk-ai-bots/deployment/pipelines/templates/azd-provision.yml
                        parameters:
                            operation: apply
                            serviceConnection: ${{ parameters.serviceConnection }}
                            workingDirectory: ${{ parameters.workingDirectory }}

                - ${{ if parameters.showReadinessReminder }}:
                      - bash: |
                            echo "Verify operational-readiness-checklist.md is signed off before continuing."
                        displayName: 'Operational readiness reminder'
