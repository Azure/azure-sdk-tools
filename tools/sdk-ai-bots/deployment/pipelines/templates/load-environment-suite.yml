# Pipeline template — load environment-suite into ADO variables.
#
# Reads tools/sdk-ai-bots/deployment/infra/environments/environment-suite.yaml,
# selects the requested environment, and exposes its fields as pipeline
# variables for downstream steps.
#
# Usage:
#   - template: /tools/sdk-ai-bots/deployment/pipelines/templates/load-environment-suite.yml
#     parameters:
#       environment: dev   # one of dev | preview | prod
#
# Exports (as pipeline variables):
#   AZURE_ENV_NAME, AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID, SERVICE_CONNECTION,
#   AZURE_RESOURCE_GROUP, AZURE_LOCATION, AZURE_AI_LOCATION, ACR_NAME,
#   CONTAINER_REGISTRY_NAME, KEY_VAULT_NAME, APP_CONFIG_NAME,
#   FRONTEND_SITE_NAME, AGENT_SERVER_SITE_NAME, FUNCTION_APP_NAME,
#   *_IMAGE_REPOSITORY, TEAMS_GROUP_ID, TEAMS_CHANNEL_IDS, bicepOverrides,
#   TEAMS_CHANNEL_IDS_JSON, APPROVAL_REQUIRED, PROD_DEPLOY_ONLY_FROM_PIPELINE,
#   ROLLOUT_STRATEGY
#
# Implementation: uses `yq` (pre-installed on 1ES Linux images) to extract
# values; no PowerShell yaml parsing required.

parameters:
    - name: environment
      type: string
      values: [dev, preview, prod]
    - name: suitePath
      type: string
      default: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/deployment/infra/environments/environment-suite.yaml'

steps:
    - bash: |
          set -euo pipefail
          SUITE="${{ parameters.suitePath }}"
          ENV="${{ parameters.environment }}"
          if [ ! -f "$SUITE" ]; then
            echo "##[error]environment-suite.yaml not found at $SUITE"
            exit 1
          fi
          command -v yq >/dev/null || { echo "##[error]yq not on PATH"; exit 1; }

          set_var() {
            local name="$1"
            local val="$2"
            echo "##vso[task.setvariable variable=${name}]${val}"
            echo "  ${name} = ${val}"
          }

          export_var() {
            local name="$1"
            local path="$2"
            local val
            val=$(yq -r "$path" "$SUITE")
            if [ -z "$val" ] || [ "$val" = "null" ]; then
              echo "##[warning]${name} resolved to empty for env=${ENV} (path=${path})"
              val=""
            fi
            set_var "$name" "$val"
          }

          export_image_repository() {
            local name="$1"
            local component="$2"
            local image_name
            image_name=$(yq -r ".components.\"${component}\".imageName" "$SUITE")
            if [ -z "$image_name" ] || [ "$image_name" = "null" ]; then
              echo "##[error]imageName missing for component=${component}"
              exit 1
            fi
            set_var "$name" "${image_name}:${ENV}"
          }

          echo "Loading environment-suite contract for '$ENV'..."
          set_var AZURE_ENV_NAME                    "$ENV"
          export_var SERVICE_CONNECTION             ".environments.${ENV}.subscription"
          export_var AZURE_SUBSCRIPTION_ID          ".environments.${ENV}.subscriptionId"
          export_var AZURE_TENANT_ID                ".environments.${ENV}.tenantId"
          export_var SERVICE_MANAGEMENT_REFERENCE   ".environments.${ENV}.serviceManagementReference"
          export_var AZURE_RESOURCE_GROUP           ".environments.${ENV}.resourceGroupPrefix"
          export_var AZURE_LOCATION                 ".environments.${ENV}.regions[0].name"
          export_var AZURE_AI_LOCATION              ".environments.${ENV}.aiLocation"
          export_var AZURE_AI_DEPLOYMENTS_LOCATION  ".environments.${ENV}.aiLocation"
          export_var COSMOS_DB_LOCATION             ".environments.${ENV}.cosmosDbLocation"
          export_var ACR_NAME                       ".environments.${ENV}.containerRegistryName"
          export_var CONTAINER_REGISTRY_NAME        ".environments.${ENV}.containerRegistryName"
          export_var CONTAINER_REGISTRY_NAME_OVERRIDE ".environments.${ENV}.containerRegistryName"
          export_var KEY_VAULT_NAME                 ".environments.${ENV}.keyVaultName"
          export_var KEY_VAULT_NAME_OVERRIDE        ".environments.${ENV}.keyVaultName"
          export_var APP_CONFIG_NAME                ".environments.${ENV}.appConfigName"
          export_var APP_CONFIG_NAME_OVERRIDE       ".environments.${ENV}.appConfigName"
          export_var FRONTEND_SITE_NAME             ".environments.${ENV}.frontendSiteName"
          export_var AGENT_SERVER_SITE_NAME         ".environments.${ENV}.agentServerSiteName"
          export_var AGENT_SERVER_SITE_NAME_OVERRIDE ".environments.${ENV}.agentServerSiteName"
          export_var FUNCTION_APP_NAME              ".environments.${ENV}.functionAppName"
          export_var FUNCTION_APP_NAME_OVERRIDE     ".environments.${ENV}.functionAppName"
          export_image_repository FRONTEND_IMAGE_REPOSITORY frontend
          export_image_repository AGENT_SERVER_IMAGE_REPOSITORY agent-server
          export_image_repository FUNCTION_IMAGE_REPOSITORY function-app
          export_var TEAMS_GROUP_ID                 ".environments.${ENV}.teamsGroupId"
          TEAMS_CHANNEL_IDS=$(yq -r ".environments.${ENV}.teamsChannelIds | join(\",\")" "$SUITE")
          set_var TEAMS_CHANNEL_IDS "$TEAMS_CHANNEL_IDS"
          TEAMS_CHANNEL_IDS_JSON=$(yq -o=json -I=0 ".environments.${ENV}.teamsChannelIds" "$SUITE")
          set_var TEAMS_CHANNEL_IDS_JSON "$TEAMS_CHANNEL_IDS_JSON"
          export_var APPROVAL_REQUIRED              ".environments.${ENV}.approvalRequired"
          export_var PROD_DEPLOY_ONLY_FROM_PIPELINE ".environments.${ENV}.prodDeployOnlyFromPipeline"
          export_var ROLLOUT_STRATEGY               ".environments.${ENV}.rolloutStrategy"

          # Environment-specific values override the common mappings above.
          # Keys are environment variables consumed by the layer parameter adapters.
          OVERRIDE_INPUT_KEYS=' MANAGED_IDENTITY_NAME ACTION_GROUP_NAME KEY_VAULT_NAME APP_CONFIG_NAME SEARCH_SERVICE_NAME CONTAINER_REGISTRY_NAME STORAGE_ACCOUNT_NAME COSMOS_DB_ACCOUNT_NAME AI_RESOURCE_NAME AI_PROJECT_NAME AGENT_SERVER_SITE_NAME FUNCTION_APP_NAME INTEGRATION_ACCOUNT_NAME TEAMS_CONNECTION_NAME AZURE_BLOB_CONNECTION_NAME DOCUMENT_DB_CONNECTION_NAME LOGIC_APP_WORKFLOW_NAME LOGIC_APP_ALERT_NAME '
          while IFS=$'\t' read -r name val; do
            [ -z "$name" ] && continue
            if [[ "$val" == REPLACE_WITH_* ]]; then
              echo "##[error]${name} is still a placeholder for env=${ENV}"
              exit 1
            fi
            set_var "$name" "$val"
            if [[ "$OVERRIDE_INPUT_KEYS" == *" $name "* ]]; then
              set_var "${name}_OVERRIDE" "$val"
            fi
          done < <(yq -r ".environments.${ENV}.bicepOverrides // {} | to_entries[] | [.key, (.value | tostring)] | @tsv" "$SUITE")
      displayName: 'Load environment-suite (${{ parameters.environment }})'
