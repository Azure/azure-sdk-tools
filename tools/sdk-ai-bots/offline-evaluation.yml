schedules:
  - cron: "0 3 * * *"  # Runs nightly at 03:00 UTC
    displayName: "Nightly Offline Evaluation"
    branches:
      include:
        - main
    always: true

trigger: none
pr: none

parameters:
  - name: researchSnapshot
    type: object
    default: {}
  - name: researchDataset
    type: object
    default: []
  - name: researchProfile
    type: string
    default: ''
  - name: scenarios
    type: object
    default:
      - typespec
      - onboarding
      - python
      - apispec
      - authoring
      - mcpserver
      - sdkagent

#
# Starts the agent server.py locally, then evaluates via completion mode:
# evals_run.py calls the local /completion endpoint concurrently, collects answers,
# and grades them inline with the Foundry builtin LLM evaluators.
extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    Use1ESOfficial: false
    stages:
      - stage: 'evaluation'
        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml
        pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
        jobs:
          - ${{ each scenario in parameters.scenarios }}:
              - job: 'evaluation_${{ scenario }}'
                displayName: 'evaluation (${{ scenario }})'
                steps:
                  - task: UsePythonVersion@0
                    displayName: "Use Python 3.12"
                    inputs:
                      versionSpec: '3.12'
                  - task: PipAuthenticate@1
                    displayName: 'Authenticate pip to Azure Artifacts'
                    inputs:
                      artifactFeeds: 'public/azure-sdk-for-python'
                  - script: |
                      python --version
                    displayName: 'check python'
                  - task: AzureCLI@2
                    displayName: 'start agent server'
                    inputs:
                      azureSubscription: 'azuresdkqabot-dev'
                      addSpnToEnvironment: true
                      scriptType: bash
                      scriptLocation: inlineScript
                      workingDirectory: $(Build.SourcesDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-agent
                      inlineScript: |
                        pip install --pre -r requirements.txt
                        export AZURE_CLIENT_ID=$servicePrincipalId
                        export AZURE_TENANT_ID=$tenantId
                        EVAL_CACHE="$(Build.SourcesDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-evaluation/cache"
                        mkdir -p "$EVAL_CACHE"
                        nohup python ../azure-sdk-qa-bot-evaluation/research/server.py --profile "$QA_RESEARCH_PROFILE" </dev/null > "$EVAL_CACHE/server.log" 2>&1 &
                        python ../azure-sdk-qa-bot-evaluation/research/wait_for_server.py || { echo "##[error]agent server failed to start"; cat "$EVAL_CACHE/server.log"; exit 1; }
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                      AZURESUBSCRIPTION_SERVICE_CONNECTION_ID: $(AZURESUBSCRIPTION_SERVICE_CONNECTION_ID)
                      AZURE_APPCONFIG_ENDPOINT: $(AZURE_APPCONFIG_ENDPOINT)
                      QA_RESEARCH_PROFILE: ${{ parameters.researchProfile }}
                      QA_RESEARCH_SNAPSHOT: ${{ convertToJson(parameters.researchSnapshot) }}
                  - script: |
                      pip install -r requirements.txt
                    displayName: 'install requirements'
                    workingDirectory: $(Build.SourcesDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-evaluation
                  - task: AzureCLI@2
                    displayName: 'Run Evals (${{ scenario }})'
                    inputs:
                      azureSubscription: 'azuresdkqabot-dev'
                      scriptType: bash
                      scriptLocation: inlineScript
                      workingDirectory: $(Build.SourcesDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-evaluation
                      inlineScript: |
                        python evals_run.py \
                          --dataset "qa-bot-basic-${{ scenario }}:latest" \
                          --run_context "offline-evaluation" \
                          --max_concurrency 2 \
                          --baseline_check True \
                          --cache_result full
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                      AZURE_AI_PROJECT_ENDPOINT: $(AZURE_AI_PROJECT_ENDPOINT)
                      AZURE_EVALUATION_MODEL_NAME: $(AZURE_EVALUATION_MODEL_NAME)
                      STORAGE_BLOB_ACCOUNT: $(STORAGE_BLOB_ACCOUNT)
                      BOT_CONFIG_CONTAINER: $(BOT_CONFIG_CONTAINER)
                      BOT_CONFIG_CHANNEL_BLOB: $(BOT_CONFIG_CHANNEL_BLOB)
                      EVALUATE_THRESHOLD: $(EVALUATE_THRESHOLD)
                  - ${{ if and(ne(parameters.researchProfile, ''), eq(scenario, 'apispec')) }}:
                    - task: AzureCLI@2
                      displayName: 'Run frozen research holdout (${{ scenario }})'
                      condition: succeededOrFailed()
                      inputs:
                        azureSubscription: 'azuresdkqabot-dev'
                        scriptType: bash
                        scriptLocation: scriptPath
                        scriptPath: $(Build.SourcesDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-evaluation/research/run-holdout.sh
                        workingDirectory: $(Build.SourcesDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-evaluation
                      env:
                        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                        AZURE_AI_PROJECT_ENDPOINT: $(AZURE_AI_PROJECT_ENDPOINT)
                        AZURE_EVALUATION_MODEL_NAME: $(AZURE_EVALUATION_MODEL_NAME)
                        STORAGE_BLOB_ACCOUNT: $(STORAGE_BLOB_ACCOUNT)
                        BOT_CONFIG_CONTAINER: $(BOT_CONFIG_CONTAINER)
                        BOT_CONFIG_CHANNEL_BLOB: $(BOT_CONFIG_CHANNEL_BLOB)
                        EVALUATE_THRESHOLD: $(EVALUATE_THRESHOLD)
                        QA_RESEARCH_DATASET: ${{ convertToJson(parameters.researchDataset) }}
                templateContext:
                  outputs:
                    - output: pipelineArtifact
                      path: $(Build.SourcesDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-evaluation/cache
                      artifact: evaluation-results-${{ scenario }}
                      displayName: Publish Evaluation Results Artifact (${{ scenario }})
                      condition: always()
