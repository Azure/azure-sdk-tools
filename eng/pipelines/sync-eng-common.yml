# Mirror the eng/common folder to all subscribed language repos.
#
# For more information on this file, please see:
# doc/common/common_engsys.md
parameters:
- name: DirectoryToSync
  type: string
  default: eng/common
- name: Repos
  type: object
  default:
    - RepoOwner: Azure
      RepoName: azure-sdk
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-cpp
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-go
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-ios
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-java
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-js
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-net
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-python
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-sdk-for-rust
      BranchOwner: azure-sdk
    - RepoOwner: Azure
      RepoName: azure-rest-api-specs
      BranchOwner: azure-sdk
    - RepoOwner: Microsoft
      RepoName: mcp
      BranchOwner: Microsoft
- name: RepoOwners
  type: object
  default:
    - Azure
    - Microsoft

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - eng/common

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-tool-repo-sync.yml
  parameters:
    DirectoryToSync: ${{ parameters.DirectoryToSync }}
    Repos: ${{ parameters.Repos }}
    RepoOwners: ${{ parameters.RepoOwners }}
