# Manual smoke test for GitHub App authentication with Copilot CLI.

trigger: none
pr: none

parameters:
  - name: owner
    displayName: GitHub App installation owner
    type: string
    default: Azure

jobs:
  - job: CopilotAuthentication
    displayName: 'Test Copilot authentication'
    pool:
      name: azsdk-pool
      demands: ImageOverride -equals ubuntu-24.04
    steps:
      - checkout: self
        fetchDepth: 1

      - task: NodeTool@0
        displayName: 'Install Node.js'
        inputs:
          versionSpec: '24.x'

      # 1ES images block registry.npmjs.org; restore via the azure-sdk npm mirror. Written to
      # the agent user's .npmrc so the global install below inherits the registry and its auth.
      - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
        parameters:
          registryUrl: https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-tools/npm/registry/

      - script: |
          npm install --global @github/copilot
          copilot --version
        displayName: 'Install Copilot CLI'
        retryCountOnTaskFailure: 2

      # Mint a short-lived GitHub App installation token just before evaluation instead of
      # relying on a manually rotated PAT from a variable group.
      - template: /eng/common/pipelines/templates/steps/login-to-github.yml
        parameters:
          TokenOwners:
            - ${{ parameters.owner }}

      - script: copilot -p 'Hi respond "yes"' --allow-all-tools
        displayName: 'Prompt Copilot'
        env:
          GH_TOKEN: $(GH_TOKEN)
          COPILOT_GITHUB_TOKEN: $(GH_TOKEN)
