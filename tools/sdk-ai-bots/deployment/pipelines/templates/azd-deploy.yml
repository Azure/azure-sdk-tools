# Pipeline template — `azd deploy <service>`.
# Every service uses azd's native remote-build lifecycle.
#
# Required pipeline variables: AZURE_SERVICE_CONNECTION, AZURE_ENV_NAME,
# ACR_NAME.

parameters:
    - name: service
      type: string # frontend | function-app | agent | agent-server
    - name: workingDirectory
      type: string
      default: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/deployment'

steps:
    # 1ES Official blocks direct npmjs.org access. Install the TypeScript hook
    # runner from the authenticated Azure SDK mirror before invoking azd.
    - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
      parameters:
          npmrcPath: $(Agent.TempDirectory)/sdk-ai-bots-deployment.npmrc
          registryUrl: https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-tools/npm/registry/
    - script: npm ci --omit=dev --userconfig "$(resolvedNpmrcPath)"
      displayName: 'Install deployment hook dependencies'
      workingDirectory: '${{ parameters.workingDirectory }}'

    - task: AzureCLI@2
      displayName: 'azd deploy ${{ parameters.service }}'
      env: { SYSTEM_ACCESSTOKEN: '$(System.AccessToken)' }
      inputs:
          azureSubscription: ${{ variables.AZURE_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: '${{ parameters.workingDirectory }}'
          inlineScript: |
              set -euo pipefail
              export npm_config_userconfig="$(resolvedNpmrcPath)"
              # Teams Toolkit uses an interactive Microsoft 365 identity and
              # Microsoft Graph. Keep that separate from the Azure service
              # connection so component CD requires Azure RBAC only.
              export AZD_SKIP_TEAMS_PROVISION="${AZD_SKIP_TEAMS_PROVISION:-1}"
              export AZURE_ENV_NAME
              export CONTAINER_REGISTRY_NAME="$ACR_NAME"
              if ! azd env select "$AZURE_ENV_NAME" --no-prompt >/dev/null 2>&1; then
                azd env new "$AZURE_ENV_NAME" \
                  --location "$AZURE_LOCATION" \
                  --subscription "$AZURE_SUBSCRIPTION_ID" \
                  --no-prompt
              fi
              azd env select "$AZURE_ENV_NAME" --no-prompt
              if [ "${{ parameters.service }}" = "frontend" ] && [ "${AZD_SKIP_TEAMS_PROVISION:-0}" != "1" ]; then
                azd env refresh "$AZURE_ENV_NAME" --layer frontend --no-prompt
              fi
              if [ "${{ parameters.service }}" = "function-app" ]; then
                for LAYER in shared-resources frontend agent-server function-app logic-app; do
                  azd env refresh "$AZURE_ENV_NAME" --layer "$LAYER" --no-prompt
                done
              fi
              azd deploy "${{ parameters.service }}" --environment "$AZURE_ENV_NAME" --no-prompt
