trigger: none
pr: none

variables:
- template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
    - stage: RetrievalSmoke
      jobs:
      - job: PreviewRetrieval
        timeoutInMinutes: 15
        pool:
          name: $(LINUXPOOL)
          image: $(LINUXVMIMAGE)
          os: linux
        steps:
        - checkout: self
          fetchDepth: 1
        - task: DownloadPipelineArtifact@2
          displayName: Download exact MCP binary from benchmark 7068274
          inputs:
            buildType: specific
            project: internal
            definition: '8178'
            buildVersionToDownload: specific
            pipelineId: '7068274'
            allowPartiallySucceededBuilds: true
            artifactName: mcp-servers
            targetPath: $(Pipeline.Workspace)/retrieval-mcp
        - task: AzureCLI@2
          displayName: Verify preview MISE v2 and invoke knowledge retrieval
          inputs:
            azureSubscription: azuresdkqabot-dev
            scriptType: bash
            scriptLocation: scriptPath
            scriptPath: eng/scripts/preview-retrieval-smoke.sh
            arguments: '"$(Pipeline.Workspace)/retrieval-mcp/cli/azsdk.dll"'
          env:
            AZSDKTOOLS_AGENT_TESTING: 'false'
            AZSDKTOOLS_COLLECT_TELEMETRY: 'false'
            AZURE_SDK_KB_ENDPOINT: https://azuresdkqabot-test-server-cbdbh2gva6h7hrfr.westus2-01.azurewebsites.net
            AZURE_SDK_KB_CLIENT_ID: 674414e1-152b-41ac-b0d2-763535edea6c
            AZURE_SDK_KB_SCOPE: api://azure-sdk-qa-bot-test/user_impersonation
