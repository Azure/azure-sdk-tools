parameters:
  Repos: []
  DirectoryToSync: eng/common
  FilePatterns: []
  CommitMessage: commit-message-not-set
  UpstreamBranchName: branch-name-not-set
  BaseBranchName: $(DefaultBranch)
  Sync: pr-data-artifact-path-not-set
  SkipCheckingForChanges: false
  ScriptDirectory: eng/common/scripts
  PROwner: Azure
  PushArgs: -f
  AuthToken: $(GH_TOKEN)

steps:
- template: /eng/common/pipelines/templates/steps/set-default-branch.yml

- ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
  - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
    parameters:
      SkipCheckoutNone: true
      Paths:
        - ${{ parameters.DirectoryToSync }}
      Repositories:
        - ${{ each repo in parameters.Repos }}:
          - Name: ${{ repo.RepoOwner }}/${{ repo.RepoName }}
            Commitish: ${{ parameters.BaseBranchName }}
            WorkingDirectory: $(System.DefaultWorkingDirectory)/${{ repo.RepoName }}

  - ${{ each repo in parameters.Repos }}:
    - pwsh: |
        if (Test-Path '$(PatchFilesLocation)')
        {
          pushd ${{ repo.RepoName }}
          $results = @()
          echo "##vso[task.setvariable variable=HasChanges]$false"
          $shaBeforePatches = git rev-parse --short HEAD
          foreach ($file in (Get-ChildItem $(PatchFilesLocation)))
          {
             Write-Host $file.FullName
             git -c user.name="azure-sdk" -c user.email="azuresdk@microsoft.com" am -3 $file.FullName
             if ($lastExitCode -ne 0) {
               git -c user.name="azure-sdk" -c user.email="azuresdk@microsoft.com" am --show-current-patch=diff | ForEach-Object {
                 Write-Host ($_ -replace '##vso', '## vso')
               }
               git am --abort

               Write-Warning "Patch did not apply cleanly. Mirroring the affected files from azure-sdk-tools."
               $patchPaths = Get-Content $file.FullName | ForEach-Object {
                 if ($_ -match '^diff --git a/(.+) b/(.+)$') {
                   $Matches[1]
                   $Matches[2]
                 }
               } | Sort-Object -Unique

               if (!$patchPaths) {
                 throw "Unable to determine the files changed by patch '$($file.FullName)'."
               }

               foreach ($patchPath in $patchPaths) {
                 if (($patchPath -split '/') -contains '..' -or
                     ($patchPath -ne '${{ parameters.DirectoryToSync }}' -and !$patchPath.StartsWith('${{ parameters.DirectoryToSync }}/'))) {
                   throw "Patch path '$patchPath' is outside '${{ parameters.DirectoryToSync }}'."
                 }

                 $sourcePath = Join-Path '$(System.DefaultWorkingDirectory)' $patchPath
                 $destinationPath = Join-Path (Get-Location) $patchPath
                 if (Test-Path $sourcePath) {
                   New-Item -ItemType Directory -Force -Path (Split-Path $destinationPath -Parent) | Out-Null
                   Copy-Item -Force -Path $sourcePath -Destination $destinationPath
                 } else {
                   Remove-Item -Force -Recurse -ErrorAction Ignore -Path $destinationPath
                 }
               }

               git add --all -- ${{ parameters.DirectoryToSync }}
               if (git status --short -- ${{ parameters.DirectoryToSync }}) {
                 git -c user.name="azure-sdk" -c user.email="azuresdk@microsoft.com" commit -m "${{ parameters.CommitMessage }}"
                 if ($LASTEXITCODE -ne 0) {
                   throw "Failed to commit files recovered from patch '$($file.FullName)'."
                 }
               }
             }
          }
          $shaAfterPatches = git rev-parse --short HEAD
          $hasChanges = $shaBeforePatches -ne $shaAfterPatches
          echo "##vso[task.setvariable variable=HasChanges]$hasChanges"
        }
      displayName: Apply Patch for ${{ parameters.DirectoryToSync }} from azure-sdk-tools to ${{ repo.RepoOwner }}/${{ repo.RepoName }}
      workingDirectory: $(System.DefaultWorkingDirectory)

    - task: PowerShell@2
      displayName: Push changes for creating Sync PRs
      condition: and(succeeded(), eq(variables['HasChanges'], 'true'))
      inputs:
        pwsh: true
        workingDirectory: $(System.DefaultWorkingDirectory)/${{ repo.RepoName }}
        filePath: ${{ parameters.ScriptDirectory }}/git-branch-push.ps1
        arguments: >
          -PRBranchName "${{ parameters.UpstreamBranchName }}"
          -CommitMsg "${{ parameters.CommitMessage }}"
          -GitUrl "https://x-access-token:$(GH_TOKEN_${{ repo.RepoOwner }})@github.com/${{ repo.RepoOwner }}/${{ repo.RepoName }}.git"
          -PushArgs "${{ parameters.PushArgs }}"
          -SkipCommit $${{parameters.SkipCheckingForChanges}}

    - task: PowerShell@2
      displayName: Push changes for Queueing Test Pipeline
      condition: and(succeeded(), ne(variables['${{ repo.RepoName }}-template-definition-id'], ''))
      inputs:
        pwsh: true
        workingDirectory: $(System.DefaultWorkingDirectory)/${{ repo.RepoName }}
        filePath: ${{ parameters.ScriptDirectory }}/git-branch-push.ps1
        arguments: >
          -PRBranchName "${{ parameters.UpstreamBranchName }}-ForTestPipeline"
          -CommitMsg "${{ parameters.CommitMessage }}"
          -GitUrl "https://x-access-token:$(GH_TOKEN_${{ repo.RepoOwner }})@github.com/${{ repo.RepoOwner }}/${{ repo.RepoName }}.git"
          -PushArgs "${{ parameters.PushArgs }}"
          -AmendCommit $True

    - task: AzureCLI@2
      displayName: Queue template pipeline
      condition: and(succeeded(), ne(variables['${{ repo.RepoName }}-template-definition-id'], ''))
      inputs:
        azureSubscription: opensource-api-connection
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $accessToken = az account get-access-token --resource "499b84ac-1321-427f-aa17-267ca6975798" --query "accessToken" --output tsv
          ${{ parameters.ScriptDirectory }}/Queue-Pipeline.ps1 `
            -Organization "azure-sdk" `
            -Project "internal" `
            -SourceBranch "${{ parameters.UpstreamBranchName }}-ForTestPipeline" `
            -DefinitionId "$(${{ repo.RepoName }}-template-definition-id)" `
            -VsoQueuedPipelines "QUEUEDPIPELINES" `
            -CancelPreviousBuilds $True `
            -BearerToken $accessToken
        workingDirectory: ${{ parameters.WorkingDirectory }}

    - task: AzureCLI@2
      displayName: Queue live-test template pipeline
      condition: and(succeeded(), ne(variables['${{ repo.RepoName }}-template-tests-definition-id'], ''))
      inputs:
        azureSubscription: opensource-api-connection
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $accessToken = az account get-access-token --resource "499b84ac-1321-427f-aa17-267ca6975798" --query "accessToken" --output tsv
          ${{ parameters.ScriptDirectory }}/Queue-Pipeline.ps1 `
            -Organization "azure-sdk" `
            -Project "internal" `
            -SourceBranch "${{ parameters.UpstreamBranchName }}-ForTestPipeline" `
            -DefinitionId "$(${{ repo.RepoName }}-template-tests-definition-id)" `
            -VsoQueuedPipelines "QUEUEDPIPELINES" `
            -CancelPreviousBuilds $True `
            -BearerToken $accessToken
        workingDirectory: ${{ parameters.WorkingDirectory }}

  - task: PowerShell@2
    displayName: Write Queued Pipeline Information to Tools PR
    condition: and(succeeded(), and(ne(variables['QUEUEDPIPELINES'], ''), eq(variables['Build.Reason'], 'PullRequest')))
    inputs:
      pwsh: true
      workingDirectory: ${{ parameters.WorkingDirectory }}
      filePath: ${{ parameters.ScriptDirectory }}/Add-IssueComment.ps1
      arguments: >
        -RepoOwner "Azure"
        -RepoName "azure-sdk-tools"
        -IssueNumber "$(System.PullRequest.PullRequestNumber)"
        -Comment "The following pipelines have been queued for testing:<br>$env:QUEUEDPIPELINES`
        <br>You can sign off on the approval gate to test the release stage of each pipeline.`
        <br>See [eng/common workflow](https://github.com/Azure/azure-sdk-tools/blob/main/eng/common/README.md#workflow)"
        -AuthToken "${{ parameters.AuthToken }}"

- ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
  - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
    parameters:
      SkipCheckoutNone: true
      Paths:
        - ${{ parameters.DirectoryToSync }}
      Repositories:
        - Name: $(Build.Repository.Name)
          Commitish: $(Build.SourceVersion)
          WorkingDirectory: $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)
        - ${{ each repo in parameters.Repos }}:
          - Name: ${{ repo.RepoOwner }}/${{ repo.RepoName }}
            Commitish: ${{ parameters.BaseBranchName }}
            WorkingDirectory: $(System.DefaultWorkingDirectory)/${{ repo.RepoName }}

  - ${{ each repo in parameters.Repos }}:
    - pwsh: |
        Set-PsDebug -Trace 1
        $repoPath = "${{ repo.RepoName }}/${{ parameters.DirectoryToSync }}"
        New-Item -ItemType Directory -Force -ErrorAction Ignore -Path $repoPath

        $filePatterns = '${{ convertToJson(parameters.FilePatterns) }}' | ConvertFrom-Json
        if (!$filePatterns) { $filePatterns = @("*")}

        foreach ($filePattern in $filePatterns) {
          Write-Host "Copying files with pattern: $filePattern"

          $patternDir = Split-Path $filePattern -Parent
          $destPath = if ($patternDir) { Join-Path $repoPath $patternDir } else { $repoPath }
          New-Item -ItemType Directory -Force -ErrorAction Ignore -Path $destPath

          Remove-Item -v -r -Force -ErrorAction Ignore "${repoPath}/${filePattern}"
          Copy-Item -v -r `
            "$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/${{ parameters.DirectoryToSync }}/${filePattern}" `
            $destPath
        }
        Get-ChildItem -r $repoPath
      displayName: Copy ${{ parameters.DirectoryToSync }} from azure-sdk-tools to ${{ repo.RepoOwner }}/${{ repo.RepoName }}
      workingDirectory: $(System.DefaultWorkingDirectory)

    - template: /eng/common/pipelines/templates/steps/create-pull-request.yml
      parameters:
        RepoName: ${{ repo.RepoName }}
        RepoOwner: ${{ repo.RepoOwner }}
        BaseBranchName: ${{ parameters.BaseBranchName }}
        PRBranchName: ${{ parameters.UpstreamBranchName }}
        CommitMsg: ${{ parameters.CommitMessage }}
        PRTitle: ${{ parameters.CommitMessage }}
        PushArgs: -f
        WorkingDirectory: $(System.DefaultWorkingDirectory)/${{ repo.RepoName }}
        ScriptDirectory: $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/${{ parameters.ScriptDirectory }}
        AuthToken: ''

- template: /eng/common/pipelines/templates/steps/emit-rate-limit-metrics.yml
  parameters:
    GitHubUser: azure-sdk
    GitHubToken: ${{ parameters.AuthToken }}
