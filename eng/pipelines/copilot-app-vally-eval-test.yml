# Isolated lifetime diagnostic. Never merge this file into production pipelines.
# Uses the existing diagnostic definition; no new service connections, grants, or live MCP.
trigger: none
pr: none

variables:
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: DiagnoseTokenLifetime
        jobs:
          - job: TokenLifetime
            timeoutInMinutes: 100
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: copilot-token-lifetime-evidence
                  targetPath: $(Build.SourcesDirectory)/artifacts/token-lifetime
                  condition: always()
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1

              - task: UseNode@1
                inputs:
                  version: 24.x

              - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
                parameters:
                  npmrcPath: $(Build.SourcesDirectory)/.npmrc
                  registryUrl: https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-tools/npm/registry/

              - script: npm ci --userconfig $(Build.SourcesDirectory)/.npmrc
                displayName: Install the unchanged production Vally and SDK lockfile
                workingDirectory: eng/common/scripts/eval

              - script: node --test eng/pipelines/copilot-token-lifetime.test.mjs
                displayName: Verify diagnostic isolation and assertions offline

              - template: /eng/common/pipelines/templates/steps/login-to-copilot.yml

              - script: node eng/pipelines/copilot-token-lifetime.mjs --phase original
                displayName: Test the original installation token across its one-hour boundary
                timeoutInMinutes: 85
                env:
                  COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)

              # A second explicit login is a recovery control, not automatic refresh.
              - template: /eng/common/pipelines/templates/steps/login-to-copilot.yml

              - script: node eng/pipelines/copilot-token-lifetime.mjs --phase fresh-control
                displayName: Verify recovery with a newly minted installation token
                timeoutInMinutes: 8
                env:
                  COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
