# Summary job: merges every shard's JUnit into one rollup (Markdown summary + Tests tab) and
# gates on it when failOnFailedTests is true.

parameters:
  - name: failOnFailedTests
    type: boolean
    default: false
  - name: createDashboardBundle
    type: boolean
    default: false
  - name: publishDashboardResults
    type: boolean
    default: false

jobs:
  - job: Summarize
    displayName: 'Consolidate, publish + gate results'
    pool:
      name: $(LINUXPOOL)
      image: $(LINUXVMIMAGE)
      os: linux
    workspace:
      clean: all
    variables:
      EvalExpectedMatrix: $[ stageDependencies.Prepare.generate_eval_matrix.outputs['detect.matrix'] ]
      EvalArchiveStatus: not_started
      EvalImportStatus: not_attempted
      EvalStorageConfigured: $[ ne(variables['EvalStorageAccountName'], '') ]
    templateContext:
      outputs:
        - output: pipelineArtifact
          displayName: 'Retain selected build summary and saved bundle'
          artifactName: 'eval-summary-$(System.JobAttempt)'
          targetPath: $(Build.ArtifactStagingDirectory)/eval-summary
          condition: always()
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - task: UseNode@1
        displayName: 'Use Node.js 24.x'
        inputs:
          version: 24.x

      # Allowlist result data only, excluding debug, MCP, SDL and signing artifacts.
      - task: DownloadPipelineArtifact@2
        displayName: 'Download all shard results'
        inputs:
          buildType: 'current'
          itemPattern: |
            eval-result-*/results.jsonl
            eval-result-*/shard.json
            eval-result-*/**/*.junit.xml
          targetPath: $(Pipeline.Workspace)/eval-results

      # Only attempt verification needs the current build token; rendering uses saved evidence.
      - script: |
          node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/lib/shard-results.ts" \
            --attempts-output "$(Build.ArtifactStagingDirectory)/eval-summary/job-attempts.json"
        displayName: 'Verify latest shard job attempts from current build timeline'
        condition: always()
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          EVAL_EXPECTED_MATRIX: $(EvalExpectedMatrix)

      - script: |
          node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/build-eval-summary.ts" \
            --results-root "$(Pipeline.Workspace)/eval-results" \
            --selected-root "$(Pipeline.Workspace)/eval-selected" \
            --attempts-file "$(Build.ArtifactStagingDirectory)/eval-summary/job-attempts.json" \
            --output-path "$(Build.ArtifactStagingDirectory)/eval-summary/eval-summary.md"
        displayName: 'Select expected latest attempts and render complete-build summary'
        condition: always()
        env:
          EVAL_EXPECTED_MATRIX: $(EvalExpectedMatrix)

      - ${{ if or(parameters.createDashboardBundle, parameters.publishDashboardResults) }}:
        - template: ../steps/eval-publish-results.yml
          parameters:
            publishDashboardResults: ${{ parameters.publishDashboardResults }}

      # Completed failing evals are useful data: publish BEFORE the evaluation gate.
      - task: PublishTestResults@2
        displayName: 'Publish eval rollup'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '$(Pipeline.Workspace)/eval-selected/**/*.junit.xml'
          mergeTestResults: true
          failTaskOnFailedTests: ${{ parameters.failOnFailedTests }}
          failTaskOnMissingResultsFile: true
          testRunTitle: 'Vally evals'

      - script: |
          node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/build-eval-summary.ts" \
            --delivery --output-path "$(Build.ArtifactStagingDirectory)/eval-summary/eval-delivery.md"
        displayName: 'Report final evaluation result delivery'
        condition: always()
        env:
          EVAL_ARCHIVE_STATUS: $(EvalArchiveStatus)
          EVAL_IMPORT_STATUS: $(EvalImportStatus)
          EVAL_STORAGE_CONFIGURED: $(EvalStorageConfigured)
          EVAL_DASHBOARD_REFRESH_URL: $(EvalDashboardRefreshUrl)
          ${{ if not(parameters.publishDashboardResults) }}:
            EVAL_PUBLICATION_SKIP_REASON: disabled
          ${{ elseif ne(variables['Build.SourceBranch'], 'refs/heads/main') }}:
            EVAL_PUBLICATION_SKIP_REASON: feature_branch
          ${{ elseif not(and(eq(variables['System.CollectionUri'], 'https://dev.azure.com/azure-sdk/'), eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.Repository.Name'], 'Azure/azure-sdk-tools'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Schedule', 'Manual'))) }}:
            EVAL_PUBLICATION_SKIP_REASON: ineligible_run
          ${{ else }}:
            EVAL_PUBLICATION_SKIP_REASON: ''
