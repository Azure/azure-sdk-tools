# Deployment pipeline for the Azure SDK QA Bot Logic App.
# Deploys the Logic App ARM template with environment-specific parameters.
# Chat dev/test use the shared listener; collection is configured by environment only.

name: Deploy Azure SDK QA Bot Logic App

trigger: none
pr: none

parameters:
  - name: workflow
    displayName: 'Logic App Workflow'
    type: string
    default: chat
    values:
      - chat
      - teams-collection
  - name: team
    displayName: 'Chat workflow only: production team (dev/test use azure_sdk)'
    type: string
    default: azure_sdk
    values:
      - azure_sdk
      - azure_mcp_server
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: dev
    values:
      - dev
      - test
      - prod

variables:
  - template: /eng/pipelines/templates/variables/globals.yml
  - template: /eng/pipelines/templates/variables/image.yml
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: 'Azure SDK QA Bot Dev Variables'
  - ${{ if eq(parameters.environment, 'test') }}:
    - group: 'Azure SDK QA Bot Preview Variables'
  - ${{ if eq(parameters.environment, 'prod') }}:
    - group: 'Azure SDK QA Bot Prod Variables'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-agent'
  - name: listenerTeam
    value: ${{ iif(eq(parameters.environment, 'prod'), parameters.team, 'azure_sdk') }}
  - name: templateFile
    value: ${{ format('pipelines/logicapp/template.{0}.json', parameters.workflow) }}
  - ${{ if eq(parameters.workflow, 'chat') }}:
    - name: parametersFile
      value: ${{ format('pipelines/logicapp/parameters.chat.{0}.{1}.json', variables.listenerTeam, parameters.environment) }}
  - ${{ else }}:
    - name: parametersFile
      value: ${{ format('pipelines/logicapp/parameters.teams-collection.{0}.json', parameters.environment) }}

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    Use1ESOfficial: true
    stages:
      - stage: DeployLogicApp
        displayName: 'Deploy ${{ parameters.workflow }} Logic App (${{ parameters.environment }})'
        jobs:
          - job: Deploy
            displayName: 'ARM Template Deployment'
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            steps:
              - checkout: self
                displayName: 'Checkout repository'

              - task: AzureCLI@2
                displayName: 'Deploy Logic App'
                inputs:
                  azureSubscription: $(SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  workingDirectory: $(workingDirectory)
                  inlineScript: |
                    set -euo pipefail

                    TEMPLATE_FILE="$(templateFile)"
                    PARAMS_FILE="$(parametersFile)"

                    if [[ ! -f "$TEMPLATE_FILE" || ! -f "$PARAMS_FILE" ]]; then
                      echo "Unsupported Logic App configuration: workflow=${{ parameters.workflow }}, environment=${{ parameters.environment }}, parameters=$PARAMS_FILE"
                      exit 1
                    fi

                    echo "Workflow: ${{ parameters.workflow }}"
                    echo "Deploying Logic App to resource group: $(RESOURCE_GROUP)"
                    echo "Template: $TEMPLATE_FILE"
                    echo "Parameters: $PARAMS_FILE"

                    az deployment group create \
                      --resource-group "$(RESOURCE_GROUP)" \
                      --template-file "$TEMPLATE_FILE" \
                      --parameters "@$PARAMS_FILE" \
                      --name "logicapp-${{ parameters.workflow }}-$(Build.BuildId)" \
                      --verbose

                    echo "Logic App deployment completed successfully."
