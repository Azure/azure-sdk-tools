# Manual diagnostic only. No PAT fallback, live MCP, permission changes, or dashboard writes.
trigger: none
pr: none

variables:
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: Diagnose
        jobs:
          - job: CompareMcpStartup
            timeoutInMinutes: 20
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: copilot-app-mcp-controls
                  targetPath: $(Build.SourcesDirectory)/artifacts/mcp-controls
                  condition: always()
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1

              - task: UseNode@1
                inputs:
                  version: 24.x

              - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
                parameters:
                  npmrcPath: $(Build.SourcesDirectory)/.npmrc
                  registryUrl: https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-tools/npm/registry/

              - script: >-
                  npm install @microsoft/vally-cli@0.19.0 --save-exact --package-lock-only --include=optional
                  --ignore-scripts --no-audit --no-fund
                  --userconfig "$(Build.SourcesDirectory)/.npmrc"
                displayName: Restore supported Vally 0.19 evaluator and its pinned SDK bundle
                workingDirectory: eng/common/scripts/eval

              - script: node eng/pipelines/copilot-app-mcp-lock-check.mjs
                displayName: Verify supported evaluator versions and preserve generated metadata

              - script: npm ci --userconfig $(Build.SourcesDirectory)/.npmrc
                displayName: Install normal Vally runner from the updated lock
                workingDirectory: eng/common/scripts/eval

              # Reuse the exact mock binary from the failed production run, not a rebuild.
              - task: DownloadPipelineArtifact@2
                displayName: Download exact failed-run mock MCP artifact
                inputs:
                  buildType: specific
                  project: internal
                  definition: '8255'
                  buildVersionToDownload: specific
                  pipelineId: '6980135'
                  artifactName: mcp-servers
                  targetPath: $(Build.SourcesDirectory)/artifacts/mcp

              - script: node --test eng/pipelines/copilot-app-mcp-probe.test.mjs eng/pipelines/copilot-app-mcp-options.test.mjs eng/pipelines/copilot-app-mcp-versions.test.mjs
                displayName: Test diagnostic assertions offline

              - template: /eng/common/pipelines/templates/steps/login-to-copilot.yml

              # This is the ordinary production runner, without SDK observers or CLI-path overrides.
              - script: >-
                  node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/invoke-eval-shard.ts"
                  --eval-args "-e tools/prompt-to-tool-github.eval.yaml -e tools/prompt-to-tool-apiview.eval.yaml"
                  --shard-name runtime-fix
                  --output-dir "$(Build.SourcesDirectory)/artifacts/vally-results/runtime-fix"
                  --threshold 0.8
                displayName: Verify normal Vally runner against GitHub and APIView MCP evals
                workingDirectory: evals
                env:
                  COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)

              - script: >-
                  node --experimental-strip-types "$(Build.SourcesDirectory)/eng/common/scripts/eval/lib/shard-results.ts"
                  --results-root "$(Build.SourcesDirectory)/artifacts/vally-results/runtime-fix"
                  --output-directory "$(Build.SourcesDirectory)/artifacts/mcp-controls/eval-result"
                  --shard-name runtime-fix --attempt 1
                displayName: Preserve actual eval verdict and completeness
                condition: always()