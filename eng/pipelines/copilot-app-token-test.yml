# Diagnostic for Copilot authentication with a selected-repositories GitHub App installation.
# Use the existing Key Vault signing identity and restrict each token to azure-sdk-tools.

trigger: none

pr: none

jobs:
  - job: TestCopilotAppToken
    pool:
      name: azsdk-pool
      demands: ImageOverride -equals ubuntu-24.04
    steps:
      - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml

      - task: AzureCLI@2
        displayName: Mint organization-read installation token and check permissions
        inputs:
          azureSubscription: 'AzureSDKEngKeyVault Secrets'
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            # Load the script's functions without triggering its normal auto-run at the bottom.
            $env:PESTER_TEST_RUN = 'true'
            . $(Build.SourcesDirectory)/eng/common/scripts/login-to-github.ps1
            Remove-Item Env:\PESTER_TEST_RUN

            $jwt = New-GitHubAppJwt -VaultName "azuresdkengkeyvault" -KeyName "azure-sdk-automation" -AppId "1086291"
            $installationId = Get-GitHubInstallationId -Jwt $jwt -ApiBase "https://api.github.com" -ApiVersion "2022-11-28" -InstallationTokenOwner "Azure"
            Write-Host "Installation ID: $installationId"

            $ghHeaders = @{ Authorization = "Bearer $jwt"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            $installation = Invoke-RestMethod -Uri "https://api.github.com/app/installations/$installationId" -Headers $ghHeaders
            Write-Host "Installation repository_selection: $($installation.repository_selection) (target_type: $($installation.target_type))"
            if ($installation.repository_selection -ne "selected") {
              Write-Host "##vso[task.logissue type=error]Expected the Azure installation to remain limited to selected repositories."
              exit 1
            }
            Write-Host "Installation organization Copilot Requests: $($installation.permissions.organization_copilot_requests)"
            if ($installation.permissions.organization_copilot_requests -ne "read") {
              Write-Host "##vso[task.logissue type=error]Azure installation has not approved organization Copilot Requests: read."
              exit 1
            }

            # Avoid anonymous GitHub rate limits on shared build agents.
            $repoId = 170592186
            Write-Host "Repo ID: $repoId"

            $body = @{ repository_ids = @($repoId); permissions = @{ organization_copilot_requests = "read"; metadata = "read" } } | ConvertTo-Json
            $resp = Invoke-RestMethod -Method Post -Headers $ghHeaders -Uri "https://api.github.com/app/installations/$installationId/access_tokens" -Body $body -ContentType "application/json"

            # Mask immediately - never Write-Host the raw token.
            Write-Host "##vso[task.setvariable variable=ScopedToken;issecret=true]$($resp.token)"

            $grantedPermissions = ($resp.permissions.PSObject.Properties | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ", "
            Write-Host "Granted permissions on minted token: $grantedPermissions"

            if ($resp.permissions.organization_copilot_requests -eq "read") {
              Write-Host "##[section]PASS: organization_copilot_requests=read is present on the minted token."
            } else {
              Write-Host "##vso[task.logissue type=error]FAIL: organization_copilot_requests=read is missing on the minted token."
              exit 1
            }

      - task: AzureCLI@2
        displayName: Test a real Copilot CLI call with the scoped token
        continueOnError: true
        inputs:
          azureSubscription: 'AzureSDKEngKeyVault Secrets'
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            npm install -g @github/copilot
            $env:COPILOT_GITHUB_TOKEN = "$(ScopedToken)"
            copilot --version

            # The CLI wraps every failure into one generic "Authentication failed" message.
            # It has its own debug logging (confirmed via `copilot --help`: --log-level /
            # --log-dir), which is the supported way to see the real HTTP status behind that
            # message - NODE_DEBUG/DEBUG (tried previously) do not surface it.
            $logDir = "$(Agent.TempDirectory)/copilot-debug-logs"
            New-Item -ItemType Directory -Force -Path $logDir | Out-Null

            copilot --log-level debug --log-dir $logDir --yolo -p "Reply with the single word: success" 2>&1 | Tee-Object -Variable copilotOutput
            Write-Host "---"
            Write-Host ($copilotOutput -join "`n")

            Write-Host "##[group]Copilot debug log files"
            $logFiles = Get-ChildItem -Path $logDir -Recurse -File -ErrorAction SilentlyContinue
            if ($logFiles) {
              foreach ($f in $logFiles) {
                Write-Host "===== $($f.FullName) ====="
                Get-Content $f.FullName
              }
            } else {
              Write-Host "##vso[task.logissue type=warning]No debug log files were written to $logDir."
            }
            Write-Host "##[endgroup]"

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:COPILOT_GITHUB_TOKEN) -or -not $env:COPILOT_GITHUB_TOKEN.StartsWith('ghs_')) {
            throw 'A GitHub App installation token was not passed to the SDK task.'
          }
          $env:COPILOT_CLI_PATH = (Get-Command copilot -ErrorAction Stop).Source
          Write-Host "SDK runtime: $env:COPILOT_CLI_PATH"
          $sdkDir = Join-Path "$(Agent.TempDirectory)" 'copilot-sdk-org-read-probe'
          New-Item -ItemType Directory -Force -Path $sdkDir | Out-Null
          npm install --prefix $sdkDir --no-save --no-package-lock @github/copilot-sdk@1.0.16
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the Copilot SDK.' }
          $env:COPILOT_SDK_PROBE_DIR = $sdkDir
          $probe = @'
          const { createRequire } = require('node:module');
          const { join } = require('node:path');
          const fromProbe = createRequire(join(process.env.COPILOT_SDK_PROBE_DIR, 'probe.cjs'));
          const { CopilotClient, RuntimeConnection } = fromProbe('@github/copilot-sdk');
          const timeout = setTimeout(() => { console.error('SDK probe timed out'); process.exit(124); }, 90000);
          timeout.unref();
          const client = new CopilotClient({
            connection: RuntimeConnection.forStdio({ path: process.env.COPILOT_CLI_PATH }),
            env: { ...process.env, COPILOT_GITHUB_TOKEN: process.env.COPILOT_GITHUB_TOKEN },
            useLoggedInUser: false,
          });
          (async () => {
            try {
              const session = await client.createSession({ model: 'auto' });
              const message = await session.sendAndWait({ prompt: 'Reply with the single word: success' }, 60000);
              if (!message?.data?.content) throw new Error('No assistant response received');
              console.log(`SDK response: ${message.data.content}`);
            } finally {
              await client.stop().catch(error => console.error(`SDK cleanup failed: ${error.message}`));
            }
          })().catch(error => { console.error(`SDK probe failed: ${error.message}`); process.exitCode = 1; });
          '@
          node -e $probe
          if ($LASTEXITCODE -ne 0) { throw 'Copilot SDK prompt failed.' }
        displayName: Test SDK prompt with organization-read token
        env:
          COPILOT_GITHUB_TOKEN: $(ScopedToken)
