# Source discussion 105083: typespec_2026_06_05.md
# Expected fixture overlays are reference-only and are never mounted in a trial.

name: azure-typespec-author-eval
description: Exclude unready private preview APIs from the public entry point. Source discussion
  case 105083; needs-review.
version: "1.0"
type: capability
tags:
  area: versioning
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 001018-version-isolate-private-preview-trigger
    tags:
      suite: versioning
      mode: trigger
    prompt: >-
      Widget's public entry includes a private-preview create operation while the other Employee
      operations are stable. Remove the private API version and unready create from the public entry
      and isolate their source in non-imported private-preview.tsp and private-employee.tsp
      candidates. Do not silently promote create to stable; flag the resulting missing ARM lifecycle
      operation for review. The later private preview date must follow the stable date.

      Keep the stable API date 2021-11-01 and isolate the later private date 2024-10-01-preview. The
      private files are non-imported authoring candidates, not an approved release package. Report
      the missing public create operation and required ARM/SDK-team review; do not suppress that
      concern.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: &a1
      files:
        - src: ../fixtures/001018-version-isolate-private-preview/input/main.tsp
          dest: main.tsp
        - src: ../fixtures/001018-version-isolate-private-preview/input/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.cjs
          dest: check-node-dependencies.cjs
        - src: ../scripts/check-discussion-case.mjs
          dest: check-discussion-case.mjs
        - src: ../fixtures/001018-version-isolate-private-preview/contract.json
          dest: discussion-contract.json
      commands:
        - node -e "const fs=require('fs');const
          t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    rubric: &a2
      - The public entry emits stable only and does not expose the unready create operation.
      - Private-preview.tsp must not be imported by main or treated as a releasable SDK entry.
      - Shipping without create requires ARM review and SDK-team coordination; compilation does not
        approve this design.
      - A public entry should not include an API version that must not generate SDKs. The isolated file
        is a labeled, non-imported authoring candidate, not an independently validated preview
        package. The baseline's 2024 preview date is later than its 2021 stable date; no equal-date
        example is legitimized.
      - The source does not establish ARM approval to ship without create. The target demonstrates
        package exclusion, not an approved lifecycle design; the isolated private files are
        candidates, not a separately validated entry point.
      - The runner records expected_outputs; it must contain only stable/2021-11-01/widget.json.
      - Do not claim unexecuted SDK, external lint, or ARM review validation.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - &a3
        type: run-command
        name: fixture-dependencies
        config:
          command: node check-node-dependencies.cjs packages
          expected_exit_code: 0
      - &a4
        type: run-command
        name: compile-typespec
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &a5
        type: run-command
        name: fresh-compiled-contract
        config:
          command: node check-discussion-case.mjs
          expected_exit_code: 0
      - &a6
        type: prompt
        name: semantic-answer-and-limitations
        config:
          prompt: >-
            Evaluate the completed task against the stimulus rubric. Accept semantically equivalent
            valid TypeSpec, not just matching text or comments. Require the actual requested
            wire/version/client-metadata behavior, preservation of unrelated contracts, and the
            scenario's stated qualifications. Reject unsupported claims that compiling TypeSpec or
            AutoRest proves generated SDK behavior, external LintDiff success, or management-plane
            approval.


            Scenario-specific expectations:

            - The public entry emits stable only and does not expose the unready create operation.

            - Private-preview.tsp must not be imported by main or treated as a releasable SDK entry.

            - Shipping without create requires ARM review and SDK-team coordination; compilation
            does not approve this design.

            - A public entry should not include an API version that must not generate SDKs. The
            isolated file is a labeled, non-imported authoring candidate, not an independently
            validated preview package. The baseline's 2024 preview date is later than its 2021
            stable date; no equal-date example is legitimized.

            - The source does not establish ARM approval to ship without create. The target
            demonstrates package exclusion, not an approved lifecycle design; the isolated private
            files are candidates, not a separately validated entry point.

            - The runner records expected_outputs; it must contain only
            stable/2021-11-01/widget.json.

            - Do not claim unexecuted SDK, external lint, or ARM review validation.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.8
    constraints:
      max_turns: 14
      max_tokens: 100000
