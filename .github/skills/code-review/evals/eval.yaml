name: code-review-eval
description: Routing and boundary tests for the azsdk-cli code-review skill
type: capability

# Reviews need no release-management server. Boundary cases add their real
# competing skills and require them, rather than only excluding code-review.
environment:
  skills: [..]

tags:
  area: code-review
  type: ci-gate

defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: trigger-ccr-review-azsdk-cli-pr
    prompt: |
      Run a CCR review of this azsdk-cli PR. Review only this excerpt and do not modify files.

      diff --git a/tools/azsdk-cli/Azure.Sdk.Tools.Cli/Services/WidgetService.cs b/tools/azsdk-cli/Azure.Sdk.Tools.Cli/Services/WidgetService.cs
      - await client.WaitForCompletionAsync(ct).WaitAsync(TimeSpan.FromMinutes(5), ct);
      + await client.WaitForCompletionAsync(ct);
    graders:
      - type: skill-invocation
        config:
          required: [code-review]

  - name: trigger-copilot-review-azsdk-cli-diff
    prompt: |
      Use GitHub Copilot code review on this tools/azsdk-cli diff. Review only this excerpt and do not modify files.

      diff --git a/tools/azsdk-cli/Azure.Sdk.Tools.Cli/Services/WidgetService.cs b/tools/azsdk-cli/Azure.Sdk.Tools.Cli/Services/WidgetService.cs
      - await client.WaitForCompletionAsync(ct).WaitAsync(TimeSpan.FromMinutes(5), ct);
      + await client.WaitForCompletionAsync(ct);
    graders:
      - type: skill-invocation
        config:
          required: [code-review]

  - name: trigger-copilot-review-azsdk-cli
    prompt: |
      Run GitHub Copilot code review for this azsdk-cli change. Review only this excerpt and do not modify files.

      diff --git a/tools/azsdk-cli/Azure.Sdk.Tools.Cli/Services/WidgetService.cs b/tools/azsdk-cli/Azure.Sdk.Tools.Cli/Services/WidgetService.cs
      - await client.WaitForCompletionAsync(ct).WaitAsync(TimeSpan.FromMinutes(5), ct);
      + await client.WaitForCompletionAsync(ct);
    graders:
      - type: skill-invocation
        config:
          required: [code-review]

  - name: anti-trigger-implement-azsdk-cli-tool
    prompt: "I need to implement a new azsdk-cli command for package validation. Identify the repository workflow that applies; do not inspect or modify files."
    graders:
      - type: skill-invocation
        config:
          disallowed: [code-review]

  - name: anti-trigger-fix-azsdk-cli-pipeline
    prompt: "I need to fix a failing build for tools/azsdk-cli. Identify the repository workflow that applies; do not inspect or modify files."
    graders:
      - type: skill-invocation
        config:
          disallowed: [code-review]

  - name: anti-trigger-fix-sdk-pipeline
    prompt: "Which Agent Skill handles fixing failing SDK CI tests for the Python package sdk/storage/azure-storage-blob in azure-sdk-for-python? Select and load the applicable skill, then stop. This is skill routing only: use read-only skill-instruction tools, not shell commands, checkout searches, source inspection, MCP calls, or code changes."
    environment:
      skills: [../../azsdk-common-pipeline-fixer]
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-pipeline-fixer]
          disallowed: [code-review]

  - name: anti-trigger-fix-generated-sdk-analyzers
    prompt: "Which Agent Skill handles fixing AZC0030 analyzer errors in a locally generated .NET SDK, sdk/storage/Azure.Storage.Blobs in azure-sdk-for-net? Select and load the applicable customization/validation skill, then stop. This is skill routing only: use read-only skill-instruction tools, not shell commands, checkout searches, source inspection, MCP calls, or code changes."
    environment:
      skills: [../../azsdk-common-generate-sdk-locally]
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-generate-sdk-locally]
          disallowed: [code-review]

  # Handwritten CLI implementation/analyzers have no dedicated competing skill
  # here. These are exclusions, not evidence of SDK pipeline/customization routing.
  - name: anti-trigger-run-azsdk-cli-analyzers
    prompt: "I need to run the MCP001-MCP007 analyzers on handwritten tools/azsdk-cli code and fix their errors. Identify the repository workflow that applies; do not inspect or modify files."
    graders:
      - type: skill-invocation
        config:
          disallowed: [code-review]

  - name: anti-trigger-review-unrelated-tool
    prompt: "I need a regression review of tools/release-plan-dashboard. Identify the repository workflow that applies; do not inspect or modify files."
    graders:
      - type: skill-invocation
        config:
          disallowed: [code-review]
