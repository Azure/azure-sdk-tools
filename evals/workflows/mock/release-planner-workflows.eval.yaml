name: azsdk-mcp-tool-scenarios
description: |
  Mock-environment workflow scenarios derived from the release-planner
  replacement test plan (#15835). Each stimulus mirrors one of the four
  high-level scenarios that release-planner-dashboard must hand off to the
  agent:

    1. Create a release plan (private preview / public preview / GA)
    2. Generate SDK for all languages in an existing release plan
    3. Link a different spec PR to an existing release plan
    4. Update SDK details (package names) in a release plan

  Configuration flows verify preview, explicit confirmation, and saved-target
  readback without depending on changes to generation. Existing generation
  routing scenarios remain separate.

  Bound to the canned mock MCP — graders inspect routing, arguments, and
  returned target data, not real DevOps writes or a stateful store. The live e2e flow lives in
  workflows/live/release-planner.eval.yaml.

version: "1.0"
type: capability

tags:
  area: release-plan

environment: azsdk-mcp-mock

defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.4
  executor: copilot-sdk

stimuli:
  # --- Scenario 1: Create release plan ---------------------------------
  # Intent, details, then approval. Create owns reuse; no preliminary lookup is required.
  - name: create-public-preview-release-plan
    tags:
      feature: target-confirmation
    # Spec-repo worktree fixture: defined once here and aliased by the stimuli
    # below. CI clones it via eng/common/scripts/eval/init-eval-git-fixtures.js before this suite.
    environment: &specsWorktree
      # Load the real release-planning skill so the executor can route to it.
      # Path is relative to this eval file (3 levels up = repo root).
      skills:
        - ../../../.github/skills/azsdk-common-prepare-release-plan
      git:
        type: worktree
        source: ../../../artifacts/specs-cache/azure-rest-api-specs
        ref: main
    turns:
      - |
        Create a public preview release plan for the Contoso Widget Manager.
      - |
        Here are the details:
          - TypeSpec project: "specification/contosowidgetmanager/Contoso.WidgetManager"
          - service tree ID: "a7f2b8e4-9c1d-4a3e-b6f9-2d8e5a7c3b1f"
          - product tree ID: "f1a8c5d2-6e4b-4f7a-9c2d-8b5e1f3a6c9e"
          - target release timeline: "December 2026"
          - API version: "2024-01-01"
          - SDK release type: "beta"
          - spec pull request: "https://github.com/Azure/azure-rest-api-specs/pull/38387"
        The local fixture checkout is ready. Preview the target; do not save it yet.
      - |
        I approve the previewed project, packages, API version 2024-01-01,
        beta SDK type, PR 38387, and SHA 0123456789abcdef0123456789abcdef01234567.
        Confirm creation with the same month and service/product IDs. Do not generate SDKs.
    constraints:
      max_turns: 14
      max_tokens: 16000
      max_duration: 8m
    rubric:
      - Before approval, return a no-write preview of the Contoso project, packages, API 2024-01-01, beta SDK type, PR 38387, and SHA 0123456789abcdef0123456789abcdef01234567; do not confirm or generate SDKs.
      - After approval, confirm creation with the approved SHA and inputs using confirmTarget=true, and receive a successful non-preview response. An omitted API version is valid when metadata selects the approved version.
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-prepare-release-plan
      - type: tool-calls
        config:
          required:
            - azsdk_create_release_plan
          disallowed:
            - azsdk_run_generate_sdk
            - azsdk_package_generate_code
            - azsdk_release_sdk
            - name: '^azure-sdk-mcp-azsdk_create_release_plan$'
              pattern: '"(?:sdkReleaseType|expectedTargetRevision|forceCreateReleasePlan)"\s*:'
      - type: tool-calls
        turn: 2
        config:
          required:
            - name: '^azure-sdk-mcp-azsdk_create_release_plan$'
              pattern: '"confirmTarget"\s*:\s*true'
              args:
                specCommitSha: '^0123456789abcdef0123456789abcdef01234567$'
                apiReleaseType: '^Public Preview$'
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Require a no-write create preview before the third user prompt and
            a successful confirmed creation afterward, not just narration.
            Confirmation must carry confirmTarget=true and the approved SHA,
            preserve the PR, project, December 2026 and service/product IDs,
            and use Public Preview. API version may be omitted if metadata
            selects 2024-01-01; any explicit version must match it.
            Missing tool-call/result evidence fails. Decode JSON inside MCP results;
            requires_confirmation is omitted when false.
            Forbidden create arguments are checked separately by deterministic
            graders against the complete arguments. Do not recheck their absence
            from truncated judge evidence or confuse the derived SDKReleaseType
            in a returned target with a caller argument.

  # Configuration-only replacement for the former create-and-generate demo.
  - name: preview-confirm-and-read-release-plan
    tags:
      feature: target-confirmation
    environment: *specsWorktree
    turns:
      - |
        Create a public preview release plan for the Contoso Widget Manager:
          - TypeSpec project: "specification/contosowidgetmanager/Contoso.WidgetManager"
          - service tree ID: "a7f2b8e4-9c1d-4a3e-b6f9-2d8e5a7c3b1f"
          - product tree ID: "f1a8c5d2-6e4b-4f7a-9c2d-8b5e1f3a6c9e"
          - target release timeline: "December 2026"
          - API version: "2024-01-01"
          - SDK release type: "beta"
          - spec pull request: "https://github.com/Azure/azure-rest-api-specs/pull/12345"
        The local fixture checkout is ready. Show the preview and ask for approval.
      - |
        I approve that target and its packages: API 2024-01-01, beta SDK type,
        PR 12345, SHA 0123456789abcdef0123456789abcdef01234567. Save it with the
        same month and service/product IDs. Do not generate SDKs.
      - |
        Read the saved plan using its returned ID and report its project,
        API version, SDK type, spec PR and stored SHA. Do not update or generate anything.
    constraints:
      max_turns: 16
      max_tokens: 18000
      max_duration: 8m
    rubric:
      - Preview without writing, then confirm only after approval using the Contoso project, API 2024-01-01, beta SDK type, PR 12345, SHA 0123456789abcdef0123456789abcdef01234567 and unchanged month/service/product IDs.
      - Read the confirmed plan by returned work item 35000 or release plan 50001 and report matching saved target values. Do not generate or publish SDKs or treat a preview as a saved plan.
    graders:
      # Turn 0 — preview only.
      - type: skill-invocation
        turn: 0
        config:
          required:
            - azsdk-common-prepare-release-plan
      - type: tool-calls
        turn: 0
        config:
          required:
            - azsdk_create_release_plan
      # Turn 1 — confirm only.
      - type: tool-calls
        turn: 1
        config:
          required:
            - azsdk_create_release_plan
      # Turn 2 — read back the same fixed fixture identity.
      - type: tool-calls
        turn: 2
        config:
          required:
            - azsdk_get_release_plan
          disallowed:
            - azsdk_create_release_plan
            - azsdk_update_release_plan
            - azsdk_update_api_spec_pull_request_in_release_plan
      - type: tool-calls
        config:
          disallowed:
            - azsdk_run_generate_sdk
            - azsdk_package_generate_code
            - azsdk_release_sdk
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Require preview before approval, successful creation with
            confirmTarget=true and SHA 0123456789abcdef0123456789abcdef01234567
            only after approval, then get using returned WorkItemId 35000 or
            ReleasePlanId 50001. The saved response and final answer must agree
            on the Contoso project, API 2024-01-01, beta, PR 12345 and that SHA.
            Do not accept a different ID or a claim of creation from a preview.
            No generation or publishing may occur. An omitted requires_confirmation
            on success is valid; decode JSON results. This verifies the canned
            save/read contract, not actual persistence. Missing evidence fails.

  # --- Scenario 2: Generate SDK for an existing release plan -----------
  - name: generate-sdk-for-existing-release-plan
    environment: *specsWorktree
    prompt: |
      Using the release-planner
      flow, generate SDK for all languages for the Contoso Widget Manager
      release plan. Here is the context you need:
        - release plan work item ID: "29262"
        - TypeSpec project: "specification/contosowidgetmanager/Contoso.WidgetManager"
    constraints:
      max_turns: 8
      max_tokens: 10000
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-prepare-release-plan
          # azsdk_run_generate_sdk is a release-planner pipeline tool; the
          # generate-sdk-locally skill over-matches "generate" — see
          # https://github.com/Azure/azure-sdk-tools/issues/15950.
          disallowed:
            - azsdk-common-generate-sdk-locally
      - type: tool-calls
        config:
          required:
            - azsdk_get_release_plan
            - azsdk_run_generate_sdk
          disallowed:
            - azsdk_create_release_plan

  # --- Scenario 3: Link a different spec PR to an existing release plan
  - name: link-different-spec-pr-to-release-plan
    tags:
      feature: target-confirmation
    environment: *specsWorktree
    turns:
      - |
        Preview a spec-link update for Contoso Widget Manager work item 35000:
        PR https://github.com/Azure/azure-rest-api-specs/pull/38387 and local project
        specification/contosowidgetmanager/Contoso.WidgetManager. The fixture
        checkout is ready. Show the target and ask before saving anything.
      - |
        I approve the target: API 2024-01-01, beta, PR 38387 and SHA
        0123456789abcdef0123456789abcdef01234567. Confirm for work item 35000
        using the original preview revision verbatim. Do not generate SDKs.
    constraints:
      max_turns: 12
      max_tokens: 14000
      max_duration: 8m
    rubric:
      - Preview the link for work item 35000, Contoso project, PR 38387, API 2024-01-01, beta and SHA 0123456789abcdef0123456789abcdef01234567 without writing before approval.
      - Confirm after approval with the exact SHA and original preview revision 35000:1:45000:1; require a successful saved response, no refreshed precondition, generation or publishing.
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-prepare-release-plan
      - type: tool-calls
        config:
          required:
            - azsdk_update_api_spec_pull_request_in_release_plan
          disallowed:
            - azsdk_create_release_plan
            - azsdk_run_generate_sdk
            - azsdk_package_generate_code
            - azsdk_release_sdk
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Require a no-write link preview, then a successful confirmation only
            after the second user prompt. It must use work item 35000, the same
            Contoso project and PR 38387, approved SHA
            0123456789abcdef0123456789abcdef01234567, confirmTarget=true, and
            expectedTargetRevision 35000:1:45000:1 copied from the original
            preview. API may be omitted if metadata selects 2024-01-01.
            Never refresh or invent the revision to bypass a conflict. Missing
            tool-call/result evidence fails; narration alone is insufficient.

  - name: update-release-target-with-metadata-derived-version
    tags:
      feature: target-confirmation
    environment: *specsWorktree
    turns:
      - |
        Preview the SDK target update for Contoso Widget Manager work item 35000,
        local project specification/contosowidgetmanager/Contoso.WidgetManager,
        PR https://github.com/Azure/azure-rest-api-specs/pull/12345, SDK type beta.
        The fixture checkout is ready. Derive the API version from metadata and
        ask me before saving anything.
      - |
        I approve the previewed project, packages, API 2024-01-01, beta, PR 12345,
        and SHA 0123456789abcdef0123456789abcdef01234567. Confirm using the
        original revision token. Do not generate SDKs.
    constraints:
      max_turns: 12
      max_tokens: 14000
      max_duration: 8m
    rubric:
      - Preview the target for work item 35000 and the Contoso project/PR 12345, deriving API 2024-01-01 from metadata without a confirmed write.
      - After approval, confirm with beta, SHA 0123456789abcdef0123456789abcdef01234567 and the original revision 35000:1:45000:1. Require a saved non-preview response and no generation or publishing.
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-prepare-release-plan
      - type: tool-calls
        config:
          required:
            - azsdk_update_release_plan
          disallowed:
            - azsdk_create_release_plan
            - azsdk_run_generate_sdk
            - azsdk_package_generate_code
            - azsdk_release_sdk
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Require a metadata-derived target preview before approval and a
            successful update afterward with work item 35000, the same project,
            PR 12345, sdkReleaseType beta, confirmTarget=true, approved SHA
            0123456789abcdef0123456789abcdef01234567 and expectedTargetRevision
            35000:1:45000:1 from that preview. Omitted apiVersion is correct;
            any explicit version must be 2024-01-01. Missing evidence fails.

  # --- Scenario 4: Update SDK details (package names) ------------------
  - name: update-sdk-details-in-release-plan
    environment: *specsWorktree
    prompt: |
      Using the release-planner
      flow, refresh the SDK package-name details on an existing Contoso
      Widget Manager release plan from the on-disk TypeSpec emitter
      configuration. Here is the context you need:
        - release plan work item ID: "29262"
        - TypeSpec project: "specification/contosowidgetmanager/Contoso.WidgetManager"
        - tspconfig path: "specification/contosowidgetmanager/Contoso.WidgetManager/tspconfig.yaml"
    constraints:
      max_turns: 8
      max_tokens: 10000
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-prepare-release-plan
      - type: tool-calls
        config:
          required:
            - azsdk_update_sdk_details_in_release_plan
          disallowed:
            - azsdk_create_release_plan

  # --- Scenario 5: Generate SDK for all languages + link to release plan (issue #16072)
  # Regression for https://github.com/Azure/azure-sdk-tools/issues/16072. A natural
  # "Generate SDK for all languages ... and link SDK pull requests to the release plan"
  # prompt (without the explicit "release-planner flow" hint) previously routed to
  # azsdk_get_sdk_pull_request_link instead of running generation. The correct path is
  # azsdk_get_release_plan -> azsdk_run_generate_sdk. The generate-sdk-locally skill may
  # be invoked as long as it redirects to azsdk_run_generate_sdk.
  # NOTE: this prompt explicitly asks to *link* SDK PRs, so retrieving PR links
  # (azsdk_get_sdk_pull_request_link / azsdk_get_pull_request) is legitimate here and is
  # NOT disallowed. The "must not substitute PR-link tools for generation" assertion is
  # enforced by the generation-only stimulus below.
  - name: generate-sdk-all-languages-link-release-plan
    environment: &specsWorktreeWithGenerate
      skills:
        - ../../../.github/skills/azsdk-common-prepare-release-plan
        - ../../../.github/skills/azsdk-common-generate-sdk-pipeline
        - ../../../.github/skills/azsdk-common-generate-sdk-locally
      git:
        type: worktree
        source: ../../../artifacts/specs-cache/azure-rest-api-specs
        ref: main
    prompt: |
      Generate SDK for all languages from my TypeSpec project
      specification/contosowidgetmanager/Contoso.WidgetManager and link the SDK
      pull requests to the release plan. Here is the context you need:
        - release plan work item ID: "29262"
    constraints:
      max_turns: 8
      max_tokens: 12000
    graders:
      - type: tool-calls
        config:
          required:
            - azsdk_get_release_plan
            - azsdk_run_generate_sdk

  # --- Scenario 6: Vague "generate SDK for all languages" must not grab PR-link tool
  # Second regression prompt from issue #16072. With minimal context the agent must head
  # toward pipeline generation (or ask for the missing release plan) and must never
  # substitute azsdk_get_sdk_pull_request_link / azsdk_get_pull_request for generation.
  - name: generate-sdk-all-languages-no-wrong-pr-tool
    environment: *specsWorktreeWithGenerate
    prompt: |
      Generate SDK for all languages from my TypeSpec project
      specification/contosowidgetmanager/Contoso.WidgetManager.
    constraints:
      max_turns: 6
      max_tokens: 10000
    graders:
      - type: tool-calls
        config:
          disallowed:
            - azsdk_get_sdk_pull_request_link
            - azsdk_get_pull_request

  # --- Scenario 7: Pipeline SDK generation skill routing (issue #16226)
  # Regression for https://github.com/Azure/azure-sdk-tools/issues/16226. The prompt
  # "Run SDK generation for all languages for release <id>" previously routed to the
  # wrong tools (azsdk_release_sdk, azsdk_get_pipeline_llm_artifacts,
  # azsdk_get_service_details_by_typespec_path) and never reached azsdk_run_generate_sdk.
  # The dedicated azsdk-common-generate-sdk-pipeline skill routes such prompts to the
  # pipeline path: azsdk_get_release_plan -> azsdk_run_generate_sdk (once per language).
  # The competing generate-sdk-locally and sdk-release skills are loaded too so the
  # routing choice is real; neither should be invoked and azsdk_release_sdk (which
  # publishes, not generates) must never be called.
  - name: run-sdk-generation-all-languages-for-release-pipeline-skill
    environment: &bothGenerateSkills
      skills:
        - ../../../.github/skills/azsdk-common-generate-sdk-pipeline
        - ../../../.github/skills/azsdk-common-generate-sdk-locally
        - ../../../.github/skills/azsdk-common-sdk-release
      git:
        type: worktree
        source: ../../../artifacts/specs-cache/azure-rest-api-specs
        ref: main
      files:
        - src: ../../fixtures/README.md
          dest: sdk/contosowidgetmanager/azure-contoso-widgetmanager/README.md
    prompt: |
      Run SDK generation for all languages for release 29262. My TypeSpec project is
      specification/contosowidgetmanager/Contoso.WidgetManager.
    constraints:
      max_turns: 8
      max_tokens: 12000
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-generate-sdk-pipeline
          disallowed:
            - azsdk-common-generate-sdk-locally
            - azsdk-common-sdk-release
      - type: tool-calls
        config:
          required:
            - azsdk_get_release_plan
            - azsdk_run_generate_sdk
          disallowed:
            - azsdk_release_sdk
            - azsdk_get_pipeline_llm_artifacts
            - azsdk_get_service_details_by_typespec_path

  # --- Scenario 8: LOCAL routing must NOT cross to the pipeline (#16226)
  # Counterpart to scenario 7: a clearly-local single-language request must route
  # to the local skill and never call the pipeline tool. Both generate skills are
  # loaded (via &bothGenerateSkills) so the local-vs-pipeline choice is contested.
  - name: local-single-language-routes-to-local
    environment: *bothGenerateSkills
    prompt: |
      I have the azure-rest-api-specs repo cloned locally. Generate the Python SDK
      for the Contoso Widget Manager from
      specification/contosowidgetmanager/Contoso.WidgetManager/tspconfig.yaml, then
      build it and run the checks locally. My local azure-sdk-for-python target
      package is at sdk/contosowidgetmanager/azure-contoso-widgetmanager.
    constraints:
      max_turns: 8
      max_tokens: 12000
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-generate-sdk-locally
          disallowed:
            - azsdk-common-generate-sdk-pipeline
      - type: tool-calls
        config:
          required:
            - azsdk_package_generate_code
          disallowed:
            - azsdk_run_generate_sdk
            - azsdk_release_sdk

  # --- Scenario 9: LOCAL routing on a build-failure / fix request (#16226)
  - name: local-build-fix-routes-to-local
    environment: *bothGenerateSkills
    prompt: |
      My local Java SDK build for the Contoso Widget Manager is failing after I
      regenerated it. Regenerate and build it again from
      specification/contosowidgetmanager/Contoso.WidgetManager/tspconfig.yaml and
      fix the build errors.
    constraints:
      max_turns: 8
      max_tokens: 12000
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-generate-sdk-locally
          disallowed:
            - azsdk-common-generate-sdk-pipeline
      - type: tool-calls
        config:
          disallowed:
            - azsdk_run_generate_sdk
            - azsdk_release_sdk

  # --- Scenario 10: PIPELINE routing via "no clone / open the PRs" phrasing (#16226)
  - name: pipeline-release-plan-open-prs-routes-to-pipeline
    environment: *bothGenerateSkills
    prompt: |
      I don't have any SDK repos cloned. Generate the SDK for the Contoso Widget
      Manager release plan (work item 29262) and open the SDK pull requests for me.
    constraints:
      max_turns: 8
      max_tokens: 12000
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-generate-sdk-pipeline
          disallowed:
            - azsdk-common-generate-sdk-locally
      - type: tool-calls
        config:
          required:
            - azsdk_run_generate_sdk
          disallowed:
            - azsdk_release_sdk
            - azsdk_package_generate_code

  # --- Scenario 11: PRIVATE PREVIEW release plans cannot generate via pipeline (#16226)
  # The azsdk-common-generate-sdk-pipeline skill documents that private preview release
  # plans cannot generate SDKs through the pipeline — only the API spec PR needs to merge
  # (validation, if needed, is done via local generation). So an "all languages for my
  # private preview release plan" request must route to the pipeline skill (where the rule
  # lives) but must NOT actually invoke the pipeline generation tool azsdk_run_generate_sdk.
  # Both generate skills are loaded so the routing choice is real.
  - name: private-preview-release-plan-no-pipeline-generation
    environment: *bothGenerateSkills
    prompt: |
      Generate the SDK for all languages for my private preview release plan
      (work item 29262) for the Contoso Widget Manager.
    constraints:
      max_turns: 8
      max_tokens: 12000
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-generate-sdk-pipeline
      - type: tool-calls
        config:
          disallowed:
            - azsdk_run_generate_sdk
            - azsdk_release_sdk

scoring:
  weights:
    skill-invocation: 0.3
    tool-calls: 0.3
    prompt: 0.4
  threshold: 0.8
