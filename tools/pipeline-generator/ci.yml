# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - tools/pipeline-generator
      - eng/scripts/Initialize-PostMergeSdk.ps1
      - eng/scripts/tests/Initialize-PostMergeSdk.Tests.ps1
      - eng/pipelines/pipeline-generation-post-merge.yml

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - tools/pipeline-generator
      - eng/scripts/Initialize-PostMergeSdk.ps1
      - eng/scripts/tests/Initialize-PostMergeSdk.Tests.ps1
      - eng/pipelines/pipeline-generation-post-merge.yml

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-tool-dotnet.yml
  parameters:
    ToolDirectory: tools/pipeline-generator
    TestPostSteps:
      - template: /eng/common/pipelines/templates/steps/run-pester-tests.yml
        parameters:
          TargetDirectory: eng/scripts/tests
          CustomTestSteps:
            - pwsh: Invoke-Pester -Path Initialize-PostMergeSdk.Tests.ps1 -CI
              displayName: Test trusted SDK checkout step
              workingDirectory: $(Build.SourcesDirectory)/eng/scripts/tests
