name: typespec-naming-handoffs
description: Authoring and assessment consume one naming skill without review mutations
type: capability
environment:
  skills:
    - ../../../.github/skills/azure-typespec-author
    - ../../../.github/skills/azure-typespec-assessment
    - ../../../.github/skills/azsdk-common-typespec-naming
  files:
    - src: ../../../.github/skills/azsdk-common-typespec-naming/evals/fixtures/customization-mcp.mjs
      dest: customization-mcp.mjs
    - src: ../../../.github/skills/azure-typespec-assessment/scripts/agent-decisions.schema.json
      dest: agent-decisions.schema.json
  mcpServers:
    azure-sdk-mcp:
      type: stdio
      command: node
      args: ["customization-mcp.mjs"]
tags:
  area: typespec-naming
  tier: scenario
defaults:
  model: gpt-5.4
  executor: copilot-sdk
  runs: 1
  timeout: "180s"
scoring:
  threshold: 1.0
stimuli:
  - name: authoring-consults-shared-guidance
    prompt: |
      Invoke azure-typespec-author and plan only the SDK naming part of this authoring request.
      Confirmed intake: new never-shipped C# ARM Widget service, first version
      2026-01-01-preview, specification/widget/resource-manager/Microsoft.Widget/main.tsp.
      Add enabled: boolean to WidgetProperties. Use the skill's prescribed naming workflow.
      Read the selected C# member profile and return its recommended SDK name, not merely
      a PascalCase form of the wire name.
      These are all needed facts; do not inspect benchmark fixtures, fetch docs, edit,
      compile or generate. Return JSON "sdkName", "wireName", and "applied".
    constraints: &bounded
      max_turns: 14
      max_tokens: 18000
    graders:
      - type: skill-invocation
        config:
          required: [azure-typespec-author, azsdk-common-typespec-naming]
          disallowed: [azure-typespec-assessment]
      - &readOnly
        type: tool-calls
        config:
          disallowed:
            - name: "azsdk_"
            - name: "^(edit|create|apply_patch|task|web_fetch|web_search)$"
      - type: output-matches
        config:
          pattern: '"sdkName"\s*:\s*"IsEnabled"'
      - type: output-matches
        config:
          pattern: '"wireName"\s*:\s*"enabled"'
      - &notApplied
        type: output-matches
        config:
          pattern: '"applied"\s*:\s*false'

  - name: assessment-consults-same-guidance-readonly
    tags:
      case: assessment-report
    prompt: |
      Invoke azure-typespec-assessment and plan the sdkNamingReview value for the main
      assessment report using the skill's prescribed naming workflow. This is planning,
      not a fresh full assessment;
      the assessment orchestrator must invoke azsdk-common-typespec-naming rather
      than reproduce naming rules. Read the mounted agent-decisions.schema.json, then
      read the naming skill's selected references after invocation. Do not run preparation,
      materialization, report serving or other assessment scripts.
      Confirmed bounded evidence: baseline origin/main, new unshipped C# ARM Widget SDK,
      added WidgetProperties.enabled boolean, emitted C# name Enabled, no clientName override.
      Only inspect bundled skill guidance and these facts. Do not fetch docs, edit, compile
      or generate, even though a customization tool is available. Return JSON with a
      top-level "sdkNamingReview" object conforming to the compact decision contract.
      Adapt the naming handoff to the schema-defined field names, including coverage
      rationale and finding decision and verification; do not add or rename fields.
      Explain that materialization places it in assessment.json and assessment.html.
      The existing files are outside this bounded task; do not modify them or fabricate
      a served report link.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azure-typespec-assessment, azsdk-common-typespec-naming]
          disallowed: [azure-typespec-author]
      - *readOnly
      - type: tool-calls
        config:
          required:
            - name: "^(view|powershell|rg)$"
              pattern: "agent-decisions.schema.json"
              result: "sdkNamingReview"
          disallowed:
            - name: "azsdk_"
            - name: "^(edit|create|apply_patch|web_fetch|web_search)$"
      - type: output-matches
        config:
          pattern: '"sdkNamingReview"\s*:'
      - type: output-matches
        config:
          pattern: '(?is)WidgetProperties\.enabled[\s\S]{0,400}IsEnabled'
      - type: output-matches
        config:
          pattern: '(?is)(coverage|profile)[\s\S]{0,100}(C#|csharp|\.NET)[\s\S]{0,30}ARM'
      - type: output-matches
        config:
          pattern: '(?is)"languageScope"\s*:\s*"csharp"'
      - type: output-matches
        config:
          pattern: "(?is)unshipped|never.shipped"
      - type: output-matches
        config:
          pattern: '(?is)"decision"\s*:\s*"recommend"'
      - type: output-matches
        config:
          pattern: '(?is)"verification"\s*:\s*"supplied-generated"'
      - type: output-matches
        config:
          pattern: '(?is)assessment\.json[\s\S]{0,120}assessment\.html|assessment\.html[\s\S]{0,120}assessment\.json'
      - type: output-not-matches
        config:
          pattern: "(?is)separate from (?:the )?(?:main )?assessment report|does not include"

  - name: assessment-reports-unsupported-profile
    tags:
      case: assessment-report
    prompt: |
      Invoke azure-typespec-assessment for the sdkNamingReview value used by the main
      assessment report only,
      not preparation or a fresh full assessment. Bounded evidence: a new unshipped
      Java-only ARM Widget SDK adds WidgetProperties.enabled: boolean. No generated
      Java API evidence or Java-specific naming guide is supplied.
      Because Java ARM is confirmed but has no applicable bundled profile, coverage is
      not-covered; keep missing generated or compatibility evidence in blockers rather
      than changing that coverage status.
      The assessment orchestrator must invoke azsdk-common-typespec-naming rather
      than reproduce naming rules. Read agent-decisions.schema.json, then read the
      naming skill's dispatcher after invocation before returning the compact object.
      Use bundled guidance and these facts only. Do not inspect repository files,
      fetch docs, edit, compile, or generate; a customization tool being available
      does not authorize its use. Return JSON with top-level "sdkNamingReview",
      including coverage and string blockers that explain verification limits.
      Adapt the naming handoff to the schema-defined field names; coverage must use
      rationale and must not add or rename fields.
      Mention materialization into the SDK Naming report dimension in the summary.
      The main report files are outside this task; do not create or modify them.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azure-typespec-assessment, azsdk-common-typespec-naming]
          disallowed: [azure-typespec-author]
      - *readOnly
      - type: tool-calls
        config:
          required:
            - name: "^(view|powershell|rg)$"
              pattern: "agent-decisions.schema.json"
              result: "sdkNamingReview"
          disallowed:
            - name: "azsdk_"
            - name: "^(edit|create|apply_patch|web_fetch|web_search)$"
      - type: output-matches
        config:
          pattern: '"sdkNamingReview"\s*:'
      - type: output-matches
        config:
          pattern: '(?is)(Java[\s\S]{0,300}"status"\s*:\s*"not-covered"|"status"\s*:\s*"not-covered"[\s\S]{0,300}Java)'
      - type: output-not-matches
        config:
          pattern: "IsEnabled|@@clientName"
      - type: output-matches
        config:
          pattern: "(?is)unverified|not (?:generated|verified)|no generated"
      - type: output-not-matches
        config:
          pattern: "verificationLimits|reportDimension|namingSkillHandoff"

  - name: assessment-reports-missing-naming-evidence
    tags:
      case: assessment-report
    prompt: |
      Invoke azure-typespec-assessment for a bounded review of its naming coverage
      reporting in the main assessment dimension, not preparation or a fresh full
      assessment. SDK naming was explicitly
      requested for a new WidgetProperties.enabled: boolean. The supplied evidence
      does not identify any SDK language or whether the service is ARM or data-plane.
      No generated or released API is available. Do not infer C# from the name Widget.
      Consult bundled guidance only; no scanning, network, edits, compilation,
      generation or interactive questions. Return JSON with top-level
      "sdkNamingReview", with the missing context recorded as not-assessed coverage.
      The assessment orchestrator must invoke azsdk-common-typespec-naming rather
      than reproduce naming rules. Read agent-decisions.schema.json, then read the
      naming skill's dispatcher after invocation before returning the compact object.
      Adapt the naming handoff to the schema-defined field names; coverage must use
      rationale and must not add or rename fields.
      Mention materialization into the SDK Naming report dimension in the summary.
      Do not modify the main assessment files.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azure-typespec-assessment, azsdk-common-typespec-naming]
          disallowed: [azure-typespec-author]
      - *readOnly
      - type: tool-calls
        config:
          required:
            - name: "^(view|powershell|rg)$"
              pattern: "agent-decisions.schema.json"
              result: "sdkNamingReview"
          disallowed:
            - name: "azsdk_"
            - name: "^(edit|create|apply_patch|web_fetch|web_search)$"
      - type: output-matches
        config:
          pattern: '"sdkNamingReview"\s*:'
      - type: output-matches
        config:
          pattern: "(?is)not.assessed"
      - type: output-matches
        config:
          pattern: '(?is)"coverage"\s*:\s*\[[\s\S]{0,300}"language"\s*:\s*"unknown"[\s\S]{0,300}"serviceType"\s*:\s*"unknown"[\s\S]{0,300}"status"\s*:\s*"not-assessed"'
      - type: output-not-matches
        config:
          pattern: "IsEnabled|@@clientName"
      - type: output-not-matches
        config:
          pattern: "reportDimension|requestScope|namingSkillHandoff|missingContext"

  - name: unrelated-authoring-does-not-require-sdk-intake
    prompt: |
      Invoke azure-typespec-author. Plan only a documentation edit: add the supplied
      description "Whether the widget is enabled." to WidgetProperties.enabled in
      specification/widget/resource-manager/Microsoft.Widget/main.tsp, version 2026-01-01.
      The property and all names already exist and must remain unchanged.
      No SDK targets are known. No SDK naming is requested. Do not fetch docs, run tools,
      or edit files; consult bundled skill guidance only.
      Return JSON "sdkLanguageRequired" and "namingChangesPlanned" booleans.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azure-typespec-author]
          disallowed: [azsdk-common-typespec-naming, azure-typespec-assessment]
      - type: tool-calls
        config:
          disallowed:
            - name: "azsdk_"
            - name: "^(edit|create|apply_patch|web_fetch|web_search)$"
      - type: output-matches
        config:
          pattern: '"sdkLanguageRequired"\s*:\s*false'
      - type: output-matches
        config:
          pattern: '"namingChangesPlanned"\s*:\s*false'
