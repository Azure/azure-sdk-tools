# Source discussion 104026: typespec_2026_02_06.md
# Expected fixture overlays are reference-only and are never mounted in a trial.

name: azure-typespec-author-eval
description: Route a legacy resource without changing its nonstandard JSON envelope. Source
  discussion case 104026; ready.
version: "1.0"
type: capability
tags:
  area: armtemplate
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 002012-ARM-legacy-custom-resource-trigger
    tags:
      suite: armtemplate
      mode: trigger
    prompt: >-
      Employee is a legacy resource whose JSON contains only optional someId and someOtherProperty,
      with no standard id/name/type envelope. The input applies Legacy.customAzureResource directly
      and cannot use the standard read/list templates without a resource key. Use
      Legacy.CustomAzureResource and add ResourceNameParameter<Employee> for routing only. Do not
      make the legacy JSON fields required or add a name field to the emitted payload.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: &a1
      files:
        - src: ../fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../fixtures/002012-ARM-legacy-custom-resource/input/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.cjs
          dest: check-node-dependencies.cjs
        - src: ../scripts/check-discussion-case.mjs
          dest: check-discussion-case.mjs
        - src: ../fixtures/002012-ARM-legacy-custom-resource/contract.json
          dest: discussion-contract.json
      commands:
        - node -e "const fs=require('fs');const
          t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    rubric: &a2
      - The route has a required employeeName parameter.
      - Only the legacy optional fields appear in the resource payload.
      - No common Resource base or required payload field is added.
      - CustomAzureResource carries includeInapplicableMetadataInPayload(false), so the required route
        name does not become a required JSON field. The keyless input's standard read and list both
        resolve to the provider root, reproducing duplicate-operation errors rather than a dedicated
        missing-name diagnostic in this toolchain. This is the source's standard-template
        workaround, not a reason to require an optional legacy payload property.
        LegacyOperations/RoutedOperations can instead take keys separately, but are not needed for
        this fixture's read/list operations.
      - Do not claim unexecuted SDK, external lint, or ARM review validation.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - &a3
        type: run-command
        name: fixture-dependencies
        config:
          command: node check-node-dependencies.cjs packages
          expected_exit_code: 0
      - &a4
        type: run-command
        name: compile-typespec
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &a5
        type: run-command
        name: fresh-compiled-contract
        config:
          command: node check-discussion-case.mjs
          expected_exit_code: 0
      - &a6
        type: prompt
        name: semantic-answer-and-limitations
        config:
          prompt: >-
            Evaluate the completed task against the stimulus rubric. Accept semantically equivalent
            valid TypeSpec, not just matching text or comments. Require the actual requested
            wire/version/client-metadata behavior, preservation of unrelated contracts, and the
            scenario's stated qualifications. Reject unsupported claims that compiling TypeSpec or
            AutoRest proves generated SDK behavior, external LintDiff success, or management-plane
            approval.


            Scenario-specific expectations:

            - The route has a required employeeName parameter.

            - Only the legacy optional fields appear in the resource payload.

            - No common Resource base or required payload field is added.

            - CustomAzureResource carries includeInapplicableMetadataInPayload(false), so the
            required route name does not become a required JSON field. The keyless input's standard
            read and list both resolve to the provider root, reproducing duplicate-operation errors
            rather than a dedicated missing-name diagnostic in this toolchain. This is the source's
            standard-template workaround, not a reason to require an optional legacy payload
            property. LegacyOperations/RoutedOperations can instead take keys separately, but are
            not needed for this fixture's read/list operations.

            - Do not claim unexecuted SDK, external lint, or ARM review validation.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.8
    constraints:
      max_turns: 14
      max_tokens: 100000
  - name: 002012-ARM-legacy-custom-resource-forced
    tags:
      suite: armtemplate
      mode: forced
    prompt: >-
      @azure-typespec-author Employee is a legacy resource whose JSON contains only optional someId
      and someOtherProperty, with no standard id/name/type envelope. The input applies
