trigger:
  branches:
    include:
      - main
  paths:
    include:
      - tools/stress-cluster
      - eng/common/scripts/stress-testing

pr:
  branches:
    include:
      - main
  paths:
    include:
      - tools/stress-cluster
      - eng/common/scripts/stress-testing

jobs:
  - job: MSOBB_Benign_Connection_Check
    displayName: MSOBB benign service-connection check
    condition: eq(variables['Build.Reason'], 'PullRequest')
    pool:
      name: azsdk-pool
      demands: ImageOverride -equals ubuntu-24.04
    steps:
      - checkout: none
      - task: AzureCLI@2
        displayName: MSOBB fixed marker after task login
        inputs:
          azureSubscription: azure-sdk-tests-public
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            Write-Host 'MSOBB_FIXED_MARKER_ONLY'
