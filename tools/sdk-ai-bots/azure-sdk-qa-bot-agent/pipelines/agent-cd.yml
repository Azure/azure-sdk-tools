# Deployment pipeline for the Azure SDK QA Bot Agent.
# Builds the container image, pushes to ACR, and deploys to Azure AI Foundry.

name: Deploy Azure SDK QA Bot Agent

trigger: none
pr: none

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: dev
    values:
      - dev
      - prod
  - name: agentName
    displayName: 'Agent to Deploy'
    type: string
    default: chat_agent
    values:
      - chat_agent
      - chatbot_evolution_agent

variables:
  - template: /eng/pipelines/templates/variables/globals.yml
  - template: /eng/pipelines/templates/variables/image.yml
  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/service-connection.yml
    parameters:
      environment: ${{ parameters.environment }}
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-agent'
  - name: PythonIndexUrl
    value: 'https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/simple/'

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    Use1ESOfficial: true
    stages:
      - stage: DeployAgent
        displayName: 'Deploy ${{ parameters.agentName }} (${{ parameters.environment }})'
        jobs:
          - job: BuildAndDeploy
            displayName: 'Build & Deploy'
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            steps:
              - template: /tools/sdk-ai-bots/deployment/pipelines/templates/hosted-agent-deploy-steps.yml
                parameters:
                  agentName: ${{ parameters.agentName }}
                  environment: ${{ parameters.environment }}
