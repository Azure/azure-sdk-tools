# Temporary feature-branch probe: publisher tests only, no evals, service connection or live storage.
trigger: none
pr: none

extends:
  template: /eng/common/pipelines/templates/stages/archetype-sdk-tool-pwsh.yml
  parameters:
    TargetDirectory: eng/common-tests/eval
    TargetTags: UnitTest,IntegrationTest
    PreTestSteps:
      - task: UseNode@1
        inputs:
          version: 24.x
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $version = az version --output json | ConvertFrom-Json
          Write-Host "Azure CLI version: $($version.'azure-cli')"
        displayName: Report CLI version only
    CustomTestSteps:
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $config = New-PesterConfiguration
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = '$(Build.SourcesDirectory)/eng/common/scripts/eval/publisher/Publish-EvalResults.ps1'
          $config.Filter.Tag = @('UnitTest', 'IntegrationTest')
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { throw 'Publisher-only feature tests failed.' }
        workingDirectory: $(Build.SourcesDirectory)/eng/common-tests/eval
        displayName: Run only publisher tests with fake Azure and localhost storage
