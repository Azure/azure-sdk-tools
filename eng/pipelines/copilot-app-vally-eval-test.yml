# Manual diagnostic only. No PAT fallback, live MCP, permission changes, or dashboard writes.
trigger: none
pr: none

variables:
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: Diagnose
        jobs:
          - job: CompareMcpStartup
            timeoutInMinutes: 20
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: copilot-app-mcp-controls
                  targetPath: $(Build.SourcesDirectory)/artifacts/mcp-controls
                  condition: always()
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1

              - task: UseNode@1
                inputs:
                  version: 24.x

              - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
                parameters:
                  npmrcPath: $(Build.SourcesDirectory)/.npmrc
                  registryUrl: https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-tools/npm/registry/

              - script: npm ci --userconfig $(Build.SourcesDirectory)/.npmrc
                displayName: Install exact production Vally and SDK
                workingDirectory: eng/common/scripts/eval

              # Reuse the exact mock binary from the failed production run, not a rebuild.
              - task: DownloadPipelineArtifact@2
                displayName: Download exact failed-run mock MCP artifact
                inputs:
                  buildType: specific
                  project: internal
                  definition: '8255'
                  buildVersionToDownload: specific
                  pipelineId: '6980135'
                  artifactName: mcp-servers
                  targetPath: $(Build.SourcesDirectory)/artifacts/mcp

              - script: node --test eng/pipelines/copilot-app-mcp-probe.test.mjs eng/pipelines/copilot-app-mcp-options.test.mjs
                displayName: Test diagnostic assertions offline

              - template: /eng/common/pipelines/templates/steps/login-to-copilot.yml

              - script: node eng/pipelines/copilot-app-mcp-options.mjs --startup-only
                displayName: Verify explicit MCP startup against control in three trials
                workingDirectory: $(Build.SourcesDirectory)
                env:
                  COPILOT_GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)