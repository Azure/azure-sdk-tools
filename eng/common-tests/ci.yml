# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/common/scripts
      - eng/common-tests

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - eng/common/scripts
      - eng/common-tests

extends:
  template: /eng/common/pipelines/templates/stages/archetype-sdk-tool-pwsh.yml
  parameters:
    TargetDirectory: eng/common-tests
    TargetTags: UnitTest,IntegrationTest
    PreTestSteps:
      - template: /eng/pipelines/templates/steps/install-dotnet.yml
      # The Linux package-detection acceptance fixture pins SDK 9.0.102 in global.json.
      - task: UseDotNet@2
        displayName: Use .NET SDK for package-detection acceptance fixture
        condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
        retryCountOnTaskFailure: 3
        inputs:
          packageType: sdk
          version: 9.0.102
      - template: /eng/common/pipelines/templates/steps/enable-long-path-support.yml
