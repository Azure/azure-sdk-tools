name: azure-typespec-assessment-eval
description: Routing coverage for azure-typespec-assessment.
type: capability

tags:
  area: azure-typespec-assessment
  type: ci-gate

defaults:
  runs: 1
  timeout: "60s"
  model: gpt-5.4
  judge_model: gpt-5.4
  executor: copilot-sdk

scoring:
  threshold: 1

stimuli:
  - name: trigger-assess-current-typespec-diff
    prompt: "Load the skill appropriate for reviewing the current TypeSpec diff under C:\\workspace\\azure-rest-api-specs\\specification\\contoso\\widget. State which skill applies, but do not inspect files or start the assessment."
    environment:
      skills:
        - ..
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]
    constraints: &routing_constraints
      max_turns: 1
      max_tokens: 10000

  - name: trigger-review-typespec-pr
    prompt: "Load the skill appropriate for assessing https://github.com/Azure/azure-rest-api-specs/pull/44988. State which skill applies, but do not inspect the PR or start the assessment."
    environment:
      skills:
        - ..
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]
    constraints: *routing_constraints

  - name: anti-trigger-author-typespec
    prompt: "Load the skill appropriate for adding stable API version 2026-09-01 under specification/contoso/widget. State which skill applies, but do not inspect or modify files."
    environment:
      skills:
        - ..
        - ../../azure-typespec-author
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-author"]
          disallowed: ["azure-typespec-assessment"]
    constraints: *routing_constraints

  - name: anti-trigger-generate-sdk
    prompt: "Load the skill appropriate for generating the Python package azure-contoso-widget from specification/contoso/widget. State which skill applies, but do not generate code or run tests."
    environment:
      skills:
        - ..
        - ../../azsdk-common-generate-sdk-locally
    graders:
      - type: skill-invocation
        config:
          required: ["azsdk-common-generate-sdk-locally"]
          disallowed: ["azure-typespec-assessment"]
    constraints: *routing_constraints
