# Deployment pipeline for the Azure SDK QA Bot Agent Server (backend).
# Builds the container image, pushes to ACR, and deploys to Azure App Service.
# Reuses the same ACR and App Service resources as the old Go backend.

name: Deploy Azure SDK QA Bot Agent Server

trigger: none
pr: none

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: dev
    values:
      - dev
      - preview
      - prod
  - name: slot
    displayName: 'Target Slot'
    type: string
    default: default
    values:
      - default

variables:
  - template: /eng/pipelines/templates/variables/globals.yml
  - template: /eng/pipelines/templates/variables/image.yml
  - ${{ if eq(parameters.environment, 'dev') }}:
    - group: 'Azure SDK QA Bot Dev Variables'
  - ${{ if eq(parameters.environment, 'preview') }}:
    - group: 'Azure SDK QA Bot Preview Variables'
  - ${{ if eq(parameters.environment, 'prod') }}:
    - group: 'Azure SDK QA Bot Prod Variables'
  - name: imageName
    value: 'azure-sdk-qa-bot-agent-server'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-agent'
  - name: syncWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/tools/sdk-ai-bots/azure-sdk-qa-bot-knowledge-sync'
  - name: webjobName
    value: 'knowledge-sync'

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    Use1ESOfficial: true
    stages:
      - stage: DeployPipeline
        displayName: 'Deploy Server (${{ parameters.environment }} / ${{ parameters.slot }})'
        jobs:
          - job: RunDeploy
            displayName: 'Run Deploy Flow'
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            ${{ if ne(parameters.environment, 'preview') }}:
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    path: $(Build.ArtifactStagingDirectory)/knowledge-sync
                    artifact: knowledge-sync
                    displayName: 'Publish Scheduled Knowledge Sync ZIP'
                    condition: succeededOrFailed()
            steps:
              # 1. Checkout
              - checkout: self
                displayName: 'Checkout repository'
                persistCredentials: true
                continueOnError: false

              # 2. Resolve image tag
              - bash: |
                  set -euo pipefail
                  VERSION_FILE="$(workingDirectory)/_version.py"
                  if [ -f "$VERSION_FILE" ]; then
                    APP_VERSION=$(python3 -c "exec(open('$VERSION_FILE').read()); print(VERSION)")
                  else
                    APP_VERSION="0.0.0"
                    echo "##[warning]_version.py not found, defaulting to $APP_VERSION"
                  fi
                  echo "##vso[task.setvariable variable=appVersion]$APP_VERSION"
                  echo "App version: $APP_VERSION"

                  if [ "${{ parameters.environment }}" = "dev" ]; then
                    IMAGE_TAG=$(git rev-parse --short HEAD)
                  else
                    IMAGE_TAG="$APP_VERSION"
                  fi
                  echo "##vso[task.setvariable variable=imageTag]$IMAGE_TAG"
                  echo "Resolved image tag: $IMAGE_TAG"
                displayName: 'Resolve Image Tag'
                failOnStderr: true
                continueOnError: false

              # Build, test, and package scheduled knowledge sync before cloud mutations.
              - ${{ if ne(parameters.environment, 'preview') }}:
                - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml

                - task: NodeTool@0
                  displayName: 'Use Node.js 24.x for Scheduled Knowledge Sync'
                  inputs:
                    versionSpec: '24.x'

                - bash: npm ci
                  displayName: 'Install Scheduled Knowledge Sync Dependencies'
                  workingDirectory: $(syncWorkingDirectory)

                - bash: npm test -- --no-file-parallelism
                  displayName: 'Test Scheduled Knowledge Sync'
                  workingDirectory: $(syncWorkingDirectory)

                - bash: npm run build:webjob -- $(Build.ArtifactStagingDirectory)/knowledge-sync/knowledge-sync.zip
                  displayName: 'Build and Package Scheduled Knowledge Sync'
                  workingDirectory: $(syncWorkingDirectory)

              # 3. Build & push (prod reuses existing image)
              - task: AzureCLI@2
                condition: ne('${{ parameters.environment }}','prod')
                displayName: 'Build & Push Image'
                continueOnError: false
                inputs:
                  azureSubscription: $(SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    # Use remote ACR build to avoid hosted-agent network restrictions during pip install.
                    az acr build \
                      --registry "$(ACR_NAME)" \
                      --image "$(imageName):$(imageTag)" \
                      --file "tools/sdk-ai-bots/azure-sdk-qa-bot-agent/Dockerfile" \
                      "$(System.DefaultWorkingDirectory)"
                    ACR_LOGIN_SERVER=$(az acr show --name "$(ACR_NAME)" --resource-group "$(ACR_RESOURCE_GROUP)" --query loginServer -o tsv)
                    echo "Image pushed: $ACR_LOGIN_SERVER/$(imageName):$(imageTag)"

              # 4. Validate image exists
              - task: AzureCLI@2
                displayName: 'Validate Image Exists'
                continueOnError: false
                inputs:
                  azureSubscription: $(SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    echo "Validating image $(imageName):$(imageTag) in ACR $(ACR_NAME)"
                    if az acr repository show-tags --name "$(ACR_NAME)" --repository "$(imageName)" --output tsv | grep -Fxq "$(imageTag)"; then
                      echo "Image found"
                    else
                      echo "Image $(imageName):$(imageTag) not found in $(ACR_NAME)" >&2
                      if [ "${{ parameters.environment }}" = "prod" ]; then
                        echo "You should make sure the current version is already deployed to the preview environment before release to production." >&2
                      fi
                      exit 1
                    fi

              # 5. Deploy App Service
              - ${{ if ne(parameters.environment, 'preview') }}:
                - task: DownloadSecureFile@1
                  name: sshPrivateKey
                  displayName: 'Download Knowledge Sync SSH Key'
                  inputs:
                    secureFile: 'EMU-SSH-PRIVATE-KEY'

                - task: AzureCLI@2
                  displayName: 'Configure Knowledge Sync SSH Key'
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      node --input-type=module <<'NODE'
                      import { readFileSync, mkdtempSync, writeFileSync, rmSync } from 'node:fs';
                      import { tmpdir } from 'node:os';
                      import { join } from 'node:path';
                      import { execFileSync } from 'node:child_process';
                      let directory;
                      try {
                        const value = readFileSync(process.env.SSH_KEY_FILE, 'utf8').trim();
                        const key = value.startsWith('-----BEGIN ') ? value : Buffer.from(value, 'base64').toString('utf8').trim();
                        if (!/^-----BEGIN (OPENSSH|RSA|EC|DSA|ENCRYPTED)? ?PRIVATE KEY-----/.test(key)) {
                          throw new Error('Invalid key format');
                        }
                        directory = mkdtempSync(join(tmpdir(), 'ssh-setting-'));
                        const settings = join(directory, 'settings.json');
                        writeFileSync(settings, JSON.stringify({ SSH_PRIVATE_KEY: Buffer.from(key + '\n').toString('base64') }), { mode: 0o600 });
                        execFileSync('az', ['webapp', 'config', 'appsettings', 'set',
                          '--name', process.env.APP_NAME, '--resource-group', process.env.RESOURCE_GROUP,
                          '--settings', '@' + settings, '--only-show-errors', '--output', 'none'],
                          { stdio: ['ignore', 'pipe', 'pipe'], timeout: 120000 });
                        console.log('Knowledge sync SSH setting configured.');
                      } catch {
                        console.error('SSH setting configuration failed; check secure file format and App Service permissions.');
                        process.exitCode = 1;
                      } finally {
                        if (directory) rmSync(directory, { recursive: true, force: true });
                      }
                      NODE
                  env:
                    SSH_KEY_FILE: $(sshPrivateKey.secureFilePath)
                    APP_NAME: $(APP_NAME)
                    RESOURCE_GROUP: $(RESOURCE_GROUP)

              - task: AzureCLI@2
                displayName: 'Update App Service'
                continueOnError: false
                inputs:
                  azureSubscription: $(SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    SLOT="${{ parameters.slot }}"
                    if [ -n "$SLOT" ] && [ "$SLOT" != "default" ]; then
                      TARGET="$(APP_NAME)/$SLOT"
                      SLOT_ARG="--slot $SLOT"
                    else
                      TARGET="$(APP_NAME)"
                      SLOT_ARG=""
                    fi
                    echo "Updating container image $(imageName):$(imageTag) for app $TARGET"
                    ACR_LOGIN_SERVER=$(az acr show --name "$(ACR_NAME)" --resource-group "$(ACR_RESOURCE_GROUP)" --query loginServer -o tsv)
                    echo "ACR: $ACR_LOGIN_SERVER"
                    set +e
                    OUTPUT=$(az webapp config container set \
                      --name "$(APP_NAME)" \
                      --resource-group "$(RESOURCE_GROUP)" \
                      $SLOT_ARG \
                      --container-image-name "$ACR_LOGIN_SERVER/$(imageName):$(imageTag)" \
                      --container-registry-url "https://$ACR_LOGIN_SERVER" 2>&1)
                    STATUS=$?
                    set -euo pipefail
                    echo "$OUTPUT"
                    [ $STATUS -eq 0 ] || { echo "Failed to update container" >&2; exit $STATUS; }
                    echo "Container configuration updated"
                env:
                  APP_NAME: $(APP_NAME)
                  RESOURCE_GROUP: $(RESOURCE_GROUP)
                  ACR_NAME: $(ACR_NAME)
                  ACR_RESOURCE_GROUP: $(ACR_RESOURCE_GROUP)
                  IMAGE_NAME: $(imageName)

              - ${{ if ne(parameters.environment, 'preview') }}:
                - task: AzureCLI@2
                  displayName: 'Deploy Scheduled Knowledge Sync WebJob'
                  continueOnError: false
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: node "$(syncWorkingDirectory)/scripts/deploy-webjob.mjs"
                  env:
                    WEBJOB_ZIP: $(Build.ArtifactStagingDirectory)/knowledge-sync/knowledge-sync.zip
                    APP_NAME: $(APP_NAME)
                    RESOURCE_GROUP: $(RESOURCE_GROUP)
                    WEBJOB_NAME: $(webjobName)

              # 6. Health check
              - task: AzureCLI@2
                displayName: 'Health Check'
                continueOnError: false
                inputs:
                  azureSubscription: $(SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    SLOT="${{ parameters.slot }}"
                    if [ -n "$SLOT" ] && [ "$SLOT" != "default" ]; then
                      TARGET="$(APP_NAME)/$SLOT"
                      SLOT_ARG="--slot $SLOT"
                    else
                      TARGET="$(APP_NAME)"
                      SLOT_ARG=""
                    fi
                    APP_URL=$(az webapp show --name "$(APP_NAME)" --resource-group "$(RESOURCE_GROUP)" $SLOT_ARG --query defaultHostName -o tsv)
                    echo "App URL: https://$APP_URL"

                    # Acquire Entra ID token for EasyAuth
                    ACCESS_TOKEN=$(az account get-access-token --resource "$(EASYAUTH_AUDIENCE)" --query accessToken -o tsv)

                    echo "Waiting for health..."; sleep 25
                    HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer $ACCESS_TOKEN" \
                      https://$APP_URL/ping || echo 000)
                    if [ "$HTTP_STATUS" = "200" ]; then
                      echo "Health check OK"
                    else
                      echo "Health endpoint returned $HTTP_STATUS" >&2
                      exit 1
                    fi
                    ACR_LOGIN_SERVER=$(az acr show --name "$(ACR_NAME)" --resource-group "$(ACR_RESOURCE_GROUP)" --query loginServer -o tsv)
                    echo "=== Deployment Summary ==="
                    echo "Environment: ${{ parameters.environment }}"
                    echo "Slot: ${{ parameters.slot }}"
                    echo "Version: $(appVersion)"
                    echo "Image Tag: $(imageTag)"
                    echo "Resource Group: $(RESOURCE_GROUP)"
                    echo "App Service: $TARGET"
                    echo "Image: $ACR_LOGIN_SERVER/$(imageName):$(imageTag)"
                    echo "Health Status: $HTTP_STATUS"
                    echo "URL: https://$APP_URL"
                    echo "=========================="
                env:
                  APP_NAME: $(APP_NAME)
                  RESOURCE_GROUP: $(RESOURCE_GROUP)
                  ACR_NAME: $(ACR_NAME)
                  ACR_RESOURCE_GROUP: $(ACR_RESOURCE_GROUP)
                  IMAGE_NAME: $(imageName)
