# Manual authentication diagnostic only; no live MCP tools or release-plan scenarios.
trigger: none
pr: none

variables:
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/common/pipelines/templates/stages/archetype-eval.yml
  parameters:
    mcpSetupTemplate: /eng/common/pipelines/templates/steps/eval-mcp-setup.yml
    TestType: mock
    vallyRoot: evals
    evalGlobs:
      - 'auth-smoke/*.eval.yaml'
    evalInvokeTemplate: /eng/pipelines/copilot-app-vally-eval-invoke.yml
    threshold: 1.0
    failOnFailedTests: true
