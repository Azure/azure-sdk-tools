trigger: none
pr: none

schedules:
  - cron: "0 0 1 * *"
    displayName: Monthly past-due release plan cleanup
    branches:
      include:
        - main
    always: true

variables:
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: ReportUnreleasedSdks
        jobs:
          - job: ReportUnreleasedSdks
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux

            steps:
              - checkout: self

              # Private Preview spec PRs require an authenticated GitHub read.
              - template: /eng/common/pipelines/templates/steps/login-to-github.yml
                parameters:
                  TokenOwners:
                    - Azure

              - task: PowerShell@2
                displayName: 'Install Azure SDK MCP'
                inputs:
                  targetType: 'inline'
                  script: './eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $(System.DefaultWorkingDirectory)'
                  pwsh: true
                  workingDirectory: '$(System.DefaultWorkingDirectory)'

              - task: AzureCLI@2
                displayName: Abandon inactive release plans after the overdue grace period
                condition: and(succeeded(), eq(variables['Build.Reason'], 'Schedule'))
                # Keep failures visible as partially succeeded without suppressing overdue reminders.
                continueOnError: true
                env:
                  AZSDKTOOLS_NOTIFICATION_SERVICE_URL: $(AzureSDKEmailerSasURL)
                  GITHUB_TOKEN: $(GH_TOKEN)
                inputs:
                  azureSubscription: opensource-api-connection
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    & "$(System.DefaultWorkingDirectory)/azsdk" release-plan abandon-overdue --inactivity-days 30

              - task: AzureCLI@2
                displayName: Email product owners about overdue SDK release plans
                env:
                  GITHUB_TOKEN: $(GH_TOKEN)
                inputs:
                  azureSubscription: opensource-api-connection
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    & "$(System.DefaultWorkingDirectory)/azsdk" release-plan list-overdue --notify-owners true --emailer-uri "$(AzureSDKEmailerSasURL)"