name: markdown-token-optimizer-eval
description: Evaluation suite for the markdown-token-optimizer skill
type: capability

environment: azsdk-mcp-mock

tags:
  area: markdown-token-optimizer
  type: ci-gate

defaults:
  runs: 1
  timeout: "90s"
  model: gpt-6.1-sol
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: basic-trigger
    prompt: "My SKILL.md is too large and uses too many tokens. Can you help me optimize it for token efficiency?"
    environment:
      skills:
        - ..
    graders:
      - type: output-not-contains
        config:
          substring: "cannot help"
      - type: skill-invocation
        config:
          required: ["markdown-token-optimizer"]

  - name: anti-trigger
    prompt: "How do I deploy my Azure Function to production?"
    graders:
      - type: output-not-contains
        config:
          substring: "token budget"
      - type: output-not-contains
        config:
          substring: "reduce tokens"
