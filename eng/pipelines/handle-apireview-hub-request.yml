# API Review Hub queues this pipeline for create and update requests. Keep this
# file language-agnostic: it builds shared tooling once, then dispatches isolated
# base and target artifact-generation jobs.
pr: none
trigger: none

parameters:
  - name: requestMode
    type: string
    values:
      - create
      - update
  - name: language
    type: string
    values:
      - python
      - java
      - csharp
      - javascript
      - go
      - rust
      - cpp
  - name: operationId
    type: string
    default: ''
  - name: packageName
    type: string
    default: ''
  - name: owner
    type: string
    default: 'Azure'
  - name: baseRef
    type: string
    default: ''
  - name: targetRef
    type: string
    default: ''
  - name: pipelineRef
    type: string
    default: main
  - name: toolsRef
    type: string
    default: main
  - name: languageToolsRef
    type: string
    default: main

resources:
  repositories:
    - repository: python-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-python
      ref: ${{ parameters.languageToolsRef }}
    - repository: java-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-java
      ref: ${{ parameters.languageToolsRef }}
    - repository: csharp-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-net
      ref: ${{ parameters.languageToolsRef }}
    - repository: javascript-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-js
      ref: ${{ parameters.languageToolsRef }}
    - repository: go-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-go
      ref: ${{ parameters.languageToolsRef }}
    - repository: rust-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-rust
      ref: ${{ parameters.languageToolsRef }}
    - repository: cpp-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-cpp
      ref: ${{ parameters.languageToolsRef }}

variables:
  - name: callbackTokenAudience
    value: 'api://apireviewhub'
    readonly: true
  - name: completionCallbackUrl
    value: 'https://api-review-hub.azurewebsites.net/api/operations/'
    readonly: true

stages:
  - stage: BuildTools
    displayName: 'Build API review tools'
    jobs:
      - template: /eng/common/pipelines/templates/jobs/apireview-hub-build-tools-base.yml
        parameters:
          languageRepoResource: ${{ format('{0}-repo', parameters.language) }}
          toolsRef: ${{ parameters.toolsRef }}
          languageToolsRef: ${{ parameters.languageToolsRef }}

  - stage: GenerateArtifacts
    displayName: 'Generate API review artifacts'
    dependsOn: BuildTools
    condition: succeeded()
    jobs:
      - ${{ if ne(trim(parameters.baseRef), '') }}:
        - template: ${{ format('/eng/pipelines/templates/jobs/apireview-hub-generate-artifact-{0}.yml@{0}-repo', parameters.language) }}
          parameters:
            kind: base
            repositoryOwner: ${{ parameters.owner }}
            ref: ${{ parameters.baseRef }}
            packageName: ${{ parameters.packageName }}
            operationId: ${{ parameters.operationId }}

      - template: ${{ format('/eng/pipelines/templates/jobs/apireview-hub-generate-artifact-{0}.yml@{0}-repo', parameters.language) }}
        parameters:
          kind: target
          repositoryOwner: ${{ parameters.owner }}
          ref: ${{ parameters.targetRef }}
          packageName: ${{ parameters.packageName }}
          operationId: ${{ parameters.operationId }}
