# Nightly evaluation of whether GitHub Copilot's fixes for failing Azure SDK pipelines took
# the pipeline from failure to success and survived into the merged PR.
#
# For each repository the azsdk CLI evaluator is run for a one-day window and its JSON
# response is written to Azure Blob Storage using the layout the pipeline-analysis-dashboard
# reads (tools/pipeline-analysis-dashboard):
#
#     <container>/pipeline-fix/<repo>/<YYYY-MM-DD>.json
#
# One blob per repo per day is what gives the dashboard its trend lines: it lists the
# "pipeline-fix/" prefix and reads N days back, with no database in between. The dashboard
# derives each run's date from the report's own "until" field, falling back to the date in
# the blob name.
#
# The same files are also published as a pipeline artifact so a run can be inspected
# without reaching for storage.

trigger: none
pr: none

schedules:
  - cron: "0 8 * * *"
    displayName: Nightly Copilot pipeline-fix evaluation (08:00 UTC)
    branches:
      include:
        - main
    always: true

parameters:
  - name: owner
    displayName: GitHub repository owner
    type: string
    default: Azure
  - name: repos
    displayName: Repositories to evaluate
    type: object
    default:
      - azure-sdk-for-net
      - azure-sdk-for-python
      - azure-sdk-for-java
      - azure-sdk-for-js
      - azure-sdk-for-go
  - name: sinceDays
    displayName: Look back this many days for merged PRs
    type: number
    default: 1
  # The per-repository timeout is derived from this at runtime (see 'Evaluate each
  # repository'), because template expressions have no arithmetic functions.
  - name: jobTimeoutMinutes
    displayName: Overall job timeout in minutes, shared evenly by the repositories
    type: number
    default: 120
  - name: publishToBlob
    displayName: Publish results to Azure Blob Storage
    type: boolean
    default: true

variables:
  # Provides azuresdk-copilot-github-pat (GitHub token for the evaluator's Octokit client).
  - group: 'AzSDK_Eval_Variable_group'
  # Root of the tree uploaded to the container; its layout IS the blob key layout.
  - name: EvalArtifactDir
    value: $(Build.ArtifactStagingDirectory)/pipeline-fix-eval
  - name: MetricsStorageAccount
    value: azuresdkartifacts
  - name: MetricsContainer
    value: metrics

jobs:
  - job: Evaluate
    displayName: 'Evaluate Copilot pipeline fixes'
    timeoutInMinutes: ${{ parameters.jobTimeoutMinutes }}
    pool:
      name: azsdk-pool
      demands: ImageOverride -equals ubuntu-24.04
    steps:
      - checkout: self
        fetchDepth: 1

      # Exists before evaluation so the artifact step has a path even on early failure.
      - script: mkdir -p $(EvalArtifactDir)
        displayName: 'Create evaluation output directory'

      - template: /eng/common/pipelines/templates/steps/install-azsdk-cli.yml

      - task: NodeTool@0
        displayName: 'Install Node.js'
        inputs:
          versionSpec: '24.x'

      # 1ES images block registry.npmjs.org; restore via the azure-sdk npm mirror. Written to
      # the agent user's .npmrc so the global install below inherits the registry and its auth.
      - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
        parameters:
          registryUrl: https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-tools/npm/registry/

      # Not bundled into the released CLI (its build sets CopilotSkipCliDownload under TF_BUILD),
      # and the judge reports a missing CLI as Undetermined rather than failing, so without this
      # the whole night would look green with no verdicts.
      - script: |
          npm install --global @github/copilot
          copilot --version
        displayName: 'Install Copilot CLI'
        retryCountOnTaskFailure: 2

      - task: AzureCLI@2
        displayName: 'Evaluate each repository'
        inputs:
          # Service connection whose SP can read azure-sdk DevOps builds. The AzureCLI@2
          # task exports AZURESUBSCRIPTION_* + SYSTEM_ACCESSTOKEN, which the tool's
          # AzurePipelinesCredential uses to get an Azure DevOps-scoped AAD token.
          azureSubscription: 'opensource-api-connection'
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = 'Stop'

            # The blob name must agree with the window the report covers, and the dashboard
            # prefers the report's own "until" (set to UtcNow by the tool) over the name.
            $reportDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
            $repos = @($env:REPOS | ConvertFrom-Json)
            
            $shareableMinutes = [int]$env:JOB_TIMEOUT_MINUTES * 0.75
            $perRepoMinutes = [int][math]::Max(1, [math]::Floor($shareableMinutes / $repos.Count))
            $timeoutArg = "${perRepoMinutes}m"
            Write-Host "Job timeout $($env:JOB_TIMEOUT_MINUTES)m over $($repos.Count) repo(s): allowing $timeoutArg each."

            $failed = @()

            foreach ($repo in $repos) {
                Write-Host "##[group]Evaluating $env:OWNER/$repo"

                # Mirrors the dashboard's key layout: pipeline-fix/<repo>/<YYYY-MM-DD>.json
                $repoDir = Join-Path '$(EvalArtifactDir)' "pipeline-fix/$repo"
                New-Item -ItemType Directory -Force -Path $repoDir | Out-Null
                $reportPath = Join-Path $repoDir "$reportDate.json"

                # Build the args as an array so owner/repo (from env) are passed as single
                # args without shell re-parsing.
                $evalArgs = @('eng', 'evaluate', $env:OWNER, $repo,
                              '--since-days', '${{ parameters.sinceDays }}',
                              '--output', 'json')

                # --output json puts the structured response on stdout and progress on stderr,
                # so redirecting stdout alone yields a clean report. The timeout is per repo;
                # the job-level one would let a single hung repo starve the rest.
                timeout --signal=TERM --kill-after=60s $timeoutArg `
                    $env:AZSDK @evalArgs > $reportPath
                $exitCode = $LASTEXITCODE

                # 124 = terminated at the timeout, 137 = needed the follow-up KILL.
                if ($exitCode -eq 124 -or $exitCode -eq 137) {
                    Write-Host "##vso[task.logissue type=error]eng evaluate for $repo exceeded $timeoutArg and was terminated"
                    Remove-Item -Path $reportPath -Force -ErrorAction SilentlyContinue
                    $failed += $repo
                    Write-Host '##[endgroup]'
                    continue
                }

                if ($exitCode -ne 0) {
                    # One unhealthy repo must not cost the night's data for the others; record
                    # it, drop the partial file, and keep going.
                    Write-Host "##vso[task.logissue type=error]eng evaluate failed for $repo with exit code $exitCode"
                    Remove-Item -Path $reportPath -Force -ErrorAction SilentlyContinue
                    $failed += $repo
                    Write-Host '##[endgroup]'
                    continue
                }

                # A malformed report would poison the dashboard silently, so parse before publishing.
                try {
                    $report = Get-Content -Raw -Path $reportPath | ConvertFrom-Json
                } catch {
                    Write-Host "##vso[task.logissue type=error]eng evaluate produced invalid JSON for ${repo}: $_"
                    Remove-Item -Path $reportPath -Force -ErrorAction SilentlyContinue
                    $failed += $repo
                    Write-Host '##[endgroup]'
                    continue
                }

                $count = if ($report.results) { @($report.results).Count } else { 0 }
                Write-Host "$repo -> $reportPath ($count evaluation(s))"
                Write-Host '##[endgroup]'
            }

            # Checked before the partial-failure result below, so a total failure never records
            # a success that would let the publish step run.
            if ($failed.Count -eq @($repos).Count) {
                throw 'Evaluation failed for every repository; nothing to publish.'
            }

            if ($failed.Count -gt 0) {
                # Surfaced after the loop so the successful repos are still uploaded below.
                Write-Host "##vso[task.complete result=SucceededWithIssues;]Evaluation failed for: $($failed -join ', ')"
            }
        env:
          OWNER: ${{ parameters.owner }}
          REPOS: ${{ convertToJson(parameters.repos) }}
          JOB_TIMEOUT_MINUTES: ${{ parameters.jobTimeoutMinutes }}
          GITHUB_TOKEN: $(azuresdk-copilot-github-pat)

      - task: AzureCLI@2
        displayName: 'Publish results to Azure Blob Storage'
        condition: and(succeeded(), ${{ parameters.publishToBlob }})
        retryCountOnTaskFailure: 2
        inputs:
          # The service connection's identity needs 'Storage Blob Data Contributor' on the
          # account; --auth-mode login uses it instead of an account key.
          azureSubscription: 'Azure SDK Artifacts'
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = 'Stop'

            # upload-batch exits 0 when nothing matches the pattern, so an empty tree would
            # otherwise be reported as a successful publish.
            $reports = @(Get-ChildItem -Path '$(EvalArtifactDir)' -Filter '*.json' -Recurse -File)
            if ($reports.Count -eq 0) {
                throw 'No evaluation reports were produced; nothing to upload.'
            }
            Write-Host "Uploading $($reports.Count) report(s)."

            # Uploading the staged tree as-is preserves pipeline-fix/<repo>/<date>.json as the
            # blob key. --overwrite lets a re-run correct the same day's report in place.
            az storage blob upload-batch `
                --account-name '$(MetricsStorageAccount)' `
                --destination '$(MetricsContainer)' `
                --source '$(EvalArtifactDir)' `
                --pattern '*.json' `
                --auth-mode login `
                --overwrite true

            if ($LASTEXITCODE -ne 0) {
                throw "Failed to upload evaluation reports with exit code $LASTEXITCODE"
            }

      - template: /eng/common/pipelines/templates/steps/publish-artifact.yml
        parameters:
          ArtifactName: 'pipeline-fix-evaluation'
          ArtifactPath: '$(EvalArtifactDir)'
