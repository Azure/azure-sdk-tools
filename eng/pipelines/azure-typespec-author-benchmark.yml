# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
# Internal Usage Guide:
# - Purpose: benchmark azure-typespec-author in two execution modes:
#   1) forced mode (code-quality oriented), 2) trigger mode (skill-invocation oriented).
# - Entry: run this pipeline manually (trigger/pr are disabled).
# - Skill source:
#   - SkillBranch empty: evaluate the current checked-out branch.
#   - SkillBranch set: overlay SKILL.md + references from that branch before evaluation.
#
# Structure:
# - PrepareShared builds the selected MCP binary once and publishes it as the mcp-servers artifact.
# - PrepareForced / PrepareTrigger generate area-based shard matrices from eval file metadata.
# - EvalForced / EvalTrigger run one matrix job per area.
# - SummaryForced / SummaryTrigger verify complete latest attempts and roll up results.
trigger: none
pr: none

parameters:
- name: SkillBranch
  displayName: Branch containing the azure-typespec-author skill source (SKILL.md + references/) to evaluate. Defaults to the full source branch ref.
  type: string
  default: $(Build.SourceBranch)
- name: McpKind
  displayName: MCP implementation
  type: string
  default: live
  values:
    - live
    - mock
- name: Runs
  displayName: Vally trials per stimulus
  type: number
  default: 1

variables:
- template: /eng/pipelines/templates/variables/image.yml
- name: TypeSpecAuthorEvalAzureSubscription
  value: azuresdkqabot-dev
- name: SkillBranch
  value: ${{ parameters.SkillBranch }}

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    Use1ESOfficial: true
    stages:
      - stage: PrepareShared
        displayName: Prepare shared MCP artifact
        dependsOn: []
        jobs:
          - template: /eng/common/pipelines/templates/jobs/build-mcp.yml
            parameters:
              mcpSetupTemplate: /eng/common/pipelines/templates/steps/eval-mcp-setup.yml
              TestType: ${{ parameters.McpKind }}

      - stage: PrepareForced
        displayName: Prepare forced track
        dependsOn: PrepareShared
        jobs:
          - template: /eng/common/pipelines/templates/jobs/generate-eval-matrix.yml
            parameters:
              vallyRoot: .github/skills/azure-typespec-author/evaluate
              evalGlobs:
                # Files without forced stimuli would produce zero-execution verdicts.
                - 'evals/001*.eval.yaml'
                - 'evals/002*.eval.yaml'
                - 'evals/003*.eval.yaml'
                - 'evals/004*.eval.yaml'
                - 'evals/005*.eval.yaml'
                - 'evals/006*.eval.yaml'
                - 'evals/007001.eval.yaml'
                - 'evals/007002.eval.yaml'
                - 'evals/007003.eval.yaml'
                - 'evals/007004.eval.yaml'
                - 'evals/007005.eval.yaml'
                - 'evals/007006.eval.yaml'
                - 'evals/007007.eval.yaml'
                - 'evals/007008.eval.yaml'

      - stage: EvalForced
        displayName: Eval forced track
        dependsOn: PrepareForced
        variables:
          TypeSpecAuthorEvalMode: forced
          AZSDK_EVAL_MCP_KIND: ${{ parameters.McpKind }}
        jobs:
          - template: /eng/common/pipelines/templates/jobs/eval-shard.yml
            parameters:
              matrixStageName: PrepareForced
              artifactNamespace: forced
              preEvalTemplate: /.github/skills/azure-typespec-author/evaluate/pipeline/typespec-author-preeval.yml
              vallyRoot: .github/skills/azure-typespec-author/evaluate
              UseAzSdkAuthentication: ${{ eq(parameters.McpKind, 'live') }}
              azureSubscription: ${{ variables.TypeSpecAuthorEvalAzureSubscription }}
              vallyArguments:
                - --tag
                - mode=forced
                - --runs
                - ${{ format('{0}', parameters.Runs) }}
              # Keep each shard below the installation token's one-hour lifetime.
              ${{ if eq(parameters.Runs, 1) }}:
                shardTimeoutInMinutes: 50
              ${{ else }}:
                shardTimeoutInMinutes: 55

      - stage: SummaryForced
        displayName: Summary forced track
        dependsOn: [PrepareForced, EvalForced]
        condition: always()
        jobs:
          - template: /eng/common/pipelines/templates/jobs/eval-summarize.yml
            parameters:
              matrixStageName: PrepareForced
              evalStageName: EvalForced
              artifactNamespace: forced
              failOnFailedTests: false

      - stage: PrepareTrigger
        displayName: Prepare trigger track
        dependsOn: PrepareShared
        jobs:
          - template: /eng/common/pipelines/templates/jobs/generate-eval-matrix.yml
            parameters:
              vallyRoot: .github/skills/azure-typespec-author/evaluate
              evalGlobs:
                - 'evals/001*.eval.yaml'
                - 'evals/002*.eval.yaml'
                - 'evals/003*.eval.yaml'
                - 'evals/004*.eval.yaml'
                - 'evals/005*.eval.yaml'
                - 'evals/006*.eval.yaml'
                - 'evals/007*.eval.yaml'

      - stage: EvalTrigger
        displayName: Eval trigger track
        dependsOn: PrepareTrigger
        variables:
          TypeSpecAuthorEvalMode: trigger
          AZSDK_EVAL_MCP_KIND: ${{ parameters.McpKind }}
        jobs:
          - template: /eng/common/pipelines/templates/jobs/eval-shard.yml
            parameters:
              matrixStageName: PrepareTrigger
              artifactNamespace: trigger
              preEvalTemplate: /.github/skills/azure-typespec-author/evaluate/pipeline/typespec-author-preeval.yml
              vallyRoot: .github/skills/azure-typespec-author/evaluate
              UseAzSdkAuthentication: ${{ eq(parameters.McpKind, 'live') }}
              azureSubscription: ${{ variables.TypeSpecAuthorEvalAzureSubscription }}
              vallyArguments:
                - --tag
                - mode=trigger
                - --runs
                - ${{ format('{0}', parameters.Runs) }}
              # Keep each shard below the installation token's one-hour lifetime.
              ${{ if eq(parameters.Runs, 1) }}:
                shardTimeoutInMinutes: 50
              ${{ else }}:
                shardTimeoutInMinutes: 55

      - stage: SummaryTrigger
        displayName: Summary trigger track
        dependsOn: [PrepareTrigger, EvalTrigger]
        condition: always()
        jobs:
          - template: /eng/common/pipelines/templates/jobs/eval-summarize.yml
            parameters:
              matrixStageName: PrepareTrigger
              evalStageName: EvalTrigger
              artifactNamespace: trigger
              failOnFailedTests: false
