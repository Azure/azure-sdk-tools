# API Review Hub queues this pipeline for create and update requests. Keep this
# file language-agnostic: it decides which artifact bundles are needed, compares
# them when appropriate, and publishes the result artifacts for the web service.
pr: none
trigger: none

resources:
  repositories:
    - repository: python-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-python
      ref: main
    - repository: java-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-java
      ref: main
    - repository: csharp-repo
      type: github
      endpoint: Azure
      name: tjprescott/azure-sdk-for-net
      ref: arh/Onboarding
    - repository: javascript-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-js
      ref: main
    - repository: go-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-go
      ref: main
    - repository: rust-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-rust
      ref: main
    - repository: swift-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-ios
      ref: main
    - repository: cpp-repo
      type: github
      endpoint: Azure
      name: Azure/azure-sdk-for-cpp
      ref: main

variables:
  - name: callbackTokenAudience
    value: 'api://apireviewhub'
    readonly: true
  - name: completionCallbackUrl
    value: 'https://api-review-hub.azurewebsites.net/api/operations/'
    readonly: true

parameters:
  - name: requestMode
    type: string
    values:
      - create
      - update
  - name: language
    type: string
    values:
      - python
      - java
      - csharp
      - javascript
      - go
      - rust
      - swift
      - cpp
  - name: operationId
    type: string
    default: ''
  - name: callbackProofToken
    type: string
  - name: packageName
    type: string
    default: ''
  - name: owner
    type: string
    default: 'Azure'
  - name: baseRef
    type: string
    default: ''
  - name: targetRef
    type: string
    default: ''
  - name: resultArtifactName
    type: string
    default: 'apireview-result'
  - name: baseArtifactName
    type: string
    default: 'apireview-base'
  - name: targetArtifactName
    type: string
    default: 'apireview-target'

stages:
- stage: Generate
  displayName: 'Generate API review artifacts'
  jobs:
  # The language value is validated above. Each supported language must provide:
  # - /eng/pipelines/templates/jobs/apireview-hub-job-{language}.yml
  # - /eng/pipelines/templates/steps/create-apireview-hub-artifacts-{language}.yml
  - template: ${{ format('/eng/pipelines/templates/jobs/apireview-hub-job-{0}.yml@{0}-repo', parameters.language) }}
    parameters:
      repositoryOwner: ${{ parameters.owner }}
      steps:
        - pwsh: |
            $ErrorActionPreference = 'Stop'

            if ([string]::IsNullOrWhiteSpace($env:ARH_OPERATION_ID)) {
              throw 'operationId is required.'
            }
            if ([string]::IsNullOrWhiteSpace($env:ARH_PACKAGE_NAME)) {
              throw 'packageName is required.'
            }
            if ([string]::IsNullOrWhiteSpace($env:ARH_TARGET_REF)) {
              throw 'targetRef is required.'
            }

            New-Item -ItemType Directory -Force -Path '$(Build.ArtifactStagingDirectory)/base' | Out-Null
            New-Item -ItemType Directory -Force -Path '$(Build.ArtifactStagingDirectory)/target' | Out-Null
            New-Item -ItemType Directory -Force -Path '$(Build.ArtifactStagingDirectory)/result' | Out-Null
          displayName: 'Validate request parameters'
          env:
            ARH_OPERATION_ID: ${{ parameters.operationId }}
            ARH_PACKAGE_NAME: ${{ parameters.packageName }}
            ARH_TARGET_REF: ${{ parameters.targetRef }}

        # Create and update requests with a baseline generate it with the same
        # pipeline and tooling inputs as the target. Either mode may omit baseRef
        # to intentionally generate a target-only review.
        - ${{ if ne(trim(parameters.baseRef), '') }}:
          - template: ${{ format('/eng/pipelines/templates/steps/create-apireview-hub-artifacts-{0}.yml@{0}-repo', parameters.language) }}
            parameters:
              requestMode: ${{ parameters.requestMode }}
              operationId: ${{ parameters.operationId }}
              packageName: ${{ parameters.packageName }}
              ref: ${{ parameters.baseRef }}
              kind: base
              outputDir: $(Build.ArtifactStagingDirectory)/base
              workingDir: $(Pipeline.Workspace)/apireview/base

        # Always generate the target bundle after any requested baseline bundle.
        - template: ${{ format('/eng/pipelines/templates/steps/create-apireview-hub-artifacts-{0}.yml@{0}-repo', parameters.language) }}
          parameters:
            requestMode: ${{ parameters.requestMode }}
            operationId: ${{ parameters.operationId }}
            packageName: ${{ parameters.packageName }}
            ref: ${{ parameters.targetRef }}
            kind: target
            outputDir: $(Build.ArtifactStagingDirectory)/target
            workingDir: $(Pipeline.Workspace)/apireview/target

            # The web service reads this summary to decide whether the operation
            # succeeded, whether a create request changed API shape, and which build
            # artifacts to download.
        - pwsh: |
            $ErrorActionPreference = 'Stop'

            $targetMetadataPath = '$(Build.ArtifactStagingDirectory)/target/artifact-metadata.json'
            $targetMetadata = Get-Content -Raw -Path $targetMetadataPath | ConvertFrom-Json
            $artifacts = [ordered]@{
              target = $env:ARH_TARGET_ARTIFACT_NAME
              result = $env:ARH_RESULT_ARTIFACT_NAME
            }

            $baseRef = $env:ARH_BASE_REF
            if ([string]::IsNullOrWhiteSpace($baseRef)) {
              $baseRef = ''
            }

            $hasBaseline = -not [string]::IsNullOrWhiteSpace($baseRef)
            $baseVersion = ''
            $changed = $null
            if ($hasBaseline) {
              $baseMetadataPath = '$(Build.ArtifactStagingDirectory)/base/artifact-metadata.json'
              $baseMetadata = Get-Content -Raw -Path $baseMetadataPath | ConvertFrom-Json
              $baseVersion = $baseMetadata.version
              $artifacts.base = $env:ARH_BASE_ARTIFACT_NAME

              $baseHash = (Get-FileHash -Algorithm SHA256 -Path '$(Build.ArtifactStagingDirectory)/base/api.md').Hash
              $targetHash = (Get-FileHash -Algorithm SHA256 -Path '$(Build.ArtifactStagingDirectory)/target/api.md').Hash
              $changed = $baseHash -ne $targetHash
            }

            $summary = [ordered]@{
              operationId = $env:ARH_OPERATION_ID
              mode = $env:ARH_REQUEST_MODE
              language = $env:ARH_LANGUAGE
              repositoryFullName = $targetMetadata.repositoryFullName
              packageName = $env:ARH_PACKAGE_NAME
              baseRef = $baseRef
              targetRef = $env:ARH_TARGET_REF
              status = 'succeeded'
              changed = $changed
              baseVersion = $baseVersion
              targetVersion = $targetMetadata.version
              packageRelativePath = $targetMetadata.packageRelativePath
              artifacts = $artifacts
            }

            $summary | ConvertTo-Json -Depth 10 | Set-Content -Path '$(Build.ArtifactStagingDirectory)/result/result-summary.json' -Encoding utf8
            Get-Content -Path '$(Build.ArtifactStagingDirectory)/result/result-summary.json'
          displayName: 'Compare and write result summary'
          env:
            ARH_BASE_ARTIFACT_NAME: ${{ parameters.baseArtifactName }}
            ARH_BASE_REF: ${{ parameters.baseRef }}
            ARH_LANGUAGE: ${{ parameters.language }}
            ARH_OPERATION_ID: ${{ parameters.operationId }}
            ARH_PACKAGE_NAME: ${{ parameters.packageName }}
            ARH_REQUEST_MODE: ${{ parameters.requestMode }}
            ARH_RESULT_ARTIFACT_NAME: ${{ parameters.resultArtifactName }}
            ARH_TARGET_ARTIFACT_NAME: ${{ parameters.targetArtifactName }}
            ARH_TARGET_REF: ${{ parameters.targetRef }}

        # Ensure failed runs still publish an operation result artifact that the
        # web service can surface to callers.
        - pwsh: |
            $ErrorActionPreference = 'Stop'

            New-Item -ItemType Directory -Force -Path '$(Build.ArtifactStagingDirectory)/result' | Out-Null
            $baseRef = $env:ARH_BASE_REF
            if ([string]::IsNullOrWhiteSpace($baseRef)) {
              $baseRef = ''
            }

            $summary = [ordered]@{
              operationId = $env:ARH_OPERATION_ID
              mode = $env:ARH_REQUEST_MODE
              language = $env:ARH_LANGUAGE
              packageName = $env:ARH_PACKAGE_NAME
              baseRef = $baseRef
              targetRef = $env:ARH_TARGET_REF
              status = 'failed'
              artifacts = [ordered]@{
                result = $env:ARH_RESULT_ARTIFACT_NAME
              }
            }

            $summary | ConvertTo-Json -Depth 10 | Set-Content -Path '$(Build.ArtifactStagingDirectory)/result/result-summary.json' -Encoding utf8
            Get-Content -Path '$(Build.ArtifactStagingDirectory)/result/result-summary.json'
          displayName: 'Write failure result summary'
          condition: failed()
          env:
            ARH_BASE_REF: ${{ parameters.baseRef }}
            ARH_LANGUAGE: ${{ parameters.language }}
            ARH_OPERATION_ID: ${{ parameters.operationId }}
            ARH_PACKAGE_NAME: ${{ parameters.packageName }}
            ARH_REQUEST_MODE: ${{ parameters.requestMode }}
            ARH_RESULT_ARTIFACT_NAME: ${{ parameters.resultArtifactName }}
            ARH_TARGET_REF: ${{ parameters.targetRef }}

        - ${{ if ne(trim(parameters.baseRef), '') }}:
          - task: PublishBuildArtifacts@1
            displayName: 'Publish base API review bundle'
            condition: succeeded()
            inputs:
              pathtoPublish: '$(Build.ArtifactStagingDirectory)/base'
              artifactName: '${{ parameters.baseArtifactName }}'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish target API review bundle'
          condition: succeeded()
          inputs:
            pathtoPublish: '$(Build.ArtifactStagingDirectory)/target'
            artifactName: '${{ parameters.targetArtifactName }}'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish API review result summary'
          condition: succeededOrFailed()
          inputs:
            pathtoPublish: '$(Build.ArtifactStagingDirectory)/result'
            artifactName: '${{ parameters.resultArtifactName }}'

- stage: Notify
  displayName: 'Notify API Review Hub'
  dependsOn: Generate
  condition: always()
  variables:
    generationResult: $[ dependencies.Generate.result ]
  jobs:
  - job: NotifyApiReviewHub
    displayName: 'Notify API Review Hub of artifact completion'
    pool:
      name: azsdk-pool
      demands: ImageOverride -equals ubuntu-24.04
    steps:
      - checkout: none

      # API Review Hub treats this as a signal, then verifies the operation/run
      # identity and downloads artifacts from ADO itself.
      - task: AzurePowerShell@5
        displayName: 'Notify API Review Hub of artifact completion'
        inputs:
          azureSubscription: 'ADO to ARH Service Connection'
          azurePowerShellVersion: latestVersion
          pwsh: true
          ScriptType: InlineScript
          Inline: |
            $ErrorActionPreference = 'Stop'

            if ([string]::IsNullOrWhiteSpace($env:ARH_COMPLETION_CALLBACK_URL)) {
              throw 'completionCallbackUrl is required.'
            }

            try {
              $tokenResponse = Get-AzAccessToken -ResourceUrl $env:ARH_CALLBACK_TOKEN_AUDIENCE -AsSecureString -ErrorAction Stop
            }
            catch {
              throw "Failed to acquire access token for API Review Hub callback audience '$($env:ARH_CALLBACK_TOKEN_AUDIENCE)': $($_.Exception.Message)"
            }

            $secureToken = $tokenResponse.Token
            if (-not $secureToken) {
              throw "Failed to acquire access token for API Review Hub callback audience '$($env:ARH_CALLBACK_TOKEN_AUDIENCE)'"
            }

            $token = [System.Net.NetworkCredential]::new('', $secureToken).Password
            if (-not $token) {
              throw 'Acquired API Review Hub callback token was empty after unwrap'
            }

            $callbackProofToken = $env:ARH_CALLBACK_PROOF_TOKEN
            if ([string]::IsNullOrWhiteSpace($callbackProofToken)) {
              throw 'callbackProofToken is required.'
            }

            $body = [ordered]@{
              operationId = $env:ARH_OPERATION_ID
              mode = $env:ARH_REQUEST_MODE
              language = $env:ARH_LANGUAGE
              buildId = $env:ARH_BUILD_ID
              project = $env:ARH_PROJECT
              result = $env:ARH_GENERATION_RESULT
              artifacts = [ordered]@{
                result = $env:ARH_RESULT_ARTIFACT_NAME
              }
            }

            if ($env:ARH_GENERATION_RESULT -eq 'Succeeded' -or $env:ARH_GENERATION_RESULT -eq 'SucceededWithIssues') {
              $body.artifacts.target = $env:ARH_TARGET_ARTIFACT_NAME
            }

            $baseRef = $env:ARH_BASE_REF
            $hasBaseline = -not [string]::IsNullOrWhiteSpace($baseRef)
            if ($hasBaseline -and ($env:ARH_GENERATION_RESULT -eq 'Succeeded' -or $env:ARH_GENERATION_RESULT -eq 'SucceededWithIssues')) {
              $body.artifacts.base = $env:ARH_BASE_ARTIFACT_NAME
            }

            $completionCallbackUrl = $env:ARH_COMPLETION_CALLBACK_URL
            if ($completionCallbackUrl.EndsWith('/')) {
              $completionCallbackUrl = "${completionCallbackUrl}$($env:ARH_OPERATION_ID)"
            }

            $completionCallbackUri = $null
            if (-not [System.Uri]::TryCreate($completionCallbackUrl, [System.UriKind]::Absolute, [ref] $completionCallbackUri)) {
              throw "completionCallbackUrl '$completionCallbackUrl' is not a valid absolute URI."
            }

            $headers = @{
              Authorization = "Bearer $token"
              'Content-Type' = 'application/json'
              'x-arh-callback-proof' = $callbackProofToken
            }

            if (-not $headers.ContainsKey('x-arh-callback-proof') -or [string]::IsNullOrWhiteSpace($headers['x-arh-callback-proof'])) {
              throw 'x-arh-callback-proof header is required for API Review Hub callback.'
            }
            $jsonBody = $body | ConvertTo-Json -Depth 10 -Compress

            Write-Host "Completion callback URL: $completionCallbackUrl"
            Write-Host "Completion callback body: $jsonBody"
            Invoke-WebRequest -Method POST -Uri $completionCallbackUri -Headers $headers -Body $jsonBody -MaximumRetryCount 3 | Out-Null
        env:
          ARH_BASE_ARTIFACT_NAME: ${{ parameters.baseArtifactName }}
          ARH_BASE_REF: ${{ parameters.baseRef }}
          ARH_BUILD_ID: $(Build.BuildId)
          ARH_CALLBACK_PROOF_TOKEN: ${{ parameters.callbackProofToken }}
          ARH_CALLBACK_TOKEN_AUDIENCE: $(callbackTokenAudience)
          ARH_COMPLETION_CALLBACK_URL: $(completionCallbackUrl)
          ARH_GENERATION_RESULT: $(generationResult)
          ARH_LANGUAGE: ${{ parameters.language }}
          ARH_OPERATION_ID: ${{ parameters.operationId }}
          ARH_PROJECT: $(System.TeamProject)
          ARH_REQUEST_MODE: ${{ parameters.requestMode }}
          ARH_RESULT_ARTIFACT_NAME: ${{ parameters.resultArtifactName }}
          ARH_TARGET_ARTIFACT_NAME: ${{ parameters.targetArtifactName }}
