steps:
  - template: /eng/pipelines/templates/steps/install-dotnet.yml

  # We install .NET 9.0.102 SDK in addition to .NET coming from global.json because the current SHA in
  # /eng/common-tests/matrix-generator/pr-matrix-samples/pr-matrix-generation-acceptance.helpers.ps1 for azure-sdk-for-net repo has a SHA
  # whose global.json specifies 9.0.102. Given that when running Pester tests, 'git clone' happens after the global.json (in the root of this repo)
  # is read, it does not end up installing 9.0.102 from the cloned repo's global.json, and we end up with more recent (10.0+) version only,
  # so the test fails to build. In the future, we should update azure-sdk-for-net's SHA to more recent SHA that specifies a newer .NET version
  # in its global.json, but then we also should update the baseline files for the tests.
  # That will work until we update global.json in the root of this repo once again. Alternatively, we can refactor the Pester test helpers,
  # so that that cloning the repos and building the tests are two separate steps, so then we could tell the tooling to install the version
  # that is required per cloned repo's global.json, if it is not present on the machine by that moment.
  # Alternatively, given that it took about two years for this issue to manifest with 9.0.102,
  # we could keep updating the version below next time it fails for the next couple of years.
  - task: UseDotNet@2
    displayName: "Use .NET SDK 9.0.102"
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: 9.0.102
      performMultiLevelLookup: true

  - template: /eng/common/pipelines/templates/steps/login-to-github.yml

  - template: /eng/pipelines/templates/steps/test-proxy-local-tool.yml
    parameters:
      runProxy: false
      rootFolder: $(Build.SourcesDirectory)

  - template: /eng/common/pipelines/templates/steps/run-pester-tests.yml
    parameters:
      TargetTags: "Integration"
      TargetDirectory: tools/test-proxy/scripts/test-scripts/
      EnvVars:
        GIT_TOKEN: $(GH_TOKEN)
        GIT_COMMIT_OWNER: azure-sdk
        GIT_COMMIT_EMAIL: azuresdk@microsoft.com
