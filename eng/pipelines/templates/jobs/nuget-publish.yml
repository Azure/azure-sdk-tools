parameters:
  - name: DependsOn
    type: object
    default: []
  - name: ArtifactName
    type: string
    default: 'packages'
  - name: Feed
    type: string
    default: 'public/azure-sdk-for-net'
  - name: UseEsrpForNugetOrg
    type: boolean
    default: true
  - name: PublishEnvironment
    type: string
    default: 'none'
  - name: ShouldSign
    type: boolean
    default: true
  - name: ShouldPublish
    type: boolean
    default: true
  - name: ShouldPublishSymbols
    type: boolean
    default: true
  - name: VerifyChangelog
    type: boolean
    default: false
  - name: RequireStrongNames
    type: boolean
    default: true

jobs:
  - job: PrePackagePublish
    displayName: Prepare package for publishing
    dependsOn: ${{ parameters.DependsOn }}
    pool:
      name: $(WINDOWSPOOL)
      image: $(WINDOWSVMIMAGE)
      os: windows

    variables:
    - name: Artifacts
      value: $(Pipeline.Workspace)/${{ parameters.ArtifactName }}
    - name: BuildToolPath
      value: $(Pipeline.Workspace)/_azure-sdk-build-tools

    templateContext:
      outputs:
        - output: pipelineArtifact
          displayName: Upload packages to publish
          condition: succeededOrFailed()
          artifactName: ${{ parameters.ArtifactName }}-signed
          targetPath: $(Artifacts)

    steps:
      - checkout: azure-sdk-build-tools
        path: _azure-sdk-build-tools

      - checkout: self

      - download: none # Disable the automatic downloading so that we can download ourselves to the location we want.
      - task: DownloadPipelineArtifact@2
        displayName: Download Packages
        inputs:
          artifact: ${{ parameters.ArtifactName }}
          path: $(Artifacts)

      - ${{ if eq(parameters.VerifyChangelog, true) }}:
        - pwsh: |
            $(Build.SourcesDirectory)\azure-sdk-tools\eng\scripts\Verify-Nuget-Artifact-Changelogs.ps1 -ArtifactsPath "$(Artifacts)" -ForRelease $true
          displayName: Verify Changelogs for artifacts

      - ${{ if eq(parameters.ShouldSign, true) }}:
        - template: pipelines/steps/net-signing.yml@azure-sdk-build-tools
          parameters:
            PackagesPath: $(Artifacts)
            BuildToolsPath: $(BuildToolPath)
            RequireStrongNames: ${{ parameters.RequireStrongNames }}

      - ${{ if eq(parameters.ShouldPublishSymbols, true) }}:
        - template: pipelines/steps/publish-symbols.yml@azure-sdk-build-tools
          parameters:
            BuildToolsRepositoryPath: $(BuildToolPath)
            PackagesPath: $(Artifacts)
            StagingDirectory: $(Build.ArtifactStagingDirectory)/symbols

  - ${{ if eq(parameters.ShouldPublish, true) }}:
    - deployment: PublishPackage
      displayName: Publish package to ${{ parameters.Feed }}
      condition: and(succeeded(), ne(variables['Skip.PublishPackage'], 'true'))
      environment: ${{ parameters.PublishEnvironment }}
      dependsOn: PrePackagePublish

      pool: # Have to hardcode name and image because deployments don't support variables
        name: azsdk-pool
        image: windows-2022 # Nuget publish requires .NET framework on windows to handle the auth
        os: windows

      variables:
      - name: Artifacts
        value: $(Pipeline.Workspace)/${{ parameters.ArtifactName }}-signed

      templateContext:
        type: releaseJob
        isProduction: true
        inputs:
          - input: pipelineArtifact
            artifactName: ${{ parameters.ArtifactName }}-signed
            targetPath: $(Artifacts)

      strategy:
        runOnce:
          deploy:
            steps:
              - ${{ if and(eq(parameters.Feed, 'Nuget.org'), eq(parameters.UseEsrpForNugetOrg, true)) }}:
                - pwsh: |
                    $source = '$(Artifacts)'
                    $destination = '$(Pipeline.Workspace)/esrp-release/nuget'
                    $packages = @(Get-ChildItem -LiteralPath $source -Recurse -File -Filter '*.nupkg' |
                      Where-Object { $_.Name -notlike '*.symbols.nupkg' })
                    if ($packages.Count -eq 0) {
                      throw "No product NuGet packages found in $source"
                    }
                    $duplicates = @($packages | Group-Object Name | Where-Object Count -gt 1)
                    if ($duplicates.Count -gt 0) {
                      throw "Duplicate NuGet package filenames found: $($duplicates.Name -join ', ')"
                    }
                    if (Test-Path -LiteralPath $destination) {
                      Remove-Item -LiteralPath $destination -Recurse -Force
                    }
                    New-Item -ItemType Directory -Path $destination | Out-Null
                    $packages | Copy-Item -Destination $destination
                  displayName: Stage NuGet packages for ESRP

                - task: EsrpRelease@14
                  displayName: Publish to ${{ parameters.Feed }} via ESRP
                  inputs:
                    ConnectedServiceName: 'Azure SDK PME Managed Identity'
                    ClientId: '5f81938c-2544-4f1f-9251-dd9de5b8a81b'
                    DomainTenantId: '975f013f-7f24-47e8-a7d3-abc4752bf346'
                    UseManagedIdentity: true
                    KeyVaultName: 'kv-azuresdk-codesign'
                    SignCertName: 'azure-sdk-esrp-release-certificate'
                    Intent: 'PackageDistribution'
                    ContentType: 'NuGet'
                    OrganizationName: 'azure-sdk'
                    ContentSource: 'Folder'
                    FolderLocation: '$(Pipeline.Workspace)/esrp-release/nuget'
                    WaitForReleaseCompletion: true
                    Owners: ${{ coalesce(variables['Build.RequestedForEmail'], 'azuresdk@microsoft.com') }}
                    Approvers: ${{ coalesce(variables['Build.RequestedForEmail'], 'azuresdk@microsoft.com') }}
                    ServiceEndpointUrl: 'https://api.esrp.microsoft.com'
                    MainPublisher: 'ESRPRELPACMAN'

              - ${{ if or(ne(parameters.Feed, 'Nuget.org'), eq(parameters.UseEsrpForNugetOrg, false)) }}:
                - task: 1ES.PublishNuget@1
                  displayName: Publish to ${{ parameters.Feed }}
                  inputs:
                    packageParentPath: '$(Pipeline.Workspace)'
                    packagesToPush: '$(Artifacts)/**/*.nupkg;!$(Artifacts)/**/*.symbols.nupkg'
                    ${{ if eq(parameters.Feed, 'Nuget.org') }}:
                      nuGetFeedType: external
                      publishFeedCredentials: Nuget.org
                    ${{ if ne(parameters.Feed, 'Nuget.org') }}:
                      publishVstsFeed: ${{ parameters.Feed }}
