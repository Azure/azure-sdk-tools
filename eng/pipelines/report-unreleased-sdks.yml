trigger: none
pr: none

variables:
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: ReportUnreleasedSdks
        jobs:
          - job: ReportUnreleasedSdks
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux

            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish private smoke-test evidence
                  condition: succeededOrFailed()
                  targetPath: $(Build.ArtifactStagingDirectory)/past-due-smoke-17552
                  artifactName: past-due-smoke-17552

            steps:
              - checkout: self
                fetchDepth: 2

              # Private Preview spec PRs require an authenticated GitHub read.
              - template: /eng/common/pipelines/templates/steps/login-to-github.yml
                parameters:
                  TokenOwners:
                    - Azure

              - template: /eng/pipelines/templates/steps/install-dotnet.yml

              - task: PowerShell@2
                displayName: Build PR CLI and render synthetic reminders without sending
                env:
                  AZSDKTOOLS_NOTIFICATION_SERVICE_URL: ''
                inputs:
                  targetType: filePath
                  filePath: eng/verification/past-due-smoke/Invoke-PastDueSmoke.ps1
                  arguments: '-Phase BuildAndRender -OutputDirectory "$(Build.ArtifactStagingDirectory)/past-due-smoke-17552"'
                  pwsh: true
                  workingDirectory: '$(System.DefaultWorkingDirectory)'

              - task: AzureCLI@2
                displayName: Read-only cleanup preview using PR-built CLI
                env:
                  AZSDKTOOLS_NOTIFICATION_SERVICE_URL: ''
                  GITHUB_TOKEN: $(GH_TOKEN)
                inputs:
                  azureSubscription: opensource-api-connection
                  scriptType: pscore
                  scriptLocation: scriptPath
                  scriptPath: eng/verification/past-due-smoke/Invoke-PastDueSmoke.ps1
                  arguments: '-Phase DryRun -OutputDirectory "$(Build.ArtifactStagingDirectory)/past-due-smoke-17552"'