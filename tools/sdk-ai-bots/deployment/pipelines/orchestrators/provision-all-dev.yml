# Orchestrator pipeline — full dev provision.
# Provisions the whole Azure infra graph for dev via `azd provision`.
# Runs the postprovision hook as part of azd's lifecycle.
#
# Shape delegated to templates/provision-stage.yml. Dev skips bicep-validate /
# what-if because rapid iteration is expected.

name: tools - sdk-ai-bots - provision-all-dev

trigger: none
pr: none

parameters:
    - { name: bootstrapLayers, displayName: 'Bootstrap missing layered state (preview + apply each layer)', type: boolean, default: false }

variables:
    - template: /eng/pipelines/templates/variables/globals.yml
    - template: /eng/pipelines/templates/variables/image.yml

extends:
    template: /eng/pipelines/templates/stages/1es-redirect.yml
    parameters:
        Use1ESOfficial: true
        stages:
            - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-stage.yml
              parameters:
                  environment: dev
                  serviceConnection: azure-sdk-tests-playground
                  authenticateBeforeEnvironmentLoad: true
                  runValidateAndPreview: false
                  runProvision: true
                  bootstrapLayers: ${{ parameters.bootstrapLayers }}
                  showReadinessReminder: false

