# Expected fixture overlays are reference-only and are never mounted in a trial.

name: azure-typespec-author-eval
description: Require variant-specific fields under an explicit discriminator. Source discussion case
  104029; ready.
version: "1.0"
type: capability
area: decorators
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 004005-decorate-discriminator-dependent-fields-trigger
    tags:
      suite: decorators
      mode: trigger
    prompt: >-
      EmployeeProperties.foo refers to Foo with fooType a/b and optional fooA/fooB. Model the
      dependency so the a variant requires fooA and the b variant requires fooB using model
      inheritance and @discriminator("fooType"). Preserve literal values a/b even though the leaf
      schema names differ, relying on AutoRest's x-ms-discriminator-value extension rather than
      pretending standard Swagger2 schema-name mapping alone handles them.

      Name the leaf models FooVariantA and FooVariantB, retaining FooType's a/b wire values and the
      existing FooA/FooB payload models. Require only fooA on the a leaf and only fooB on the b
      leaf.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: &a1
      files:
        - src: ../fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../fixtures/004005-decorate-discriminator-dependent-fields/input/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.cjs
          dest: check-node-dependencies.cjs
        - src: ../scripts/check-discussion-case.mjs
          dest: check-discussion-case.mjs
        - src: ../fixtures/004005-decorate-discriminator-dependent-fields/contract.json
          dest: discussion-contract.json
      commands:
        - node -e "const fs=require('fs');const
          t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    rubric: &a2
      - The a leaf requires fooA and the b leaf requires fooB.
      - The explicit discriminator values remain a/b, independent of leaf schema names.
      - Optional fooA/fooB are removed from the common base so they are not inherited by both known
        variants.
      - This completes the source's abbreviated discriminator example with the actual dependent payload
        fields from its question. AutoRest emits x-ms-discriminator-value a/b for differently named
        schemas. This is known-leaf conditional requiredness, not a closed-object XOR guarantee;
        Swagger2 consumers must understand the Azure extension and a generic schema validator may
        not dynamically dispatch on discriminator. The alternative @discriminated union shown in the
        answer is not substituted because SDK support is emitter-dependent.
      - Do not claim unexecuted SDK, external lint, or ARM review validation.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - &a3
        type: run-command
        name: fixture-dependencies
        config:
          command: node check-node-dependencies.cjs packages
          expected_exit_code: 0
      - &a4
        type: run-command
        name: compile-typespec
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &a5
        type: run-command
        name: fresh-compiled-contract
        config:
          command: node check-discussion-case.mjs
          expected_exit_code: 0
      - &a6
        type: prompt
        name: semantic-answer-and-limitations
        config:
          prompt: >-
            Evaluate the completed task against the stimulus rubric. Accept semantically equivalent
            valid TypeSpec, not just matching text or comments. Require the actual requested
            wire/version/client-metadata behavior, preservation of unrelated contracts, and the
            scenario's stated qualifications. Reject unsupported claims that compiling TypeSpec or
            AutoRest proves generated SDK behavior, external LintDiff success, or management-plane
            approval.


            Scenario-specific expectations:

            - The a leaf requires fooA and the b leaf requires fooB.

            - The explicit discriminator values remain a/b, independent of leaf schema names.

            - Optional fooA/fooB are removed from the common base so they are not inherited by both
            known variants.

            - This completes the source's abbreviated discriminator example with the actual
            dependent payload fields from its question. AutoRest emits x-ms-discriminator-value a/b
            for differently named schemas. This is known-leaf conditional requiredness, not a
            closed-object XOR guarantee; Swagger2 consumers must understand the Azure extension and
            a generic schema validator may not dynamically dispatch on discriminator. The
            alternative @discriminated union shown in the answer is not substituted because SDK
            support is emitter-dependent.

            - Do not claim unexecuted SDK, external lint, or ARM review validation.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.8
    constraints:
      max_turns: 14
      max_tokens: 100000
