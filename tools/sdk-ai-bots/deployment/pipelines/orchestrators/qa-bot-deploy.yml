# Provisions the complete environment or one selected infrastructure scope, then
# deploys the selected application component when applicable.
name: tools - sdk-ai-bots - deploy

trigger: none
pr: none

parameters:
    - name: component
      type: string
      default: all
      values: [all, shared-resources, agent, frontend, agent-server, function-app, logic-app]
    - name: environment
      type: string
      default: dev
      values: [dev, preview, prod]
    # Azure DevOps runtime parameters are non-nullable. `auto` means no
    # operator override and is normalized by each image-tag selector.
    - name: imageTag
      displayName: Image tag override (optional)
      type: string
      default: auto

variables:
    - template: /eng/pipelines/templates/variables/globals.yml
    - template: /eng/pipelines/templates/variables/image.yml
    - template: /tools/sdk-ai-bots/deployment/pipelines/templates/service-connection.yml
      parameters:
          environment: ${{ parameters.environment }}

extends:
    template: /eng/pipelines/templates/stages/1es-redirect.yml
    parameters:
        Use1ESOfficial: true
        stages:
            - ${{ if eq(parameters.component, 'all') }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-with-approval.yml
                    parameters:
                        environment: ${{ parameters.environment }}
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/deploy-stage.yml
                    parameters:
                        environment: ${{ parameters.environment }}
                        imageTag: ${{ parameters.imageTag }}
                        dependsOn: Provision
                        ${{ if eq(parameters.environment, 'prod') }}:
                            stabilizationSeconds: 600

            - ${{ if eq(parameters.component, 'shared-resources') }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/layer-provision-stage.yml
                    parameters:
                        layer: shared-resources
                        dependencyLayers: resource-group
                        provisionResourceGroup: true
                        environment: ${{ parameters.environment }}
                        operation: preview
                        stageName: PreflightLayer
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/approval-stage.yml
                    parameters:
                        environment: ${{ parameters.environment }}
                        stageName: ApproveLayer
                        dependsOn: PreflightLayer
                        preflightJobName: AzdProvisionLayer
                        scope: resource-group and shared-resources layers
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/layer-provision-stage.yml
                    parameters:
                        layer: shared-resources
                        dependencyLayers: resource-group
                        provisionResourceGroup: true
                        environment: ${{ parameters.environment }}
                        operation: apply
                        stageName: ProvisionLayer
                        dependsOn: ApproveLayer

            - ${{ if eq(parameters.component, 'agent-server') }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-and-deploy-component.yml
                    parameters:
                        component: agent-server
                        dependencyLayers: resource-group,shared-resources,agent,frontend
                        environment: ${{ parameters.environment }}
                        imageTag: ${{ parameters.imageTag }}

            - ${{ if eq(parameters.component, 'function-app') }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-and-deploy-component.yml
                    parameters:
                        component: function-app
                        dependencyLayers: resource-group,shared-resources,frontend
                        environment: ${{ parameters.environment }}
                        imageTag: ${{ parameters.imageTag }}

            - ${{ if eq(parameters.component, 'agent') }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-and-deploy-component.yml
                    parameters:
                        component: agent
                        dependencyLayers: resource-group,shared-resources
                        environment: ${{ parameters.environment }}
                        imageTag: ${{ parameters.imageTag }}

            - ${{ if eq(parameters.component, 'frontend') }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/provision-and-deploy-component.yml
                    parameters:
                        component: frontend
                        dependencyLayers: resource-group,shared-resources
                        environment: ${{ parameters.environment }}
                        imageTag: ${{ parameters.imageTag }}

            - ${{ if eq(parameters.component, 'logic-app') }}:
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/layer-provision-stage.yml
                    parameters:
                        layer: logic-app
                        dependencyLayers: resource-group,shared-resources,frontend,agent-server,function-app
                        environment: ${{ parameters.environment }}
                        operation: preview
                        stageName: PreflightLayer
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/approval-stage.yml
                    parameters:
                        environment: ${{ parameters.environment }}
                        stageName: ApproveLayer
                        dependsOn: PreflightLayer
                        preflightJobName: AzdProvisionLayer
                        scope: logic-app layer
                  - template: /tools/sdk-ai-bots/deployment/pipelines/templates/layer-provision-stage.yml
                    parameters:
                        layer: logic-app
                        dependencyLayers: resource-group,shared-resources,frontend,agent-server,function-app
                        environment: ${{ parameters.environment }}
                        operation: apply
                        stageName: ProvisionLayer
                        dependsOn: ApproveLayer