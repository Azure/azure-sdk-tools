steps:
  # No-skill evals remove the azure-typespec-author skill, but the eval files
  # still declare the azsdk-mcp environment. Smoke-test the staged MCP binary
  # before Vally starts so MCP initialization failures fail early and clearly.
  - script: |
      set -e
      node .github/skills/azure-typespec-author/evaluate/scripts/smoke-test-mcp.js -- \
        dotnet artifacts/mcp/cli/azsdk.dll start
    displayName: 'Smoke test staged live MCP binary'
    env:
      AZSDKTOOLS_AGENT_TESTING: "false"
      AZSDKTOOLS_COLLECT_TELEMETRY: "false"
      AZURE_SDK_KB_ENDPOINT: "https://azuresdkqabot-test-serv-agent-dydweeaxaah6g3b4.westus2-01.azurewebsites.net"
      AZURE_SDK_KB_CLIENT_ID: "674414e1-152b-41ac-b0d2-763535edea6c"
      AZURE_SDK_KB_SCOPE: "api://azure-sdk-qa-bot-test/user_impersonation"

  - template: /.github/skills/azure-typespec-author/evaluate/pipeline/skill/typespec-author-preeval.yml
    parameters:
      prepareNoSkill: true
