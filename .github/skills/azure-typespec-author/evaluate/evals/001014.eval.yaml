name: azure-typespec-author-preview-planning-eval
description: Preview replacement and excluded-default source planning regression.
type: capability
area: versioning
environment:
  skills:
    - ../../../../../artifacts/typespec-author-skills/azure-typespec-author
  files:
    - src: ../fixtures/001005-version-add-preview-after-preview/main.tsp
      dest: main.tsp
    - src: ../fixtures/001005-version-add-preview-after-preview/employee.tsp
      dest: employee.tsp
tags:
  area: azure-typespec-author
  suite: versioning
  mode: forced
defaults:
  runs: 1
  timeout: "180s"
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1.0
stimuli:
  - name: 001014-preview-replacement-reverses-excluded-default
    prompt: |
      Invoke azure-typespec-author for Step 3 source planning only. Project
      analysis, intake, and grounding from the authoritative preview-after-preview
      versioning guide are complete. The supplied main.tsp and employee.tsp are
      the relevant existing ARM declarations. Add 2025-05-04-preview, exclude
      the preview's added age default, and carry all other features forward.
      Client configuration is explicitly opted out.

      Use the files and bundled references to build the source plan only; do
      not edit files, fetch network content, call MCP, compile, or generate.
      Return JSON with:
      "versions": the ordered wire API versions after the change;
      "ageDeclaration": the complete planned age property including decorators;
      "oldAgeRetained": whether a renamed age companion remains;
      "workLocationVersion" and "assetsTypeChangeVersion": the planned version
      decorator arguments as wire API versions;
      "exampleVersions": version folders to retain under the TypeSpec project's
      examples directory (all existing version folders currently match the enum);
      "applied": whether changes have been applied.
    constraints:
      max_turns: 14
      max_tokens: 20000
    graders:
      - type: skill-invocation
        config:
          required: [azure-typespec-author]
          disallowed: [azsdk-common-typespec-naming]
      - type: tool-calls
        config:
          required:
            - name: "^(view|powershell|bash|rg)$"
              pattern: "authoring-plan\\.md"
              result: "(?is)replace the latest preview.*remove both bridged declarations"
            - name: "^(view|powershell|bash|rg)$"
              pattern: "main\\.tsp|employee\\.tsp"
          disallowed:
            - name: "azsdk_"
            - name: "^(edit|create|apply_patch|web_fetch|web_search)$"
      - type: output-matches
        config:
          pattern: '"versions"\s*:\s*\[\s*"2021-10-01"\s*,\s*"2025-05-04-preview"\s*\]'
      - type: output-matches
        config:
          pattern: '"ageDeclaration"\s*:\s*"(?:/\*\*[^"]*\*/(?:\\[rn]|\s)*)?age\?\s*:\s*int32\s*;"'
      - type: output-matches
        config:
          pattern: '"oldAgeRetained"\s*:\s*false'
      - type: output-matches
        config:
          pattern: '"workLocationVersion"\s*:\s*"2025-05-04-preview"'
      - type: output-matches
        config:
          pattern: '"assetsTypeChangeVersion"\s*:\s*"2025-05-04-preview"'
      - type: output-matches
        config:
          pattern: '"exampleVersions"\s*:\s*\[\s*"2021-10-01"\s*,\s*"2025-05-04-preview"\s*\]'
      - type: output-matches
        config:
          pattern: '"applied"\s*:\s*false'
