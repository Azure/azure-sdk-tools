# Source discussion 105098: typespec_2026_10_16.md
# Expected fixture overlays are reference-only and are never mounted in a trial.

name: azure-typespec-author-eval
description: Return a single-leaf polymorphic success base while preserving errors. Source
  discussion case 105098; ready.
version: "1.0"
type: capability
area: decorators
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 004010-decorate-single-leaf-success-polymorphism-trigger
    tags:
      suite: decorators
      mode: trigger
    prompt: >-
      The widget project has getEmployeePet returning Dog | ErrorResponse, with only one successful
      pet variant today. Prepare the SUCCESS response as an explicit polymorphic Pet base using
      @discriminator and one Dog leaf so future variants need not change the declared operation
      result from Dog to Pet. Keep the existing dog wire fields and error response, and explain why
      this does not guarantee a Rust enum or future SDK compatibility without running the SDK
      emitter.

      Use an open PetKind string union containing dog, retain Dog.displayName, and keep the original
      ErrorResponse failure contract.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: &a1
      files:
        - src: ../fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../fixtures/004010-decorate-single-leaf-success-polymorphism/input/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.cjs
          dest: check-node-dependencies.cjs
        - src: ../scripts/check-discussion-case.mjs
          dest: check-discussion-case.mjs
        - src: ../fixtures/004010-decorate-single-leaf-success-polymorphism/contract.json
          dest: discussion-contract.json
      commands:
        - node -e "const fs=require('fs');const
          t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    rubric: &a2
      - The successful response references Pet, not Dog.
      - Pet is discriminated even though Dog is its only current known leaf.
      - The dog literal mapping and reusable Dog payload persist.
      - The error response is not converted into a successful union variant.
      - The historical recommendation is a model-based @discriminator with a single leaf, not
        @discriminated on a one-member union. The operation now returns the base Pet for success and
        retains ErrorResponse for failures, while Dog remains a reusable concrete model. Swagger
        records a discriminator and leaf mapping even with one leaf. A compiler/AutoRest test cannot
        force a Rust SDK enum or prove that adding a new variant is universally nonbreaking; those
        are client-generator and language-specific contracts. Future union-extends support is not
        assumed.
      - Do not claim unexecuted SDK, external lint, or ARM review validation.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - &a3
        type: run-command
        name: fixture-dependencies
        config:
          command: node check-node-dependencies.cjs packages
          expected_exit_code: 0
      - &a4
        type: run-command
        name: compile-typespec
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &a5
        type: run-command
        name: fresh-compiled-contract
        config:
          command: node check-discussion-case.mjs
          expected_exit_code: 0
      - &a6
        type: prompt
        name: semantic-answer-and-limitations
        config:
          prompt: >-
            Evaluate the completed task against the stimulus rubric. Accept semantically equivalent
            valid TypeSpec, not just matching text or comments. Require the actual requested
            wire/version/client-metadata behavior, preservation of unrelated contracts, and the
            scenario's stated qualifications. Reject unsupported claims that compiling TypeSpec or
            AutoRest proves generated SDK behavior, external LintDiff success, or management-plane
            approval.


            Scenario-specific expectations:

            - The successful response references Pet, not Dog.

            - Pet is discriminated even though Dog is its only current known leaf.

            - The dog literal mapping and reusable Dog payload persist.

            - The error response is not converted into a successful union variant.

            - The historical recommendation is a model-based @discriminator with a single leaf, not
            @discriminated on a one-member union. The operation now returns the base Pet for success
            and retains ErrorResponse for failures, while Dog remains a reusable concrete model.
            Swagger records a discriminator and leaf mapping even with one leaf. A compiler/AutoRest
            test cannot force a Rust SDK enum or prove that adding a new variant is universally
            nonbreaking; those are client-generator and language-specific contracts. Future
            union-extends support is not assumed.

            - Do not claim unexecuted SDK, external lint, or ARM review validation.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.8
    constraints:
      max_turns: 14
      max_tokens: 100000
