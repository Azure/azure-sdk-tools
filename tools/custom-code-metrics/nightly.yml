trigger: none
pr: none

parameters:
  - name: DotNetGitHubServiceConnection
    displayName: Required read-only GitHub connection authorized for Azure/azure-sdk-for-net
    type: string
    default: SET_READ_ONLY_GITHUB_SERVICE_CONNECTION

resources:
  repositories:
    - repository: dotnet
      type: github
      name: Azure/azure-sdk-for-net
      endpoint: ${{ parameters.DotNetGitHubServiceConnection }}
      ref: refs/heads/main
      trigger: none

schedules:
  - cron: '0 8 * * *'
    displayName: Nightly custom code metrics (08:00 UTC)
    branches:
      include:
        - main
    always: true

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: CollectAndPublish
        condition: and(succeeded(), eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Repository.Name'], 'Azure/azure-sdk-tools'), in(variables['Build.Reason'], 'Schedule', 'Manual'))
        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml
          - name: MetricsNetCommit
            value: $[ resources.repositories.dotnet.version ]
          - name: MetricsSubscription
            value: faa080af-c1d8-40ad-9cce-e1a450ca5b57
          - name: MetricsStorageAccount
            value: azsdkcmibsokvwfsterm
        jobs:
          - job: DotNet
            timeoutInMinutes: 120
            pool:
              name: $(WINDOWSPOOL)
              image: $(WINDOWSVMIMAGE)
              os: windows
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1
                path: s/azure-sdk-tools
                persistCredentials: false
              - checkout: dotnet
                clean: true
                fetchDepth: 1
                path: s/azure-sdk-for-net
                persistCredentials: false
              - task: PowerShell@2
                displayName: Verify exact clean revisions and resolve .NET SDK
                inputs:
                  pwsh: true
                  filePath: $(Pipeline.Workspace)/s/azure-sdk-tools/tools/custom-code-metrics/Initialize-NightlyMetrics.ps1
                  arguments: >-
                    -RepoRoot "$(Pipeline.Workspace)\s\azure-sdk-for-net"
                    -ExpectedNetCommit "$(MetricsNetCommit)"
                    -ExpectedToolsCommit "$(Build.SourceVersion)"
              - task: UseDotNet@2
                displayName: Install exact .NET repository SDK
                inputs:
                  version: $(MetricsDotNetSdkVersion)
              - task: NodeTool@0
                inputs:
                  versionSpec: 22.x
              - task: Npm@1
                displayName: Restore pinned shared tooling
                inputs:
                  command: ci
                  workingDir: $(Pipeline.Workspace)/s/azure-sdk-tools/tools/custom-code-metrics
              - task: Npm@1
                displayName: Check canonical schema freshness
                inputs:
                  command: custom
                  customCommand: run check
                  workingDir: $(Pipeline.Workspace)/s/azure-sdk-tools/tools/custom-code-metrics
              - task: Npm@1
                displayName: Validate shared data and publishing contracts
                inputs:
                  command: custom
                  customCommand: run test:publishing
                  workingDir: $(Pipeline.Workspace)/s/azure-sdk-tools/tools/custom-code-metrics
              - task: PowerShell@2
                displayName: Install repository Pester version
                inputs:
                  pwsh: true
                  filePath: $(Pipeline.Workspace)/s/azure-sdk-tools/tools/custom-code-metrics/Install-TestDependencies.ps1
              - task: PowerShell@2
                displayName: Check schema mirror, validate adapter and collect .NET
                inputs:
                  pwsh: true
                  filePath: $(Pipeline.Workspace)/s/azure-sdk-tools/tools/custom-code-metrics/Collect-DotNetMetrics.ps1
                  arguments: >-
                    -RepoRoot "$(Pipeline.Workspace)\s\azure-sdk-for-net"
                    -OutputDirectory "$(Build.ArtifactStagingDirectory)\custom-code-metrics"
              - task: 1ES.PublishPipelineArtifact@1
                displayName: Retain measured snapshot
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/custom-code-metrics
                  artifactName: custom-code-metrics
              - task: AzureCLI@2
                displayName: Publish with federated container-scoped identity
                inputs:
                  azureSubscription: azure-sdk-playground-custom-code-metrics
                  visibleAzLogin: false
                  scriptType: pscore
                  scriptLocation: scriptPath
                  scriptPath: $(Pipeline.Workspace)/s/azure-sdk-tools/tools/custom-code-metrics/Publish-Metrics.ps1
                  arguments: >-
                    -SnapshotPath "$(MetricsSnapshotPath)"
                    -StorageAccount "$(MetricsStorageAccount)"
                    -SubscriptionId "$(MetricsSubscription)"
