# Source discussion 104039: typespec_2026_02_13.md
# Expected fixture overlays are reference-only and are never mounted in a trial.

name: azure-typespec-author-eval
description: Remove an obsolete Azure.Core version dependency. Source discussion case 104039; ready.
version: "1.0"
type: capability
area: versioning
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 001014-version-remove-obsolete-core-dependency-trigger
    tags:
      suite: versioning
      mode: trigger
    prompt: >-
      Widget still references the removed Azure.Core.Versions.v1_0_Preview_2 through @useDependency.
      Remove that obsolete dependency annotation while preserving the service's own version enum and
      ARM common-types versions.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: &a1
      files:
        - src: ../fixtures/001014-version-remove-obsolete-core-dependency/input/main.tsp
          dest: main.tsp
        - src: ../fixtures/discussion-widget/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.cjs
          dest: check-node-dependencies.cjs
        - src: ../scripts/check-discussion-case.mjs
          dest: check-discussion-case.mjs
        - src: ../fixtures/001014-version-remove-obsolete-core-dependency/contract.json
          dest: discussion-contract.json
      commands:
        - node -e "const fs=require('fs');const
          t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    rubric: &a2
      - No Azure.Core.Versions reference remains.
      - Both Widget versions still emit and retain ARM common types.
      - Pinned Azure.Core no longer exports this Versions enum. Removing that historical core dependency
        does not mean removing the actual Widget API versioning or ARM common-types dependency.
      - Do not claim unexecuted SDK, external lint, or ARM review validation.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - &a3
        type: run-command
        name: fixture-dependencies
        config:
          command: node check-node-dependencies.cjs packages
          expected_exit_code: 0
      - &a4
        type: run-command
        name: compile-typespec
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &a5
        type: run-command
        name: fresh-compiled-contract
        config:
          command: node check-discussion-case.mjs
          expected_exit_code: 0
      - &a6
        type: prompt
        name: semantic-answer-and-limitations
        config:
          prompt: >-
            Evaluate the completed task against the stimulus rubric. Accept semantically equivalent
            valid TypeSpec, not just matching text or comments. Require the actual requested
            wire/version/client-metadata behavior, preservation of unrelated contracts, and the
            scenario's stated qualifications. Reject unsupported claims that compiling TypeSpec or
            AutoRest proves generated SDK behavior, external LintDiff success, or management-plane
            approval.


            Scenario-specific expectations:

            - No Azure.Core.Versions reference remains.

            - Both Widget versions still emit and retain ARM common types.

            - Pinned Azure.Core no longer exports this Versions enum. Removing that historical core
            dependency does not mean removing the actual Widget API versioning or ARM common-types
            dependency.

            - Do not claim unexecuted SDK, external lint, or ARM review validation.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.8
    constraints:
      max_turns: 14
      max_tokens: 100000
  - name: 001014-version-remove-obsolete-core-dependency-forced
    tags:
      suite: versioning
      mode: forced
    prompt: >-
      @azure-typespec-author Widget still references the removed Azure.Core.Versions.v1_0_Preview_2
      through @useDependency. Remove that obsolete dependency annotation while preserving the
      service's own version enum and ARM common-types versions.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: *a1
    rubric: *a2
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
      - *a3
      - *a4
      - *a5
      - *a6
    constraints:
      max_turns: 14
      max_tokens: 100000
  - name: 001014-version-remove-obsolete-core-dependency-no-skill
    tags:
      suite: versioning
      mode: no-skill
    prompt: >-
      Widget still references the removed Azure.Core.Versions.v1_0_Preview_2 through @useDependency.
      Remove that obsolete dependency annotation while preserving the service's own version enum and
      ARM common-types versions.


      Work in the supplied Widget project at the workspace root. The API design decisions above are
      approved for this isolated authoring exercise. Keep unrelated schemas, API versions, and
      operations unchanged. I opt out of additional SDK client configuration or naming work; make
      only the explicitly requested source or client-metadata changes. Do not generate SDKs or claim
      an SDK, external lint, or ARM review was run when it was not.
    environment: *a1
    rubric: *a2
    graders:
      - *a3
      - *a4
      - *a5
      - *a6
    constraints:
      max_turns: 14
      max_tokens: 100000
scoring:
  weights:
    run-command: 0.85
    prompt: 0.1
    skill-invocation: 0.05
  threshold: 0.97
