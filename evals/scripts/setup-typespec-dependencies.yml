steps:
  - script: |
      set -e
      case "$EVAL_ARGS" in
        *tools/azsdk-customized-code-update-tool/*)
          npm ci --userconfig "$(Build.SourcesDirectory)/.npmrc"
          echo "##vso[task.setvariable variable=AZSDK_EVAL_NODE_MODULES]$(Build.SourcesDirectory)/evals/fixtures/typespec-dependencies/node_modules"
          echo "##vso[task.prependpath]$(Build.SourcesDirectory)/evals/fixtures/typespec-dependencies/node_modules/.bin"
          echo "##vso[task.setvariable variable=AZSDK_COPILOT_CLI_PATH]$(Build.SourcesDirectory)/evals/fixtures/typespec-dependencies/node_modules/.bin/copilot"
          ;;
        *)
          echo "No TypeSpec customization fixtures in this shard."
          ;;
      esac
    displayName: 'Install shared TypeSpec fixture dependencies'
    workingDirectory: $(Build.SourcesDirectory)/evals/fixtures/typespec-dependencies
    env:
      EVAL_ARGS: $(evalArgs)
