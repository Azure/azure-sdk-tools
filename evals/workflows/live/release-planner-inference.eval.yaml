name: azsdk-release-plan-inference
description: |
  Live release-plan parameter inference from a spec PR, followed by Java SDK
  generation and PR linking. Uses AZSDKTOOLS_AGENT_TESTING=true through the
  live MCP environment; the nightly pipeline cleans test plans and new SDK PRs.
version: "1.0"
type: capability
tags:
  area: release-plan
environment: azsdk-mcp-live
defaults:
  runs: 1
  timeout: 30m
  model: gpt-5.4
  executor: copilot-sdk
stimuli:
  - name: release-planner-infer-details-from-spec-pr
    environment:
      skills:
        - ../../../.github/skills/azsdk-common-prepare-release-plan
        - ../../../.github/skills/azsdk-common-generate-sdk-pipeline
      git:
        type: worktree
        source: ../../../artifacts/specs-cache/azure-rest-api-specs
        ref: main
    prompt: |
      Walk me through the full
      release-plan + SDK-generation flow for the Contoso Widget Manager
      end-to-end. Do every step below, in order, and use real tools (no
      dry-run, no simulation):

        1. Create the appropriate release plan using:
             - TypeSpec project: "specification/contosowidgetmanager/Contoso.Management"
             - service tree ID: "a7f2b8e4-9c1d-4a3e-b6f9-2d8e5a7c3b1f"
             - product tree ID: "f1a8c5d2-6e4b-4f7a-9c2d-8b5e1f3a6c9e"
             - spec pull request: "https://github.com/Azure/azure-rest-api-specs/pull/45567"

        2. Fetch the release plan you just created back from DevOps to confirm
           it was saved, and tell me its work-item ID.

        3. Kick off Java SDK generation only for that same TypeSpec project
           via the generation pipeline. Do not generate another language.
           Use the work-item ID from step 2.

        4. Once the generation pipeline reports a pull request URL, link
           that SDK pull request back to the release plan from step 2.

      My setup has already been verified, do not run azsdk_verify_setup.
    constraints:
      max_turns: 20
      max_tokens: 30000
    rubric:
      - The final assistant message states a numeric DevOps work-item ID for the created or confirmed release plan.
      - The final assistant message states a linked SDK PR URL under github.com/Azure/azure-sdk-for-java, and no other SDK language was generated.
      - The Java SDK release type matches the package's library versioning convention; beta is expected when the package has no stable release.
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-prepare-release-plan
          disallowed:
            - azsdk-common-generate-sdk-locally
      - type: tool-calls
        config:
          required:
            - azsdk_create_release_plan
            - azsdk_get_release_plan
            - azsdk_run_generate_sdk
            - azsdk_link_sdk_pull_request_to_release_plan
          disallowed:
            - azsdk_verify_setup
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Did the final assistant message clearly state ALL THREE of the
            following, consistent with the tools that were actually called?

              1. A numeric DevOps work-item ID for the release plan that was
                 created (or confirmed).

              2. A GitHub pull request URL on
                 github.com/Azure/azure-sdk-for-java that was linked back to
                 that release plan, with no generation attempted for another
                 language.

              3. The Java SDK release type matches the package's library
                 versioning convention. A beta release is valid and expected
                 when the Java package does not yet have a stable release.

            Answer "pass" only if ALL THREE are satisfied. Otherwise answer
            "fail" and briefly explain the inference or workflow failure.
scoring:
  weights:
    skill-invocation: 0.2
    tool-calls: 0.6
    prompt: 0.2
  threshold: 0.8
