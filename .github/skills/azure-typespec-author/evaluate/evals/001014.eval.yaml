name: azure-typespec-author-eval
description: Preview replacement and excluded-default source planning regression.
type: capability
area: versioning
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 001014-preview-replacement-reverses-excluded-default-trigger
    tags:
      suite: versioning
      mode: trigger
    prompt: |
      Plan the TypeSpec source changes only. Project analysis and intake are complete,
      including user confirmation of the feature exclusions below. Retrieve and follow the
      authoritative preview-after-preview versioning guide at
      https://azure.github.io/typespec-azure/docs/howtos/versioning/02-preview-after-preview/.
      The supplied main.tsp and employee.tsp are the relevant existing ARM declarations. Add
      2025-05-04-preview, exclude the preview's added age default, and carry all other
      features forward. Client configuration is explicitly opted out.

      Use the files and retrieved document to build the source plan only; do not edit files,
      compile, or generate. Return JSON with: "versions": the ordered wire API versions after
      the change; "ageDeclaration": the complete planned age property including decorators;
      "oldAgeRetained": whether a renamed age companion remains; "workLocationVersion" and
      "assetsTypeChangeVersion": the planned version decorator arguments as wire API versions;
      "exampleVersions": version folders to retain under the TypeSpec project's examples
      directory (all existing version folders currently match the enum); "applied": whether
      changes have been applied.
    environment:
      files: &a1
        - src: ../fixtures/001005-version-add-preview-after-preview/main.tsp
          dest: main.tsp
        - src: ../fixtures/001005-version-add-preview-after-preview/employee.tsp
          dest: employee.tsp
    constraints: &a2
      max_turns: 14
      max_tokens: 20000
    graders: &a3
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
          disallowed:
            - azsdk-common-typespec-naming
      - type: tool-calls
        config:
          required:
            - name: ^web_fetch$
              pattern: 02-preview-after-preview
            - name: ^(view|powershell|bash|rg)$
              pattern: main\.tsp|employee\.tsp
          disallowed:
            - name: ^(edit|create|apply_patch)$
      - &a4
        type: output-matches
        config:
          pattern: '"versions"\s*:\s*\[\s*"2021-10-01"\s*,\s*"2025-05-04-preview"\s*\]'
      - &a5
        type: output-matches
        config:
          pattern: '"ageDeclaration"\s*:\s*"(?:/\*\*[^"]*\*/(?:\\[rn]|\s)*)?age\?\s*:\s*int32\s*;"'
      - &a6
        type: output-matches
        config:
          pattern: '"oldAgeRetained"\s*:\s*false'
      - &a7
        type: output-matches
        config:
          pattern: '"workLocationVersion"\s*:\s*"2025-05-04-preview"'
      - &a8
        type: output-matches
        config:
          pattern: '"assetsTypeChangeVersion"\s*:\s*"2025-05-04-preview"'
      - &a9
        type: output-matches
        config:
          pattern: '"exampleVersions"\s*:\s*\[\s*"2021-10-01"\s*,\s*"2025-05-04-preview"\s*\]'
      - &a10
        type: output-matches
        config:
          pattern: '"applied"\s*:\s*false'
  - name: 001014-preview-replacement-reverses-excluded-default-forced
    tags:
      suite: versioning
      mode: forced
    prompt: |
      @azure-typespec-author Plan the TypeSpec source changes only. Project analysis and intake are complete,
      including user confirmation of the feature exclusions below. Retrieve and follow the
      authoritative preview-after-preview versioning guide at
      https://azure.github.io/typespec-azure/docs/howtos/versioning/02-preview-after-preview/.
      The supplied main.tsp and employee.tsp are the relevant existing ARM declarations. Add
      2025-05-04-preview, exclude the preview's added age default, and carry all other
      features forward. Client configuration is explicitly opted out.

      Use the files and retrieved document to build the source plan only; do not edit files,
      compile, or generate. Return JSON with: "versions": the ordered wire API versions after
      the change; "ageDeclaration": the complete planned age property including decorators;
      "oldAgeRetained": whether a renamed age companion remains; "workLocationVersion" and
      "assetsTypeChangeVersion": the planned version decorator arguments as wire API versions;
      "exampleVersions": version folders to retain under the TypeSpec project's examples
      directory (all existing version folders currently match the enum); "applied": whether
      changes have been applied.
    environment:
      files: *a1
    constraints: *a2
    graders: *a3
  - name: 001014-preview-replacement-reverses-excluded-default-no-skill
    tags:
      suite: versioning
      mode: no-skill
    prompt: |
      Plan the TypeSpec source changes only. Project analysis and intake are complete,
      including user confirmation of the feature exclusions below. Retrieve and follow the
      authoritative preview-after-preview versioning guide at
      https://azure.github.io/typespec-azure/docs/howtos/versioning/02-preview-after-preview/.
      The supplied main.tsp and employee.tsp are the relevant existing ARM declarations. Add
      2025-05-04-preview, exclude the preview's added age default, and carry all other
      features forward. Client configuration is explicitly opted out.

      Use the files and retrieved document to build the source plan only; do not edit files,
      compile, or generate. Return JSON with: "versions": the ordered wire API versions after
      the change; "ageDeclaration": the complete planned age property including decorators;
      "oldAgeRetained": whether a renamed age companion remains; "workLocationVersion" and
      "assetsTypeChangeVersion": the planned version decorator arguments as wire API versions;
      "exampleVersions": version folders to retain under the TypeSpec project's examples
      directory (all existing version folders currently match the enum); "applied": whether
      changes have been applied.
    environment:
      files: *a1
    constraints: *a2
    graders:
      - type: tool-calls
        config:
          required:
            - name: ^web_fetch$
              pattern: 02-preview-after-preview
            - name: ^(view|powershell|bash|rg)$
              pattern: main\.tsp|employee\.tsp
          disallowed:
            - name: ^(edit|create|apply_patch)$
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
      - *a9
      - *a10
version: "1.0"
