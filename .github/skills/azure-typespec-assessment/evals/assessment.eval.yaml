name: azure-typespec-assessment-eval
description: Routing and report-generation coverage for azure-typespec-assessment.
type: capability

tags:
  area: azure-typespec-assessment
  type: ci-gate

defaults:
  runs: 1
  timeout: "180s"
  model: gpt-5.4
  judge_model: gpt-5.4
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: confirm-missing-local-baseline
    tags:
      behavior: baseline-confirmation
    prompt: |
      Use azure-typespec-assessment to assess the current TypeSpec changes in the
      Microsoft.ServiceNetworking/ServiceNetworking specification.
    environment: &baseline_confirmation_environment
      skills:
        - fixtures/routing/azure-typespec-assessment
      files:
        - src: ../SKILL.md
          dest: production-assessment-SKILL.md
        - src: ../references
          dest: references
    graders: &baseline_confirmation_graders
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]
      - type: tool-calls
        config:
          required: ["^(view|powershell|bash)$"]
      - type: output-matches
        config:
          pattern: '(?is)(confirm|compare|baseline).{0,100}origin/main.{0,100}(branch|commit).*\?'
      - type: prompt
        config:
          prompt: |
            The user has not selected a baseline. The agent must ask whether to
            compare against origin/main or another branch/commit and wait.
            Inspect tool arguments as well as messages: merely announcing
            origin/main, asking only about scope, or starting preparation fails.
            Reading skill instructions or locating the workspace is allowed;
            git merge-base, creating assessment work artifacts, compiling, or
            running analysis before an answer is not. A question in the final
            response is acceptable when no user-question tool is available.
    constraints: &baseline_confirmation_constraints
      max_turns: 3
      max_tokens: 100000

  - name: assessment-approval-does-not-confirm-baseline
    tags:
      behavior: baseline-confirmation
    prompt: |
      I approve the read-only assessment. Use azure-typespec-assessment to assess
      the current TypeSpec changes in the
      Microsoft.ServiceNetworking/ServiceNetworking specification.
    environment: *baseline_confirmation_environment
    graders: *baseline_confirmation_graders
    constraints: *baseline_confirmation_constraints

  - name: trigger-assess-current-typespec-diff
    prompt: "Assess the current TypeSpec changes in the local Microsoft.Network spec against main."
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]

  - name: trigger-check-typespec-breaking-impact
    prompt: "Review my current TypeSpec diff for REST and downstream breaking changes."
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]

  - name: trigger-explain-typespec-rest-impact
    prompt: "Explain the semantic intent and Azure Guidelines impact of the local TypeSpec changes."
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]

  - name: anti-trigger-add-typespec-api-version
    tags:
      boundary: authoring
    prompt: "Add stable API version 2027-01-01 to the local Microsoft.Widget TypeSpec service."
    environment: &authoring_competition
      skills:
        - ..
        - fixtures/routing/azure-typespec-author
      files:
        - src: ../../azure-typespec-author/SKILL.md
          dest: production-author-SKILL.md
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-author"]
          disallowed: ["azure-typespec-assessment"]
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs');const d=p=>fs.readFileSync(p,'utf8').match(/^description: (.+)$/m)?.[1];if(d('production-author-SKILL.md')!==d('azure-typespec-author/SKILL.md'))process.exit(1)"
          expected_exit_code: 0
    constraints: &authoring_routing_constraints
      max_turns: 3
      max_tokens: 100000

  - name: anti-trigger-fix-typespec-breaking-change
    tags:
      boundary: authoring
    prompt: "Fix the breaking change in my current Microsoft.Widget TypeSpec diff by applying the correct versioning decorators."
    environment: *authoring_competition
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-author"]
          disallowed: ["azure-typespec-assessment"]
    constraints: *authoring_routing_constraints

  - name: anti-trigger-mitigate-typespec-sdk-impact
    tags:
      boundary: authoring
    prompt: "Mitigate the SDK impact of changing Widget.mode from string to an enum by editing the local .tsp files."
    environment: *authoring_competition
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-author"]
          disallowed: ["azure-typespec-assessment"]
    constraints: *authoring_routing_constraints

  - name: anti-trigger-analyze-sdk-pipeline
    prompt: "Analyze the failed Azure SDK CI pipeline run 123456 and summarize the root cause."
    environment:
      skills:
        - ../../azsdk-common-pipeline-analysis
    graders:
      - type: skill-invocation
        config:
          required: ["azsdk-common-pipeline-analysis"]
          disallowed: ["azure-typespec-assessment"]

  - name: anti-trigger-generate-sdk-locally
    prompt: "Generate and build the Python SDK locally from my Microsoft.Widget TypeSpec."
    environment:
      skills:
        - ../../azsdk-common-generate-sdk-locally
    graders:
      - type: skill-invocation
        config:
          required: ["azsdk-common-generate-sdk-locally"]
          disallowed: ["azure-typespec-assessment"]

  - name: anti-trigger-resolve-apiview-feedback
    prompt: "Resolve the APIView feedback on Azure SDK pull request 12345."
    environment:
      skills:
        - ../../azsdk-common-apiview-feedback-resolution
    graders:
      - type: skill-invocation
        config:
          required: ["azsdk-common-apiview-feedback-resolution"]
          disallowed: ["azure-typespec-assessment"]

  - name: retain-pr-44988-html-report
    tags:
      behavior: report-rendering
    prompt: |
      Use azure-typespec-assessment to validate the supplied PR 44988 assessment
      fixture and render its final HTML report to output/assessment.html.
      Run scripts/validate-assessment.mjs and scripts/render-assessment-html.mjs
      against assessment.json. This is an existing-report replay, not a fresh
      source assessment.
    environment:
      files:
        - src: assessments/44988/assessment.json
          dest: assessment.json
        - src: ../scripts
          dest: scripts
        - src: ../references
          dest: references
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]
      - type: tool-calls
        config:
          required:
            - "^(powershell|bash)$"
      - type: run-command
        config:
          command: "node scripts/validate-assessment.mjs assessment.json"
          expected_exit_code: 0
      - type: run-command
        config:
          command: "node scripts/render-assessment-html.mjs assessment.json output/assessment.html"
          expected_exit_code: 0
      - type: file-exists
        config:
          path: "output/assessment.html"
      - type: file-matches
        config:
          path: "output/assessment.html"
          pattern: "FirewallPolicies\\.createOrUpdate"
